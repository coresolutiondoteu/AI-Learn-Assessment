<script>
(()=>{'use strict';
const DATA=JSON.parse(document.querySelector('#academy-data').textContent),M=DATA.modules,Q=DATA.questions,V=DATA.glossary,R=DATA.resources,SR=DATA.sourceLibrary,PAT=DATA.patterns,CAP=DATA.capstones,WEEKS=DATA.studyPlan;
const MOD=Object.fromEntries(M.map(x=>[x.id,x])),QMAP=Object.fromEntries(Q.map(x=>[x.id,x])),CLINICS=Object.fromEntries((DATA.clinics||[]).map(c=>[c.id,c]));

const LEVEL={1:{name:'Foundations',short:'L1 · FOUNDATION',weight:30},2:{name:'Applied understanding',short:'L2 · APPLIED',weight:50},3:{name:'Engineering judgment',short:'L3 · JUDGMENT',weight:20}};
const levelOf=q=>q.level||(q.difficulty==='foundation'?1:2);
const levelTag=q=>`<span class="tag lvl-${levelOf(q)}">${E(LEVEL[levelOf(q)].short)}</span>`;
function evidenceTable(rows){if(!Array.isArray(rows)||!rows.length)return '';return `<div class="scenario-evidence"><div class="eyebrow">OBSERVED EVIDENCE</div><div class="table-wrap"><table class="progress-table"><thead><tr>${rows[0].map(x=>`<th>${E(x)}</th>`).join('')}</tr></thead><tbody>${rows.slice(1).map(r=>`<tr>${r.map(x=>`<td>${E(x)}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`}
function questionStem(q){return `${q.scenario?`<div class="question-scenario"><strong>Engineering scenario</strong><p>${E(q.scenario)}</p></div>`:''}${evidenceTable(q.evidence)}<h2 class="question-prompt">${E(q.question)}</h2>`}
function gradeBreakdown(items,answers){return [1,2,3].map(level=>{const relevant=items.filter(x=>levelOf(QMAP[x.id])===level),n=relevant.filter(x=>answers[x.id]===QMAP[x.id].answer).length;return {level,correct:n,count:relevant.length,pct:relevant.length?Math.round(100*n/relevant.length):0}})}
function sampleLevel(mod,lev,count,avoid=new Set()){const eligible=Q.filter(x=>x.module===mod&&levelOf(x)===lev&&!avoid.has(x.id));
 if(eligible.length<count)throw Error('Not enough level '+lev+' questions in '+mod);
 let rank=lev===2?[...shuffle(eligible.filter(x=>x.quality==='curated')),...shuffle(eligible.filter(x=>x.quality!=='curated'))]:shuffle(eligible);
 return rank.slice(0,count).map(q=>({id:q.id,options:shuffle(q.options)}));}
function sampleBlueprint(mode,module,length){const quotas={1:Math.round(length*.30),2:Math.round(length*.50),3:Math.round(length*.20)};
 if(mode==='section'){const seen=new Set(),selected=[];for(const lev of [1,2,3])for(const rec of sampleLevel(module,lev,quotas[lev],seen)){selected.push(rec);seen.add(rec.id)}return shuffle(selected)}
 const mods=shuffle(M.map(x=>x.id)),per=length/mods.length,allocation=Object.fromEntries(mods.map(x=>[x,[]]));
 // Start each domain with one applied problem; distribute the remaining difficulty quota evenly.
 for(const m of mods)allocation[m].push(2);quotas[2]-=mods.length;
 for(const lev of [3,1,2]){let left=quotas[lev];while(left--){const eligible=shuffle(mods).filter(m=>allocation[m].length<per).sort((a,b)=>{
   let aCount=allocation[a].filter(x=>x===lev).length,bCount=allocation[b].filter(x=>x===lev).length;
   return aCount-bCount||allocation[a].length-allocation[b].length});
   if(!eligible.length)throw Error('Exam blueprint exhausted');allocation[eligible[0]].push(lev);
 }}
 let result=[];for(const mod of mods){let seen=new Set();for(const lev of [1,2,3]){let n=allocation[mod].filter(x=>x===lev).length;for(const rec of sampleLevel(mod,lev,n,seen)){result.push(rec);seen.add(rec.id)}}}
 if(result.length!==length)throw Error('Blueprint count mismatch');return shuffle(result);
}
function levelSummary(items,answers){let breakdown=gradeBreakdown(items,answers);return `<div class="level-summary">${breakdown.map(x=>`<div class="level-mini lvl-${x.level}"><span class="eyebrow">${E(LEVEL[x.level].short)}</span><strong>${x.correct}/${x.count}</strong><small>${x.count?x.pct+'% within level':'No items'}</small></div>`).join('')}</div>`}
function allDistractors(q){let alternatives=q.options.filter(x=>x!==q.answer);return `<details class="alt-analysis"><summary>Why the other options do not fit</summary>${alternatives.map(opt=>`<div class="alt-detail"><b>${E(opt)}</b><p>${E(q.distractor_notes?.[opt]||'Compare this option against the stated evidence, authority boundary and constraints; the correct answer is the one fully supported by them.')}</p></div>`).join('')}</details>`}

const KEY='ai-systems-academy-v1';let storageOK=true;
function defaults(){return {version:1,doneTopics:{},doneLabs:{},labSteps:{},labEvidence:{},checkpoints:{},vocab:{},exams:[],activeExam:null,clinics:{}}}
function load(){try{const a=JSON.parse(localStorage.getItem(KEY)||'null');return a&&a.version===1?{...defaults(),...a}:defaults()}catch(e){storageOK=false;return defaults()}}
let S=load();let UI={screen:'home',mod:'stack',tab:'concepts',lesson:0,navOpen:false,search:'',filter:'all',vocabModule:'all',vocabFilter:'all',vocabIndex:0,vocabReveal:false,selectedLayer:9,examModule:'stack',examLength:20,reviewId:null,practice:null,guided:null,practiceMode:'ready',reviewWrongOnly:true,patternSelection:'P5',capstoneSelection:'A',libraryGroup:'all'};
const app=document.getElementById('app');
const E=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7);
const pick=(array)=>[...array].sort(()=>0.5-Math.random()); // only used for decorative sampling; exam uses Fisher-Yates below
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));storageOK=true}catch(e){storageOK=false}}
function toast(msg){let el=document.getElementById('toast');el.innerHTML='<div class="toast">'+E(msg)+'</div>';clearTimeout(toast._t);toast._t=setTimeout(()=>{el.innerHTML=''},2500)}
const SVG={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',book:'<path d="M4 5h7a3 3 0 0 1 3 3v12H6a2 2 0 0 0-2 2zM20 5h-4a3 3 0 0 0-3 3v12h5a2 2 0 0 1 2 2z"/>',layers:'<path d="m12 2 9 5-9 5-9-5 9-5ZM3 12l9 5 9-5M3 17l9 5 9-5"/>',flask:'<path d="M9 3h6M10 3v7l-6 9a2 2 0 0 0 2 3h12a2 2 0 0 0 2-3l-6-9V3M8 15h8"/>',check:'<path d="m5 12 4 4L19 6"/>',cards:'<rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 9h8M8 13h6"/>',chart:'<path d="M4 20V4M4 20h16M8 16v-4M12 16V8M16 16V6"/>',search:'<circle cx="11" cy="11" r="6"/><path d="m16 16 5 5"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',link:'<path d="M10 13a5 5 0 0 0 7 .1l3-3a5 5 0 0 0-7-7l-2 2M14 11a5 5 0 0 0-7-.1l-3 3a5 5 0 0 0 7 7l2-2"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',close:'<path d="M5 5 19 19M19 5 5 19"/>',download:'<path d="M12 3v12m-5-5 5 5 5-5M4 17v4h16v-4"/>',upload:'<path d="M12 20V8m-5 5 5-5 5 5M4 7V3h16v4"/>',compass:'<circle cx="12" cy="12" r="9"/><path d="m15.7 8.3-2.3 5.1-5.1 2.3 2.3-5.1z"/>',file:'<path d="M6 2h8l5 5v15H6zM14 2v6h5M9 12h7M9 16h7"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/>',shield:'<path d="M12 2 4 6v6c0 5 3 8 8 10 5-2 8-5 8-10V6zM9 12l2 2 4-4"/>',back:'<path d="M19 12H5m6 6-6-6 6-6"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 7h.01"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',refresh:'<path d="M21 12a9 9 0 0 1-16 5M3 12A9 9 0 0 1 19 7M19 2v5h-5M5 22v-5h5"/>',external:'<path d="M13 4h7v7M20 4l-9 9M19 14v6H4V5h6"/>',play:'<path d="m8 5 11 7-11 7z"/>'};
const I=(name,cls='')=>`<svg class="icon ${cls}" viewBox="0 0 24 24" aria-hidden="true">${SVG[name]||SVG.info}</svg>`;
const doneCount=m=>m.topics.filter((x,i)=>S.doneTopics[m.id+':'+i]).length;
const labDone=m=>!!S.doneLabs[m.id];
const checkpoint=m=>S.checkpoints[m.id]?.best||0;
const completed=m=>doneCount(m)===m.topics.length&&labDone(m)&&checkpoint(m)>=80;
const pct=m=>Math.round(100*(doneCount(m)+(labDone(m)?1:0)+(checkpoint(m)>=80?1:0))/(m.topics.length+2));
function allSteps(){return M.reduce((n,m)=>n+doneCount(m)+(labDone(m)?1:0)+(checkpoint(m)>=80?1:0),0)}
function avgProgress(){return Math.round(100*allSteps()/(M.length*8))}
function learnedTerms(){return Object.values(S.vocab).filter(x=>x.stage>=2).length}
function dueTerms(){return V.filter(x=>!S.vocab[x.term]||S.vocab[x.term].due<=Date.now()).length}
const date=x=>new Date(x).toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
const getResource=id=>R.find(x=>x.id===id);
function resourceLink(id){let r=getResource(id);if(!r)return '';return `<div class="resource-item">${I('external')}<div><a href="${E(r.url)}" target="_blank" rel="noopener noreferrer">${E(r.title)} ${I('external','sm')}</a><p>${E(r.note)}</p></div></div>`}
function pdfButton(m){return `<a class="btn ghost small" href="docs/AI_Systems_Field_Manual.pdf#page=${parseInt(m.pages)||4}" target="_blank">${I('file')} PDF pp. ${E(m.pages)}</a>`}
function route(screen,mod,tab,lesson){UI.screen=screen;UI.mod=mod||UI.mod;UI.tab=tab||'concepts';UI.lesson=Number.isInteger(lesson)?lesson:0;UI.navOpen=false;location.hash=screen==='learn'?`learn/${UI.mod}/${UI.tab}/${UI.lesson}`:screen;render();window.scrollTo({top:0,behavior:'instant'})}
function restoreRoute(){const a=decodeURIComponent(location.hash.slice(1)).split('/');if(a[0]==='learn'&&MOD[a[1]]){UI.screen='learn';UI.mod=a[1];UI.tab=['concepts','trace','lab','clinic','checkpoint'].includes(a[2])?a[2]:'concepts';UI.lesson=Math.min(5,Math.max(0,parseInt(a[3])||0))}else if(['home','curriculum','stack','patterns','vocab','labs','casebook','capstones','assessment','progress','library','search','results'].includes(a[0]))UI.screen=a[0]||'home';else UI.screen='home';render()}
function navbtn(screen,label,icon){return `<button class="nav-link ${UI.screen===screen?'active':''}" data-screen="${screen}">${I(icon)} <span>${label}</span></button>`}
function sidebar(){return `<aside class="sidebar ${UI.navOpen?'open':''}"><div class="brand"><div class="brand-icon">${I('layers','lg')}</div><div><div class="brand-title">AI Systems Academy</div><div class="brand-sub">Field manual · 2026</div></div></div><div class="nav-sub">WORKSPACE</div><nav class="side-links">${navbtn('home','Overview','home')}${navbtn('curriculum','Learning path','book')}${navbtn('stack','Interactive stack','layers')}${navbtn('patterns','11 architecture patterns','compass')}${navbtn('vocab','Vocabulary & recall','cards')}${navbtn('labs','Practical labs','flask')}${navbtn('casebook','Engineering clinics','target')}${navbtn('capstones','Four capstones','target')}${navbtn('assessment','Assessment center','target')}${navbtn('progress','My progress','chart')}${navbtn('library','Resource library','link')}</nav><div class="nav-sub" style="margin-top:20px">COURSE MODULES</div><div class="module-nave">${M.map((m,i)=>`<button class="module-nav ${UI.screen==='learn'&&UI.mod===m.id?'active':''}" data-mod="${m.id}"><span class="module-number">${String(i+1).padStart(2,'0')}</span><span>${E(m.title.slice(5))}</span>${completed(m)?`<span class="done">${I('check','sm')}</span>`:''}</button>`).join('')}</div><div class="side-footer"><div class="side-footer-card"><div style="font-size:12px;font-weight:700"><span class="dot"></span> Offline-first learning</div><small>${storageOK?'Progress stored in this browser.':'Local storage unavailable: export progress to keep it.'} External study links require internet.</small></div></div></aside>`}
function topbar(){const titles={home:'Overview',curriculum:'Course / Learning path',stack:'Architecture / Stack map',patterns:'Architecture / Pattern atlas',capstones:'Projects / Capstones',vocab:'Practice / Vocabulary',labs:'Practice / Labs',casebook:'Practice / Engineering clinics',assessment:'Assessment center',progress:'Results / My progress',library:'Reference library',search:'Search',results:'Assessment / Results',learn:`Learning / ${MOD[UI.mod].title}`};return `<header class="topbar"><div class="top-left"><button class="mobile-toggle" data-action="navtoggle" aria-label="Open navigation">${I('menu','lg')}</button><span class="crumb">${E(titles[UI.screen]||'Academy')}</span></div><div class="top-right"><form id="searchForm" class="top-search" role="search">${I('search','sm')}<input id="searchInput" aria-label="Search curriculum and vocabulary" value="${E(UI.search)}" placeholder="Search a concept..."></form><div class="top-metric"><span>${allSteps()}/80</span><div class="mini-progress"><b style="width:${avgProgress()}%"></b></div><strong>${avgProgress()}%</strong></div></div></header>`}
function stats(){return `<div class="grid stats"><div class="card stat"><span class="eyebrow">LEARNING</span><span class="num">${M.reduce((n,m)=>n+m.topics.length,0)}</span><span class="cap">connected concept lessons</span><span class="meta">${DATA.clinics.length} evidence-driven clinics · 30 stages</span></div><div class="card stat"><span class="eyebrow">PRACTICE</span><span class="num">10</span><span class="cap">hands-on labs</span><span class="meta">self-evidenced practice</span></div><div class="card stat"><span class="eyebrow">RECALL</span><span class="num">${V.length}</span><span class="cap">technical vocabulary cards</span><span class="meta">spaced retrieval practice</span></div><div class="card stat"><span class="eyebrow">ASSESS</span><span class="num">${Q.length}</span><span class="cap">four-option questions</span><span class="meta">L1 ${Q.filter(x=>levelOf(x)===1).length} · L2 ${Q.filter(x=>levelOf(x)===2).length} · L3 ${Q.filter(x=>levelOf(x)===3).length}</span></div></div>`}
function moduleCard(m,i){let dp=doneCount(m);return `<article class="card mod-card"><div class="mod-top"><div class="mod-index">${String(i+1).padStart(2,'0')}</div><span class="tag">${E(m.stage)}</span></div><div><h3>${E(m.title.slice(5))}</h3><p>${E(m.subtitle)}</p></div><div><div class="linkrow" style="justify-content:space-between;margin-bottom:7px"><span class="fine">${dp}/6 concepts · clinic ${clinicCount(CLINICS[m.id])}/3 · ${labDone(m)?'Lab logged':'Lab pending'}</span><strong class="fine">${pct(m)}%</strong></div><div class="bar"><i style="width:${pct(m)}%"></i></div></div><div class="mod-foot"><span>Manual pp. ${E(m.pages)}</span><button data-mod="${m.id}" class="txtbtn">${completed(m)?'Review':'Study module'} ${I('arrow','sm')}</button></div></article>`}
function home(){let next=M.find(m=>!completed(m))||M[0];let n=M.indexOf(next);return `<section class="hero"><div class="hero-content"><div class="eyebrow">A structured journey from beginner to systems engineer</div><h1>Understand the stack.<br>Engineer the system.</h1><p>Learn what each component does, how layers connect, which trade-offs matter, and how to prove that a model-powered workflow actually works.</p><div class="hero-actions"><button class="btn hero-primary" data-mod="${next.id}">${I('play')} ${doneCount(next)>0?'Continue':'Begin'} module ${n+1}</button><button class="btn hero-ghost" data-screen="stack">${I('layers')} Explore all layers</button></div></div></section>${stats()}<div class="grid two-col"><div class="card card-pad"><div class="eyebrow">YOUR NEXT STEP</div><h2 style="margin:9px 0">${E(next.title)}</h2><p>${E(next.subtitle)}</p><div class="bar" style="margin:20px 0 10px"><i style="width:${pct(next)}%"></i></div><div class="linkrow" style="justify-content:space-between"><span class="fine">${doneCount(next)}/6 concepts · checkpoint ${checkpoint(next)}%</span><button class="btn small primary" data-mod="${next.id}">Open module ${I('arrow','sm')}</button></div></div><div class="card card-pad"><div class="eyebrow">STUDY METHOD</div><h3 style="margin:8px 0 14px">Read → Trace → Build → Diagnose → Check → Recall</h3><p style="font-size:13px">A lesson marked “understood” is a reading signal, not a certification. Completion also requires a documented lab and a checkpoint of 80% or above.</p><div class="linkrow" style="gap:8px;flex-wrap:wrap"><button class="btn ghost small" data-screen="vocab">${I('cards')} ${dueTerms()} recall cards due</button><a class="btn ghost small" href="docs/Opening_Study_Guide.pdf" target="_blank">${I('file')} Two-page guide</a></div></div></div><div class="section-head"><div><span class="eyebrow">FOUR LEARNING PASSES</span><h2>From orientation to evidence</h2></div><button class="txtbtn" data-screen="curriculum">View full roadmap ${I('arrow','sm')}</button></div><div class="grid four-col"><div class="card stage-card"><span class="step">01</span><h3>MAP</h3><p>Layer responsibilities, ownership, terms and boundaries. Start with the stack.</p></div><div class="card stage-card"><span class="step">02</span><h3>UNDERSTAND</h3><p>Tokens, models, prefill, KV memory, serving and context assembly.</p></div><div class="card stage-card"><span class="step">03</span><h3>BUILD</h3><p>Bounded agents, tools, MCP, retrieval, evaluation and security.</p></div><div class="card stage-card"><span class="step">04</span><h3>PROVE</h3><p>Measured decisions, regression gates, capstones and review.</p></div></div><div class="section-head"><div><span class="eyebrow">CURRICULUM</span><h2>Explore the modules</h2></div><span class="fine">${M.filter(completed).length}/10 modules complete</span></div><div class="grid module-grid">${M.map(moduleCard).join('')}</div><div class="doc-banner"><div><strong>New: evidence-driven engineering clinics</strong><p>Practice real diagnosis, evaluate measurements and defend architecture decisions across all ten modules.</p></div><button class="btn ghost small" data-screen="casebook">Explore casebook ${I('arrow','sm')}</button></div>${docbanner()}${footer()}`}
function docbanner(){return `<div class="doc-banner"><div><strong>Linked to the exact 46-page source manual</strong><p>Every module shows its corresponding PDF pages, source readings, lab and vocabulary. The PDFs are included in this offline package.</p></div><a class="btn ghost small" href="docs/AI_Systems_Field_Manual.pdf" target="_blank">${I('file')} Open source manual</a></div>`}
function footer(){return `<div class="footnote">AI Systems Academy · Independent self-study companion · Source manual dated 08 Nov 2026. This browser-only app does not run an AI model, execute external commands or validate lab work. Study links open third-party sites. Course progress is self-reported; scored quizzes measure recall and applied reasoning, not professional certification.</div>`}
function curriculum(){return `<div class="section-head"><div><div class="eyebrow">10 MODULES · 60 LESSONS</div><h1 style="margin:7px 0">A connected path, not a link dump.</h1><p>Start with language and architecture, then read a request trace, build constrained workflows, and finish with operational evidence.</p></div></div><div class="card card-pad"><h3>16-week suggested cadence</h3><div class="grid four-col">${[['W1–4','Map and mechanics','Stack, tokens, inference and local serving.'],['W5–8','Contracts and control','Context budgets, agent patterns, tools and protocol trust.'],['W9–12','Evidence and safety','RAG, evaluations, security and negative tests.'],['W13–16','Design defense','Capstones, measured trade-offs and review.']].map(x=>`<div><span class="tag">${x[0]}</span><h3 style="margin:11px 0 5px;font-size:14px">${x[1]}</h3><p style="font-size:12px">${x[2]}</p></div>`).join('')}</div></div><div class="section-head"><h2>Module catalogue</h2><span class="fine">Select any module; earlier foundations are recommended but not forced.</span></div><div class="grid module-grid">${M.map(moduleCard).join('')}</div>${studySchedule()}${footer()}`}
function moduleView(){let m=MOD[UI.mod];return `<div class="module-banner"><div><div class="eyebrow">${E(m.stage)} · ${E(m.chapters)} in the field manual</div><h1>${E(m.title)}</h1><p>${E(m.subtitle)}</p></div><div class="reading"><span>PRIMARY READING</span>${pdfButton(m)}</div></div><div class="module-outcomes">${m.outcomes.map(x=>`<div class="outcome">${E(x)}</div>`).join('')}</div>${m.id==='harness'?`<div class="doc-banner"><div><strong>Compare all eleven architecture patterns</strong><p>Direct completion, extraction, routing, pipelines, RAG, fan-out, bounded agents, planner, specialists, approval and durable workflows.</p></div><button class="btn ghost small" data-screen="patterns">Pattern atlas ${I('arrow','sm')}</button></div>`:m.id==='production'?`<div class="doc-banner"><div><strong>Four portfolio capstones</strong><p>Grounded QA, read-only infrastructure assistant, coding harness and local inference SLO lab.</p></div><button class="btn ghost small" data-screen="capstones">Capstone tracks ${I('arrow','sm')}</button></div>`:''}<div class="tabs">${[['concepts','01 Concepts'],['trace','02 Request trace'],['lab','03 Practical lab'],['clinic','04 Engineering clinic'],['checkpoint','05 Checkpoint']].map(([t,n])=>`<button class="tab ${UI.tab===t?'active':''}" data-tab="${t}">${n}${t==='lab'&&labDone(m)?' ✓':t==='checkpoint'&&checkpoint(m)>=80?' ✓':''}</button>`).join('')}</div>${UI.tab==='concepts'?concept(m):UI.tab==='trace'?trace(m):UI.tab==='lab'?labPage(m):UI.tab==='clinic'?clinicPage(m):checkpointPage(m)}<div class="section-head"><h3>Continue into the source material</h3></div><div class="resource-list">${m.resources.map(resourceLink).join('')}</div>${footer()}`}
function concept(m){let t=m.topics[UI.lesson],d=!!S.doneTopics[m.id+':'+UI.lesson];return `<div class="lesson-layout"><aside class="card lesson-rail">${m.topics.map((x,i)=>`<button class="lesson-rail-btn ${UI.lesson===i?'active':''}" data-lesson="${i}"><span class="number">${S.doneTopics[m.id+':'+i]?'✓':String(i+1).padStart(2,'0')}</span>${E(x.name)}</button>`).join('')}</aside><article class="card lesson-body"><div class="linkrow" style="justify-content:space-between;gap:15px"><span class="eyebrow">CONCEPT ${UI.lesson+1} OF ${m.topics.length}</span><span class="pill ${d?'pass':'neutral'}">${d?'Marked understood':'Learning'}</span></div><h2>${E(t.name)}</h2><div class="callout"><strong>The problem this solves</strong><p>${E(t.problem)}</p></div><div class="eyebrow" style="margin-bottom:8px">EXPLAINED</div><p>${E(t.explain)}</p><div class="detail-grid"><div class="detail-box"><h4>${I('compass','sm')} In practice</h4><p>${E(t.example)}</p></div><div class="detail-box"><h4>${I('layers','sm')} What changes / trade-off</h4><p>${E(t.tradeoff)}</p></div><div class="detail-box warn" style="grid-column:1/-1"><h4>${I('shield','sm')} Diagnose the failure</h4><p>${E(t.failure)}</p></div></div><div class="learning-deeper" style="margin-top:22px"><strong>Engineering lens · from understanding to evidence</strong><p><b>Look for this failure:</b> ${E(t.failure)}</p><p><b>Propose the test:</b> What observable result would distinguish this boundary from an adjacent one? Which alternative would you reject, and on what evidence?</p><p><b>Make a decision:</b> ${E(t.tradeoff)}</p><button class="txtbtn" data-tab="clinic">Apply the lesson in an evidence-driven engineering clinic ${I('arrow','sm')}</button></div><div class="eyebrow" style="margin-bottom:10px">CONNECTIONS ACROSS THE SYSTEM</div><div class="rel-links">${t.connections.map(id=>`<button class="rel-btn" data-mod="${id}">${E(MOD[id]?.title.slice(5)||id)} ${I('arrow','sm')}</button>`).join('')}</div><div class="lesson-next"><div><button class="btn ${d?'ghost':'soft'}" data-action="toggle-concept">${I('check','sm')} ${d?'Marked — undo':'Mark as understood'}</button></div><div style="display:flex;gap:8px">${UI.lesson>0?`<button class="btn ghost small" data-lesson="${UI.lesson-1}">${I('back','sm')} Previous</button>`:''}<button class="btn primary small" data-action="next-lesson">${UI.lesson===5?'Trace this workflow':'Next concept'} ${I('arrow','sm')}</button></div></div></article></div>`}
function trace(m){return `<section><div class="section-head"><div><div class="eyebrow">FOLLOW THE REQUEST</div><h2>Six hand-offs, six owners.</h2><p>Ask at each step: what entered, what left, what could fail, and what proof would distinguish success?</p></div><button class="btn ghost small" data-screen="stack">${I('layers')} Full layer map</button></div><div class="trace-grid">${m.pipeline.map((x,i)=>`<article class="trace-step"><span class="k">STAGE ${String(i+1).padStart(2,'0')}</span><h3>${E(x)}</h3><p>${E(['Identify intent, data boundary and task limits.','Preserve the correct role, source and scope.','Choose only capabilities needed for the next step.','Validate request/response contract and identity.','Measure time, memory, error and model output.','Verify acceptance criteria independently of generated claims.'][i])}</p></article>`).join('')}</div><div class="trace-notice">${I('info','sm')} The pipeline is a conceptual teaching map. A real system can reorder, repeat, skip or parallelize stages. The control plane owns permission decisions; lower-trust data never becomes authority merely by entering a prompt.</div><div class="grid two-col" style="margin-top:18px"><div class="card card-pad"><h3>Trace exercise</h3><p>Pick one failure in this module. Write down its first observable symptom, the owning component, one negative test and the minimum evidence needed to prove a repair.</p><button class="btn primary small" data-tab="lab">Go to lab ${I('arrow','sm')}</button></div><div class="card card-pad"><h3>Read the detailed architecture</h3><p>Source manual pp. ${E(m.pages)} expands these components with diagrams and reference patterns.</p>${pdfButton(m)}</div></div></section>`}
function labPage(m){let l=m.lab,steps=S.labSteps[m.id]||[],all=l.steps.every((x,i)=>steps[i]);let note=S.labEvidence[m.id]||'';return `<div class="section-head"><div><div class="eyebrow">LAB ${String(M.indexOf(m)+1).padStart(2,'0')} · ${l.minutes} MIN · SELF-DOCUMENTED</div><h2>${E(l.title)}</h2><p>${E(l.goal)}</p></div><span class="pill ${labDone(m)?'pass':'neutral'}">${labDone(m)?'Evidence logged':'Not yet logged'}</span></div><div class="grid two-col"><div class="card card-pad"><div class="eyebrow">PREREQUISITES</div><p style="margin:8px 0 0">${E(l.setup)}</p></div><div class="card card-pad"><div class="eyebrow">SAFETY</div><p style="margin:8px 0 0">${E(l.safety)}</p></div></div>${specialLab(m)}<div class="section-head"><h3>Runbook · ${l.steps.length} steps</h3><span class="fine">Mark what you actually performed.</span></div>${l.steps.map((st,i)=>`<div class="lab-step"><input type="checkbox" aria-label="Completed lab step ${i+1}" data-lab-step="${i}" ${steps[i]?'checked':''}><div style="flex:1"><h3>${String(i+1).padStart(2,'0')} — ${E(st.title)}</h3><p>${E(st.detail)}</p>${st.code?`<div class="code-wrap"><button class="copy-btn" data-code-step="${i}" title="Copy snippet">Copy</button><pre>${E(st.code)}</pre></div>`:''}</div></div>`).join('')}<div class="card lab-evidence"><h3>Evidence and reflection</h3><p style="font-size:13px">${E(l.evidence)} Save actual observations, a named artifact or a concise design rationale. The browser cannot check external commands or prove that a lab was executed.</p><div class="field"><label for="labNote">Your evidence (required, at least 30 characters)</label><textarea id="labNote" data-lab-evidence placeholder="Example: I ran a mock test, recorded inputs and outputs, and observed...">${E(note)}</textarea></div><div class="callout amber"><strong>Advanced extension</strong><p>${E(l.stretch)}</p></div><div class="linkrow" style="justify-content:space-between;flex-wrap:wrap"><span class="fine">${steps.filter(Boolean).length}/${l.steps.length} steps checked. Evidence is self-attested.</span><button class="btn primary" data-action="complete-lab">${I('check','sm')} ${labDone(m)?'Update lab log':'Log lab completion'}</button></div></div>`}
function specialLab(m){if(m.id==='inference'){let v=UI.calc||{layers:32,heads:8,dim:128,tokens:4096,bytes:2,seq:1};let bytes=2*v.layers*v.heads*v.dim*v.tokens*v.bytes*v.seq;return `<div class="tool-lab"><div class="eyebrow">INTERACTIVE MICRO-LAB</div><h3>KV cache estimator <span class="tag">Illustrative</span></h3><p>Simple key/value cache formula. It excludes allocator overhead, sliding windows, paging, quantized cache layouts and temporary buffers.</p><div class="calc-row">${[['layers','Layers'],['heads','KV heads'],['dim','Head dimension'],['tokens','Tokens per sequence'],['bytes','Bytes per element'],['seq','Active sequences']].map(([k,n])=>`<div class="field"><label>${n}</label><input data-calc="${k}" type="number" min="1" max="1000000" value="${E(v[k])}"></div>`).join('')}</div><div id="calcResult" class="calc-result">≈ ${(bytes/1048576).toFixed(1)} MiB</div><div class="micro">Formula: 2 × layers × KV heads × head dimension × tokens × bytes × sequences.</div></div>`}
 if(m.id==='context'){return `<div class="tool-lab"><div class="eyebrow">INTERACTIVE MICRO-LAB</div><h3>Validate a model-generated JSON contract</h3><p>Try valid JSON, wrong field types, extra keys or an invented evidence ID. Parsing and policy validation are separate.</p><div class="field"><label>Example model response</label><textarea id="jsonProbe" style="min-height:78px">{"claim":"The policy changed","evidence_ids":["P1"]}</textarea></div><div style="margin-top:11px"><button class="btn small primary" data-action="validate-json">Validate against contract</button></div><div id="jsonResult" class="micro" style="margin-top:11px">Required: claim as string; evidence_ids as nonempty array of IDs in {P1, P2}; no extra keys.</div></div>`}
 if(m.id==='rag'){return `<div class="tool-lab"><div class="eyebrow">INTERACTIVE MICRO-LAB</div><h3>Toy retrieval: relevance vs permission</h3><p>Three fictitious documents; a simple keyword matcher is a teaching aid, not an embedding engine. Choose a role and enter a query.</p><div class="filterbar"><select id="ragRole"><option value="public">Public viewer</option><option value="staff">Staff viewer</option></select><input id="ragQuery" aria-label="Search synthetic policy corpus" placeholder="e.g. retention policy"></div><button class="btn primary small" data-action="rag-search">Retrieve snippets</button><div id="ragResult" class="micro" style="margin-top:12px">Results will appear here. Restricted documents never enter a public viewer's retrieval set.</div></div>`}
 return ''}
 function learningPanel(q,selected){const term=V.find(v=>v.term===q.term),reflection={stack:'Name the control boundary and one way to verify it.',models:'What input artifact or representation would you inspect to check this claim?',inference:'Which assumption, unit or performance metric would you measure?',local:'What would change if you switched only the runtime or deployment location?',context:'Which evidence belongs in authoritative state, outside the prompt?',harness:'What does the trusted executor check before acting?',tools:'Which party owns authorization, independently of protocol discovery?',rag:'Which source, permission or retrieval metric would verify this answer?',eval:'Which negative test would you add to prove this is safe?',production:'Which release gate or operational metric would change your decision?'};let extra=q.learning_note||term?.contrast||'',definition=term?.definition||'',wrong=selected&&selected!==q.answer?q.distractor_notes?.[selected]:null;return `<div class="learning-deeper"><strong>Learn beyond the answer</strong>${extra?`<p>${E(extra)}</p>`:''}${wrong?`<p class="distractor"><strong>Why that alternative fails:</strong> ${E(wrong)}</p>`:''}${definition?`<p><b>Connected concept: ${E(q.term)}.</b> ${E(definition)}</p>`:''}<p class="reflect"><b>Apply it:</b> ${E(reflection[q.module]||'What would demonstrate this in practice?')}</p></div>`}
function sampleModule(mod,nAdvanced,nEasy){let pool=Q.filter(q=>q.module===mod),a=shuffle(pool.filter(q=>q.difficulty==='advanced')).slice(0,nAdvanced),b=shuffle(pool.filter(q=>q.difficulty==='foundation')).slice(0,nEasy);if(a.length!==nAdvanced||b.length!==nEasy)throw Error('Insufficient question pool');return shuffle([...a,...b]).map(q=>({id:q.id,options:shuffle(q.options)}))}
function checkpointPage(m){let pr=UI.practice;if(!pr||pr.module!==m.id)return `<div class="grid two-col"><div class="card card-pad"><span class="eyebrow">UNDERSTANDING CHECK</span><h2 style="margin:10px 0">5 questions. Instant explanations.</h2><p>One foundation, three applied cases and one engineering judgment question drawn randomly from this module. The pass target is 80% (4/5). A new attempt reshuffles content and answer positions.</p><div class="linkrow" style="margin:17px 0"><span class="pill neutral">Best ${checkpoint(m)}%</span><span class="pill">${S.checkpoints[m.id]?.attempts?.length||0} attempts</span></div><button class="btn primary" data-action="start-practice">${I('play')} Start checkpoint</button></div><div class="card card-pad"><span class="eyebrow">HOW TO USE THE RESULT</span><h3 style="margin:10px 0">Incorrect is useful information.</h3><p>Every answer links to its key term and its module. Review the explanation, revisit the concept, and try again after a short break rather than memorizing answer letters.</p><button class="btn ghost small" data-screen="vocab">Review vocabulary ${I('arrow','sm')}</button></div></div>`;
 if(pr.finished){let score=pr.questions.filter(q=>pr.answers[q.id]===QMAP[q.id].answer).length,percent=Math.round(100*score/pr.questions.length);return `<div class="card card-pad"><span class="eyebrow">CHECKPOINT REVIEW</span><h2 style="margin:11px 0">${score}/${pr.questions.length} correct · ${percent}% ${percent>=80?'— passed':'— retry recommended'}</h2><p>${percent>=80?'You met the checkpoint score. Continue with the practical lab and vocabulary recall.':'Review the missed concepts and take a new randomized attempt.'}</p><div class="linkrow"><button class="btn primary small" data-action="start-practice">New attempt ${I('refresh','sm')}</button><button class="btn ghost small" data-tab="concepts">Review lessons</button></div></div><div class="section-head"><h3>Explanation by question</h3></div>${pr.questions.map((item,i)=>{let q=QMAP[item.id],ok=pr.answers[item.id]===q.answer;return `<div class="result-row"><div class="question-meta"><span class="pill ${ok?'pass':'fail'}">${ok?'Correct':'Needs review'}</span><span ${levelTag(q)}</div><h3 style="margin:10px 0">${i+1}. ${E(q.question)}</h3>${evidenceTable(q.evidence)}<p>Your answer: <strong>${E(pr.answers[item.id]||'Not answered')}</strong></p><p>Best answer: <strong>${E(q.answer)}</strong></p><p class="why">${E(q.explanation)}</p>${learningPanel(q,pr.answers[item.id])}<button class="txtbtn" data-term="${E(q.term)}">Review ${E(q.term)} ${I('arrow','sm')}</button></div>`}).join('')}`}
 let item=pr.questions[pr.index],q=QMAP[item.id],answered=Object.prototype.hasOwnProperty.call(pr.answers,item.id),sel=pr.answers[item.id],hint=pr.hints[item.id];return `<div class="grid two-col" style="grid-template-columns:minmax(0,1.4fr) minmax(0,.6fr)"><div class="card question"><div class="question-meta"><span class="eyebrow">CHECKPOINT ${pr.index+1}/${pr.questions.length}</span><span ${levelTag(q)}</div>${questionStem(q)}<div class="question-options">${item.options.map((opt,i)=>`<button class="answer ${answered?(opt===q.answer?'correct':opt===sel?'wrong':''):''}" data-practice-answer="${E(opt)}" ${answered?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${E(opt)}</span></button>`).join('')}</div>${hint&&!answered?`<div class="hint-panel">${E(q.hint)}</div>`:''}${answered?`<div class="feedback ${sel===q.answer?'':'wrong'}"><strong>${sel===q.answer?'Supported answer':'Review the reasoning'}</strong><p>${E(q.explanation)}</p>${learningPanel(q,sel)}${allDistractors(q)}<button class="txtbtn" data-term="${E(q.term)}">Explain “${E(q.term)}” ${I('arrow','sm')}</button></div>`:''}<div class="lesson-next"><button class="btn ghost small" data-action="practice-hint" ${answered?'disabled':''}>${I('info','sm')} ${hint?'Hint shown':'Show hint'}</button><button class="btn primary" data-action="practice-next" ${answered?'':'disabled'}>${pr.index===pr.questions.length-1?'See checkpoint results':'Next question'} ${I('arrow','sm')}</button></div></div><div class="card card-pad"><h3>Learning mode</h3><p>Hints are available; feedback appears as soon as you answer. This is practice, not the scored final exam.</p><div class="bar"><i style="width:${Math.round(100*(pr.index+(answered?1:0))/pr.questions.length)}%"></i></div><div class="fine" style="margin-top:8px">${pr.index+(answered?1:0)} of ${pr.questions.length} attempted</div></div></div>`}
function vocab(){let words=V.filter(x=>(UI.vocabModule==='all'||x.module===UI.vocabModule)&&(!UI.search||[x.term,x.definition,x.contrast].join(' ').toLowerCase().includes(UI.search.toLowerCase()))&&(UI.vocabFilter!=='due'||!S.vocab[x.term]||S.vocab[x.term].due<=Date.now())&&(UI.vocabFilter!=='learning'||!S.vocab[x.term]||S.vocab[x.term].stage<2));if(UI.vocabIndex>=words.length)UI.vocabIndex=0;let w=words[UI.vocabIndex];return `<div class="section-head"><div><div class="eyebrow">ACTIVE RECALL · SPACED PRACTICE</div><h1 style="margin:8px 0 10px">Words that connect the layers.</h1><p>See a term, reconstruct its meaning and layer, reveal the answer, and decide whether to schedule it for review.</p></div></div><div class="grid three-col"><div class="card stat"><span class="num">${V.length}</span><span class="cap">terms mapped to modules</span></div><div class="card stat"><span class="num">${learnedTerms()}</span><span class="cap">terms reviewed successfully ≥2 times</span></div><div class="card stat"><span class="num">${dueTerms()}</span><span class="cap">new or due terms</span></div></div><div class="filterbar"><select id="vocabModule" aria-label="Vocabulary module"><option value="all">All modules</option>${M.map(x=>`<option value="${x.id}" ${UI.vocabModule===x.id?'selected':''}>${E(x.title)}</option>`).join('')}</select><select id="vocabFilter" aria-label="Recall filter"><option value="all" ${UI.vocabFilter==='all'?'selected':''}>All cards</option><option value="due" ${UI.vocabFilter==='due'?'selected':''}>Due now</option><option value="learning" ${UI.vocabFilter==='learning'?'selected':''}>Still learning</option></select><button class="btn ghost small" data-action="vocab-random">${I('refresh','sm')} Shuffle next</button></div>${w?`<div class="card card-pad"><div class="question-meta"><span class="eyebrow">RECALL CARD ${UI.vocabIndex+1}/${words.length}</span><span class="pill neutral">${E(MOD[w.module].title.slice(5))}</span></div><div class="vocab-front"><div class="eyebrow">WHAT IS IT, WHICH LAYER OWNS IT, AND WHAT DOES IT NOT MEAN?</div><h2>${E(w.term)}</h2><p>Try explaining aloud before revealing the definition.</p></div>${UI.vocabReveal?`<div class="recall-back"><strong>${E(w.definition)}</strong><p><b>Layer:</b> ${E(w.layer)}<br><b>Do not confuse:</b> ${E(w.contrast)}</p><button class="txtbtn" data-mod="${w.module}">Study the related module ${I('arrow','sm')}</button></div>`:''}<div class="review-buttons">${UI.vocabReveal?`<button class="btn danger" data-action="vocab-grade" data-value="again">Again — review soon</button><button class="btn primary" data-action="vocab-grade" data-value="known">I remembered — schedule later</button>`:`<button class="btn primary" data-action="vocab-reveal">Reveal definition ${I('arrow','sm')}</button>`}<button class="btn ghost" data-action="vocab-next">Skip ${I('arrow','sm')}</button></div></div>`:`<div class="empty">No cards match these filters. Choose “All cards” or another module.</div>`}<div class="section-head"><h2>Vocabulary atlas</h2><span class="fine">Select a term to open the linked module and its recall card.</span></div><div class="glossary-grid">${words.map(x=>`<div class="term-card" role="button" tabindex="0" data-term="${E(x.term)}"><div class="linkrow" style="justify-content:space-between"><h3>${E(x.term)}</h3><span class="tag dim">${E(x.layer)}</span></div><p>${E(x.definition)}</p><span class="fine">${E(MOD[x.module].title.slice(5))}</span></div>`).join('')}</div>${footer()}`}
const LAYERS=[
 {id:9,name:'Presentation',tools:'TUI, CLI, IDE, browser',role:'Capture intent and display results.',sample:'A coding TUI shows a diff while the harness controls execution.',failure:'UI says done but saved artifact is missing.',link:'stack'},
 {id:8,name:'Control and orchestration',tools:'Harness, agent loop, approvals, state',role:'Choose actions, enforce limits and track the task.',sample:'Harness blocks an unauthorized file edit proposed by a model.',failure:'Agent loops endlessly or performs a forbidden side effect.',link:'harness'},
 {id:7,name:'Tools and evidence',tools:'MCP, API tools, retrieval, memory',role:'Read data and invoke capabilities through defined scopes.',sample:'A read-only document tool supplies cited passages.',failure:'A retrieved page becomes an instruction or leaks restricted data.',link:'tools'},
 {id:6,name:'Model interface',tools:'HTTP API, gateway, SDK, serving',role:'Carry model requests/responses and service contracts.',sample:'An HTTP endpoint returns generated text and usage metrics.',failure:'Malformed HTTP response, timeout, unsupported tool schema.',link:'local'},
 {id:5,name:'Serialization',tools:'Tokenizer, chat template, roles',role:'Convert role-bearing messages to model-compatible tokens.',sample:'The chat template delimits tool replies and user requests.',failure:'Model swap breaks tool calls while weights still load.',link:'context'},
 {id:4,name:'Inference engine',tools:'Prefill, decode, KV cache, scheduler',role:'Predict new tokens and manage active sequence state.',sample:'A long context raises TTFT and KV memory.',failure:'High queue time or out-of-memory under concurrency.',link:'inference'},
 {id:3,name:'Model assets',tools:'Weights, architecture, quantization',role:'Provide learned parameters and numerical representation.',sample:'A quantized model variant fits a smaller accelerator.',failure:'Quantized variant regresses on domain benchmarks.',link:'models'},
 {id:2,name:'Compute kernels',tools:'Attention, matmul, normalization kernels',role:'Perform optimized numerical operations on devices.',sample:'An optimized attention kernel reduces memory traffic.',failure:'Unsupported compute backend or shape-specific performance loss.',link:'inference'},
 {id:1,name:'OS and device runtime',tools:'OS kernel, drivers, process isolation',role:'Manage processes, devices, memory and access control.',sample:'Driver mismatch prevents serving backend from using GPU.',failure:'Kernel module/driver incompatibility or insufficient privileges.',link:'local'},
 {id:0,name:'Hardware',tools:'CPU, GPU/NPU, RAM/VRAM, network',role:'Supply physical capacity and interconnects.',sample:'Concurrency exhausts available VRAM capacity.',failure:'Insufficient memory, thermal limits or unavailable accelerator.',link:'inference'}];
function stackPage(){let l=LAYERS.find(x=>x.id===UI.selectedLayer)||LAYERS[0];return `<div class="section-head"><div><div class="eyebrow">INTERACTIVE ARCHITECTURE</div><h1 style="margin:7px 0">From screen to silicon.</h1><p>Select any layer to understand responsibility, examples, and a characteristic failure symptom. Layers are conceptual boundaries, not necessarily different processes.</p></div></div><div class="stack-layout"><div class="card stack-list"><div class="fine" style="padding:8px 11px">HIGHER-LEVEL CONTROL ↑ / LOWER-LEVEL EXECUTION ↓</div>${LAYERS.map(x=>`<button class="stack-layer ${l.id===x.id?'active':''}" data-layer="${x.id}"><span class="label">L${x.id}</span><span><strong>${E(x.name)}</strong><small>${E(x.tools)}</small></span>${l.id===x.id?I('arrow','sm'):''}</button>`).join('')}</div><div class="card stack-info"><span class="eyebrow">L${l.id} · SELECTED LAYER</span><h2>${E(l.name)}</h2><p class="muted">${E(l.tools)}</p><div class="line"></div><h4>Core responsibility</h4><p>${E(l.role)}</p><h4>Realistic example</h4><p>${E(l.sample)}</p><h4>Failure signal</h4><p>${E(l.failure)}</p><button class="btn primary" data-mod="${l.link}">Study related module ${I('arrow','sm')}</button></div></div><div class="section-head"><h2>Four important boundaries</h2></div><div class="grid four-col">${[['Presentation','Who interacts and sees output?'],['Control + evidence','Who selects, permits and records actions?'],['Model contract','What was actually serialized and sent?'],['Execution','Where do time, memory and errors occur?']].map(x=>`<div class="card stage-card"><h3 style="margin:0 0 7px">${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div><div class="callout"><strong>The recurring diagnostic rule</strong><p>A model predicts tokens. A harness controls tasks. A runtime executes inference. An interface displays state. Independent authorization and evaluation cut across these boundaries.</p></div>${footer()}`}
function labsHub(){return `<div class="section-head"><div><div class="eyebrow">HANDS-ON EVIDENCE</div><h1 style="margin:7px 0">Do the work. Record the proof.</h1><p>One lab per competency. Steps are safe by default, and execution must occur in your own sandbox. The app records self-reported evidence; it never executes commands.</p></div></div><div class="grid module-grid">${M.map((m,i)=>`<div class="card card-pad"><div class="linkrow" style="justify-content:space-between"><span class="tag">LAB ${String(i+1).padStart(2,'0')}</span><span class="pill ${labDone(m)?'pass':'neutral'}">${labDone(m)?'Evidence logged':'Not started'}</span></div><h3 style="margin:13px 0 8px">${E(m.lab.title)}</h3><p style="font-size:13px;min-height:47px">${E(m.lab.goal)}</p><p class="fine">${m.lab.minutes} min · ${m.lab.steps.length} steps · Manual pp. ${E(m.pages)}</p><button class="btn ghost small" data-lab-mod="${m.id}">Open lab ${I('arrow','sm')}</button></div>`).join('')}</div>${footer()}`}

function clinicRecord(id){if(!S.clinics)S.clinics={};if(!S.clinics[id])S.clinics[id]={answers:{}};return S.clinics[id]}
function clinicCount(c){return Object.keys(S.clinics?.[c.id]?.answers||{}).length}
function casebookPage(){return `<div class="section-head"><div><div class="eyebrow">10 ENGINEERING CLINICS · 30 GUIDED DECISIONS</div><h1 style="margin:7px 0">Learn by diagnosing real boundaries.</h1><p>Each case provides observed measurements, constraints, three increasingly difficult decisions, explanations for the alternatives and a reproducible evidence target. Practice is unscored.</p></div></div><div class="grid two-col">${DATA.clinics.map(c=>`<article class="card card-pad clinic-card"><div class="linkrow" style="justify-content:space-between"><span class="tag">${E(MOD[c.id].title.slice(0,2))} · ENGINEERING CLINIC</span><span class="pill ${clinicCount(c)===3?'pass':'neutral'}">${clinicCount(c)}/3 stages</span></div><h3>${E(c.title)}</h3><p>${E(c.objective)}</p><button class="btn primary small" data-clinic-mod="${E(c.id)}">${clinicCount(c)?'Continue case':'Work this case'} ${I('arrow','sm')}</button></article>`).join('')}</div>${footer()}`}
function clinicPage(m){const c=CLINICS[m.id];if(!c)return `<div class="empty">No clinic for this module.</div>`;const r=S.clinics?.[m.id]||{answers:{}};
 let answered=Object.keys(r.answers).length;return `<div class="section-head"><div><div class="eyebrow">EVIDENCE-DRIVEN CASE STUDIO · ${E(m.title)}</div><h2>${E(c.title)}</h2><p>${E(c.objective)}</p></div><span class="pill ${answered===3?'pass':'neutral'}">${answered}/3 stages explored</span></div><div class="card card-pad"><div class="eyebrow">SCENARIO</div><p class="clinic-story">${E(c.story)}</p>${evidenceTable(c.evidence)}<div class="detail-grid" style="margin-top:18px"><div class="detail-box"><h4>Engineering constraints</h4><ul>${c.constraints.map(x=>`<li>${E(x)}</li>`).join('')}</ul></div><div class="detail-box"><h4>Evidence to produce</h4><p>${E(c.proof)}</p></div></div></div><div class="clinic-rail">${c.steps.map((st,i)=>{let selected=r.answers[i],has=Object.prototype.hasOwnProperty.call(r.answers,i);return `<section class="card card-pad clinic-stage" id="clinic-stage-${i}"><div class="question-meta"><span class="tag lvl-${i===0?1:i===1?2:3}">${E(st.stage)}</span><span class="fine">${has?'Reviewed · feedback available':'Analyze before choosing'}</span></div><h3>${E(st.question)}</h3><div class="question-options">${st.options.map((opt,j)=>`<button class="answer ${has?(opt===st.answer?'correct':opt===selected?'wrong':''):''}" data-clinic-answer="${i}" data-opt="${E(opt)}" ${has?'disabled':''}><span class="letter">${'ABCD'[j]}</span><span>${E(opt)}</span></button>`).join('')}</div>${has?`<div class="feedback ${selected===st.answer?'':'wrong'}"><strong>${selected===st.answer?'Evidence-supported answer':'Inspect the reasoning'}</strong><p>${E(st.explanation)}</p><div class="learning-deeper"><p><strong>Transfer insight:</strong> ${E(st.insight)}</p>${allDistractors(st)}</div><button class="txtbtn" data-clinic-retry="${i}">Try this stage again</button></div>`:`<p class="fine">Choose the most defensible answer. The rationale appears immediately; this is learning mode.</p>`}</section>`}).join('')}</div><div class="callout"><strong>${answered===3?'Case explored · now transfer the skill':'Turn the case into engineering evidence'}</strong><p>${E(c.proof)}</p><div class="rel-links">${c.connections.map(id=>`<button class="rel-btn" data-mod="${E(id)}">${E(MOD[id]?.title.slice(5)||id)} ${I('arrow','sm')}</button>`).join('')}<button class="rel-btn" data-tab="checkpoint">Module knowledge check ${I('arrow','sm')}</button></div></div>`}

function assessment(){if(S.activeExam)return examUI();if(UI.guided)return guidedUI();return `<div class="section-head"><div><div class="eyebrow">3-LEVEL MASTERY · 80% PASS · EVIDENCE BEFORE CONFIDENCE</div><h1 style="margin:7px 0">Knowledge is the beginning. Judgment is the test.</h1><p>Scored exams contain 30% foundations, 50% applied understanding and 20% engineering judgment. Getting Levels 1 and 2 entirely right reaches exactly 80%; Level 3 is how you reach 100%. Answers and hints remain hidden until submission.</p></div></div><div class="grid three-col">${[[1,'Identify concepts and boundaries'],[2,'Interpret evidence and diagnose'],[3,'Defend architecture under constraints']].map(([l,desc])=>`<div class="card stat"><span class="eyebrow">LEVEL ${l} · ${LEVEL[l].name}</span><span class="num">${LEVEL[l].weight}%</span><span class="cap">${E(desc)}</span><span class="meta">${Q.filter(x=>levelOf(x)===l).length} items available</span></div>`).join('')}</div><div class="exam-selection" style="margin-top:19px"><div class="card exam-choice"><span class="eyebrow">CROSS-DOMAIN EXAM</span><h2 style="margin:13px 0">Full architecture assessment</h2><p>20, 30 or 40 questions. Every module represented equally. Exact L1/L2/L3 weighting and shuffled alternatives, with more reasoning-heavy curated cases.</p><div class="field"><label for="examLength">Questions in exam</label><select id="examLength">${[20,30,40].map(x=>`<option value="${x}" ${UI.examLength===x?'selected':''}>${x} questions</option>`).join('')}</select></div><div style="margin-top:15px"><button class="btn primary" data-action="start-full-exam">${I('play')} Start full exam</button></div></div><div class="card exam-choice"><span class="eyebrow">FOCUSED EXAM</span><h2 style="margin:13px 0">One-module assessment</h2><p>20 unique questions: six L1, ten L2 and four L3. A successful score demands strong applied reasoning, not just memorized terminology.</p><div class="field"><label for="examModule">Select module</label><select id="examModule">${M.map(m=>`<option value="${m.id}" ${m.id===UI.examModule?'selected':''}>${E(m.title)}</option>`).join('')}</select></div><div style="margin-top:15px"><button class="btn primary" data-action="start-section-exam">${I('play')} Start section exam</button></div></div></div><div class="card card-pad guided-choice"><div class="eyebrow">LEARN BEFORE YOU ARE GRADED</div><h2 style="margin:10px 0">Guided architecture challenge</h2><p>Ten questions, one per domain, in increasing difficulty from foundations to engineering judgment. Reveal a hint, choose an answer, explore every alternative and follow the connected concepts. No exam score is recorded.</p><div class="linkrow" style="flex-wrap:wrap;gap:9px"><button class="btn primary" data-action="start-guided">${I('play')} Start guided challenge</button><button class="btn ghost" data-screen="casebook">${I('target')} Open the 10 engineering clinics</button></div></div><div class="card card-pad" style="margin-top:17px"><h3>How to interpret a result</h3><div class="grid three-col"><div><strong>Foundations · 30%</strong><p style="font-size:12px">Essential distinctions and vocabulary.</p></div><div><strong>Applied · 50%</strong><p style="font-size:12px">Measured data, diagnosis and failure boundaries.</p></div><div><strong>Judgment · 20%</strong><p style="font-size:12px">Architectural trade-offs and safety decisions.</p></div></div><p class="fine" style="margin-top:13px">A score is an educational indicator, not certification. Real-world expertise also needs tested labs, measured capstones and independent review. Option order is randomized; do not infer correctness from answer position or length.</p></div>${S.exams.length?`<div class="section-head"><h2>Recent attempts</h2><button class="txtbtn" data-screen="progress">All results ${I('arrow','sm')}</button></div><div class="grid three-col">${S.exams.slice().reverse().slice(0,3).map(x=>`<div class="card card-pad"><span class="pill ${x.passed?'pass':'fail'}">${x.passed?'Pass':'Not passed'}</span><h3 style="margin:12px 0">${x.percent}% · ${x.score}/${x.count}</h3><p style="font-size:12px">${E(x.mode==='full'?'Full assessment':MOD[x.module].title)} · ${date(x.date)}</p><button class="txtbtn" data-review="${x.id}">Review answers ${I('arrow','sm')}</button></div>`).join('')}</div>`:''}${footer()}`}
function startGuided(){const mods=shuffle(M.map(m=>m.id));const levels=shuffle([1,1,1,2,2,2,2,2,3,3]);const items=mods.map((m,i)=>sampleLevel(m,levels[i],1)[0]).sort((a,b)=>levelOf(QMAP[a.id])-levelOf(QMAP[b.id]));UI.guided={items,index:0,answers:{},hints:{},finished:false};UI.screen='assessment';render();window.scrollTo(0,0)}
 function guidedUI(){let p=UI.guided;if(p.finished){let correct=p.items.filter(x=>p.answers[x.id]===QMAP[x.id].answer).length;return `<div class="card card-pad"><div class="eyebrow">GUIDED LEARNING COMPLETE</div><h1 style="margin:13px 0">${correct}/${p.items.length} correct</h1><p>These are practice results, not a scored exam. More important: review the new concepts and try applying them in a lab.</p><div class="linkrow" style="gap:10px;flex-wrap:wrap"><button class="btn primary" data-action="start-guided">New guided challenge</button><button class="btn ghost" data-action="close-guided">Back to assessment center</button></div></div>${p.items.map((item,i)=>{const q=QMAP[item.id],selected=p.answers[item.id];return `<div class="result-row"><div class="eyebrow">QUESTION ${i+1} · ${E(MOD[q.module].title)}</div><h3>${E(q.question)}</h3>${evidenceTable(q.evidence)}<p>Your answer: <b>${E(selected)}</b> · Best answer: <b>${E(q.answer)}</b></p><p>${E(q.explanation)}</p>${learningPanel(q,selected)}</div>`}).join('')}`}
 const item=p.items[p.index],q=QMAP[item.id],answered=Object.prototype.hasOwnProperty.call(p.answers,item.id),selected=p.answers[item.id],hint=p.hints[item.id];return `<div class="exam-head"><div><div class="eyebrow">UNSCORED · GUIDED LEARNING</div><h2>Question ${p.index+1} of ${p.items.length}</h2></div><span class="pill neutral">One concept from each module</span></div><div class="exam-layout"><div class="card question"><div class="question-meta"><span ${levelTag(q)}<span class="fine">${E(MOD[q.module].title)}</span></div>${questionStem(q)}<div class="question-options">${item.options.map((x,i)=>`<button class="answer ${answered?(x===q.answer?'correct':x===selected?'wrong':''):''}" data-guided-answer="${E(x)}" ${answered?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${E(x)}</span></button>`).join('')}</div>${hint&&!answered?`<div class="hint-panel">${E(q.hint)}</div>`:''}${answered?`<div class="feedback ${selected===q.answer?'':'wrong'}"><strong>${selected===q.answer?'Correct · now go one level deeper':'Understand the distinction'}</strong><p>${E(q.explanation)}</p>${learningPanel(q,selected)}${allDistractors(q)}<button class="txtbtn" data-term="${E(q.term)}">Review ${E(q.term)} ${I('arrow','sm')}</button></div>`:''}<div class="lesson-next"><button class="btn ghost" data-action="guided-hint" ${answered?'disabled':''}>${I('info','sm')} ${hint?'Hint shown':'Show hint'}</button><button class="btn primary" data-action="guided-next" ${answered?'':'disabled'}>${p.index===p.items.length-1?'See learning review':'Next question'} ${I('arrow','sm')}</button></div></div><aside class="card exam-sidebar"><h3>Learn, don't just guess.</h3><p>Reasoning and a concept connection appear after every answer. Hints are optional and this practice does not change your scored results.</p><div class="bar"><i style="width:${Math.round(100*(p.index+(answered?1:0))/p.items.length)}%"></i></div><p class="fine">${p.index+(answered?1:0)} of ${p.items.length} attempted</p><button class="btn ghost small" data-action="close-guided">Exit guided challenge</button></aside></div>`}
function createExam(mode,mod,length){if(S.activeExam&&!confirm('Replace the current unfinished exam?'))return;const chosen=sampleBlueprint(mode,mod,length);S.activeExam={id:uid(),mode,module:mode==='section'?mod:null,count:chosen.length,items:chosen,index:0,answers:{},date:Date.now(),blueprint:{level1:Math.round(length*.3),level2:Math.round(length*.5),level3:Math.round(length*.2)}};save();UI.screen='assessment';render();window.scrollTo(0,0)}
function examUI(){let ex=S.activeExam,rec=ex.items[ex.index],q=QMAP[rec.id],answered=Object.keys(ex.answers).length;return `<div class="exam-head"><div><div class="eyebrow">SCORED ASSESSMENT · ${E(ex.mode==='full'?'ALL TEN MODULES':MOD[ex.module].title)}</div><h2 style="margin:6px 0">Question ${ex.index+1} of ${ex.count}</h2></div><span class="pill neutral">${answered}/${ex.count} answered</span></div><div class="exam-layout"><div class="card question"><div class="question-meta">${levelTag(q)}<span class="fine">Domain: ${E(MOD[q.module].title.slice(5))}</span></div>${questionStem(q)}<div class="question-options">${rec.options.map((x,i)=>`<button class="answer ${ex.answers[rec.id]===x?'selected':''}" data-exam-answer="${E(x)}"><span class="letter">${'ABCD'[i]}</span><span>${E(x)}</span></button>`).join('')}</div><div class="lesson-next"><button class="btn ghost" data-action="exam-prev" ${ex.index===0?'disabled':''}>${I('back','sm')} Previous</button>${ex.index===ex.count-1?`<button class="btn primary" data-action="submit-exam">${I('check','sm')} Submit exam</button>`:`<button class="btn primary" data-action="exam-next">Next question ${I('arrow','sm')}</button>`}</div></div><aside class="card exam-sidebar"><div class="eyebrow">EXAM NAVIGATION</div><h3 style="margin:8px 0">Answer map</h3><div class="bar" style="margin:0 0 17px"><i style="width:${Math.round(100*answered/ex.count)}%"></i></div><div class="exam-index">${ex.items.map((item,i)=>`<button aria-label="Go to question ${i+1}" class="${ex.index===i?'current':ex.answers[item.id]?'answered':''}" data-exam-go="${i}">${i+1}</button>`).join('')}</div><p class="fine" style="margin:18px 0">${levelTag(q)} · No hints or correctness feedback until submission. Navigate and revise answers freely.</p><button class="btn primary" style="width:100%" data-action="submit-exam">${I('check','sm')} Submit exam</button><button class="txtbtn" style="margin-top:17px;color:#a55c62" data-action="abandon-exam">Discard attempt</button></aside></div>`}
function submitExam(){let ex=S.activeExam;if(!ex)return;let n=Object.keys(ex.answers).length;if(n<ex.count&&!confirm(`${ex.count-n} question(s) unanswered. Submit with those counted incorrect?`))return;let items=ex.items.map(x=>({id:x.id,selected:ex.answers[x.id]??null}));let score=items.filter(x=>x.selected===QMAP[x.id].answer).length,percent=Math.round(100*score/ex.count);let result={id:ex.id,date:Date.now(),mode:ex.mode,module:ex.module,count:ex.count,score,percent,passed:score/ex.count>=.80,items,levels:gradeBreakdown(ex.items,ex.answers)};S.exams.push(result);S.exams=S.exams.slice(-35);S.activeExam=null;save();UI.reviewId=result.id;UI.screen='results';UI.reviewWrongOnly=false;location.hash='results';render();window.scrollTo(0,0)}
function resultView(){let r=S.exams.find(x=>x.id===UI.reviewId)||S.exams.at(-1);if(!r)return `<div class="empty">No scored exam results yet. <button class="txtbtn" data-screen="assessment">Start an exam</button></div>`;let wrong=r.items.filter(x=>x.selected!==QMAP[x.id].answer),visible=UI.reviewWrongOnly?wrong:r.items;const answers=Object.fromEntries(r.items.map(x=>[x.id,x.selected]));const levels=gradeBreakdown(r.items,answers);const weakest=[...new Set(wrong.map(x=>QMAP[x.id].module))];return `<div class="results-summary"><span class="eyebrow" style="color:#96d3ce">EXAM OUTCOME · ${date(r.date)}</span><div class="big">${r.percent}%</div><span class="pill ${r.passed?'pass':'fail'}">${r.passed?'PASS · 80% MET':'NOT PASSED · 80% REQUIRED'}</span><p style="margin-top:15px">${r.score} correct of ${r.count} questions · ${E(r.mode==='full'?'Cross-domain assessment':MOD[r.module].title)}. Level 1 and 2 together make up 80% of the exam; Level 3 is necessary for a perfect score.</p><div class="linkrow" style="margin-top:18px"><button class="btn hero-primary" data-screen="assessment">Take another exam ${I('arrow','sm')}</button><button class="btn hero-ghost" data-screen="casebook">Engineering clinics</button></div></div><div class="section-head"><h2>Mastery by difficulty</h2><span class="fine">Each level has a different engineering purpose.</span></div><div class="level-summary">${levels.map(x=>`<div class="card card-pad level-mini lvl-${x.level}"><span class="eyebrow">${LEVEL[x.level].short}</span><strong>${x.correct}/${x.count}</strong><span class="fine">${x.pct}% correct within level · weight ${LEVEL[x.level].weight}%</span></div>`).join('')}</div>${weakest.length?`<div class="card card-pad" style="margin-top:18px"><span class="eyebrow">TARGETED NEXT STEPS</span><h3>Learn from the questions that did not land.</h3><p>Review the case studio and key concepts in each affected domain. Answering the same questions again immediately may measure memorization rather than transferable understanding.</p><div class="rel-links">${weakest.map(id=>`<button class="rel-btn" data-clinic-mod="${id}">Clinic: ${E(MOD[id].title.slice(5))} ${I('arrow','sm')}</button>`).join('')}</div></div>`:`<div class="callout"><strong>All answers supported in this sample.</strong><p>A perfect quiz does not establish production mastery. Validate your ability to produce independent evidence in a capstone.</p></div>`}<div class="section-head"><h2>Review the engineering reasoning</h2><div class="filterbar" style="margin:0"><button class="btn small ${UI.reviewWrongOnly?'primary':'ghost'}" data-action="review-wrong">Missed only</button><button class="btn small ${!UI.reviewWrongOnly?'primary':'ghost'}" data-action="review-all">All questions</button></div></div>${visible.length?visible.map((x,i)=>{let q=QMAP[x.id],ok=x.selected===q.answer;return `<div class="result-row"><div class="question-meta"><span class="pill ${ok?'pass':'fail'}">${ok?'Correct':'Needs review'}</span>${levelTag(q)}<span class="fine">${E(MOD[q.module].title.slice(5))}</span></div>${questionStem(q)}<p>Your answer: <strong>${E(x.selected||'Not answered')}</strong></p><p>Best answer: <strong>${E(q.answer)}</strong></p><p class="why">${E(q.explanation)}</p>${learningPanel(q,x.selected)}${allDistractors(q)}<div class="linkrow" style="gap:15px;flex-wrap:wrap"><button class="txtbtn" data-term="${E(q.term)}">Review: ${E(q.term)} ${I('arrow','sm')}</button><button class="txtbtn" data-clinic-mod="${q.module}">Apply: engineering clinic ${I('arrow','sm')}</button>${Number.isInteger(q.lesson)?`<button class="txtbtn" data-concept="${q.module}:${q.lesson}">Read the linked concept</button>`:''}</div></div>`}).join(''):`<div class="empty">No missed questions in this attempt. Inspect all items or try a fresh exam.</div>`}${docbanner()}${footer()}`}
function progressPage(){let passed=S.exams.filter(x=>x.passed).length;return `<div class="section-head"><div><div class="eyebrow">PROGRESS & EVIDENCE</div><h1 style="margin:7px 0">A transparent learning record.</h1><p>Readiness combines self-marked concepts, self-attested labs and scored checkpoints. Each category is shown independently.</p></div></div><div class="grid four-col"><div class="card stat"><span class="num">${allSteps()}/80</span><span class="cap">learning actions</span></div><div class="card stat"><span class="num">${M.filter(completed).length}/10</span><span class="cap">modules finished</span></div><div class="card stat"><span class="num">${passed}</span><span class="cap">passed scored exams</span></div><div class="card stat"><span class="num">${learnedTerms()}</span><span class="cap">repeated vocabulary</span></div></div><div class="card card-pad" style="margin-top:16px"><h3>Per-module checklist</h3><div class="table-wrap"><table class="progress-table"><thead><tr><th>Module</th><th>Lessons</th><th>Lab</th><th>Clinic stages</th><th>Best checkpoint</th><th>Status</th></tr></thead><tbody>${M.map(m=>`<tr><td><button class="txtbtn" data-mod="${m.id}">${E(m.title)}</button></td><td>${doneCount(m)}/6</td><td>${labDone(m)?'Logged':'—'}</td><td><button class="txtbtn" data-clinic-mod="${m.id}">${Object.keys(S.clinics?.[m.id]?.answers||{}).length}/3 decisions</button></td><td>${checkpoint(m)?checkpoint(m)+'%':'—'}</td><td><span class="pill ${completed(m)?'pass':'neutral'}">${completed(m)?'Done':'In progress'}</span></td></tr>`).join('')}</tbody></table></div></div><div class="section-head"><h2>Scored assessment history</h2></div>${S.exams.length?`<div class="card card-pad table-wrap"><table class="progress-table"><thead><tr><th>Date</th><th>Scope</th><th>Score</th><th>Result</th><th>Review</th></tr></thead><tbody>${S.exams.slice().reverse().map(x=>`<tr><td>${date(x.date)}</td><td>${E(x.mode==='full'?'Full exam':MOD[x.module].title)}</td><td>${x.score}/${x.count} (${x.percent}%)</td><td><span class="pill ${x.passed?'pass':'fail'}">${x.passed?'PASS':'RETRY'}</span></td><td><button class="txtbtn" data-review="${x.id}">Review ${I('arrow','sm')}</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No scored exams submitted yet.</div>`}<div class="section-head"><h2>Data controls</h2></div><div class="card card-pad"><p>All progress is saved locally in this browser when storage permits. Export it to a JSON backup and import on another machine. No account or server is used; clearing browser storage may remove local progress.</p><div class="linkrow" style="gap:10px;flex-wrap:wrap"><button class="btn primary small" data-action="export-progress">${I('download','sm')} Export progress JSON</button><button class="btn ghost small" data-action="import-progress">${I('upload','sm')} Import progress JSON</button><button class="btn danger small" data-action="reset-progress">Reset all progress</button><input id="progressImport" type="file" accept="application/json,.json" style="display:none" aria-label="Import saved progress"></div></div>${footer()}`}
function library(){let cats=[...new Set(SR.map(x=>x.category))],items=SR.filter(x=>UI.libraryGroup==='all'||x.category===UI.libraryGroup);return `<div class="section-head"><div><div class="eyebrow">ALL ${SR.length} ANNOTATED REFERENCES FROM THE MANUAL</div><h1 style="margin:7px 0">Read deeper. Verify the source.</h1><p>Official specifications, research, tutorials and GitHub projects. Every resource carries its original R-number so you can match the source PDF.</p></div></div>${docbanner()}<div class="grid two-col" style="margin-top:18px"><div class="card card-pad"><h3>Read the 46-page field manual</h3><p>Source of truth for diagrams, terminology, patterns, labs and capstone requirements.</p><a class="btn ghost small" target="_blank" href="docs/AI_Systems_Field_Manual.pdf">${I('file')} Open PDF</a></div><div class="card card-pad"><h3>Use the two-page study guide</h3><p>Reading order, repeatable study protocol and evidence-based checkpoints.</p><a class="btn ghost small" target="_blank" href="docs/Opening_Study_Guide.pdf">${I('file')} Open PDF</a></div></div><div class="section-head"><h2>Annotated source index</h2><div class="filterbar" style="margin:0"><select id="sourceGroup" aria-label="Reference category"><option value="all">All ${SR.length} sources</option>${cats.map(x=>`<option value="${E(x)}" ${UI.libraryGroup===x?'selected':''}>${E(x)}</option>`).join('')}</select></div></div><div class="resource-grid">${items.map(x=>`<div class="resource-item">${I('external')}<div><div class="linkrow" style="flex-wrap:wrap"><span class="tag dim">${E(x.id)}</span><a href="${E(x.url)}" target="_blank" rel="noopener noreferrer">${E(x.title)} ${I('external','sm')}</a></div><p>${E(x.note)}</p><span class="fine">${E(x.category)} · Manual page ${x.page}</span></div></div>`).join('')}</div><div class="callout amber"><strong>Verify compatibility before copying commands</strong><p>Documentation and GitHub repositories evolve. Check the exact runtime, driver, model family and SDK revision for your installation. The 2026-07-28 MCP protocol changes request/session behavior relative to older tutorials.</p></div>${footer()}`}
function searchPage(){let term=UI.search.trim().toLowerCase(),topics=[],terms=[],questions=[];if(term){for(let m of M)for(let t of m.topics)if([t.name,t.explain,t.problem].join(' ').toLowerCase().includes(term))topics.push({m,t});terms=V.filter(x=>[x.term,x.definition,x.contrast].join(' ').toLowerCase().includes(term));questions=Q.filter(x=>[x.question,x.term].join(' ').toLowerCase().includes(term)).slice(0,15)}return `<div class="section-head"><div><div class="eyebrow">CONNECT THE MATERIAL</div><h1 style="margin:7px 0">Search the academy</h1><p>${term?`Results for “${E(UI.search)}” in ${M.length*6} lessons, ${V.length} terms and ${Q.length} questions.`:'Type a term, layer, failure or pattern into the search field in the top bar and press Enter.'}</p></div></div>${term?`<div class="card card-pad"><h3>Lessons (${topics.length})</h3>${topics.length?topics.slice(0,20).map(({m,t})=>`<div class="search-row"><div><strong>${E(t.name)}</strong><p style="margin:4px 0;font-size:12px">${E(t.problem)}</p><span class="fine">${E(m.title)}</span></div><button class="btn small ghost" data-concept="${m.id}:${m.topics.indexOf(t)}">Open ${I('arrow','sm')}</button></div>`).join(''):`<p class="fine">No matching lesson names or concepts.</p>`}</div><div class="card card-pad" style="margin-top:15px"><h3>Vocabulary (${terms.length})</h3>${terms.slice(0,24).map(x=>`<div class="search-row"><div><strong>${E(x.term)}</strong><p style="margin:3px 0;font-size:12px">${E(x.definition)}</p></div><button class="btn small ghost" data-term="${E(x.term)}">Review</button></div>`).join('')}</div><div class="card card-pad" style="margin-top:15px"><h3>Question bank (${questions.length}${Q.filter(x=>x.question.toLowerCase().includes(term)).length>15?'+':''})</h3>${questions.map(x=>`<div class="search-row"><div><strong>${E(x.question)}</strong><p class="fine" style="margin:6px 0">${E(MOD[x.module].title)} · ${x.difficulty}</p></div><button class="btn small ghost" data-term="${E(x.term)}">Learn term</button></div>`).join('')}</div>`:''}${footer()}`}
function patternPage(){let p=PAT.find(x=>x.id===UI.patternSelection)||PAT[0];return `<div class="section-head"><div><div class="eyebrow">11 PATTERNS FROM THE FIELD MANUAL · PP. 22–25</div><h1 style="margin:7px 0">Choose the least autonomy needed.</h1><p>A pattern is a repeatable control-flow solution, not a framework brand. Use predictable pipelines for predictable tasks; introduce tool choice, delegation and durable state only when the workload justifies it.</p></div></div><div class="grid two-col"><div class="card card-pad"><div class="eyebrow">PATTERN ATLAS</div><div class="pattern-choice-grid" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:15px">${PAT.map(x=>`<button class="rel-btn" style="padding:12px;text-align:left;${x.id===p.id?'background:#d7eeea;border-color:#76b7b0;':''}" data-pattern="${x.id}"><strong>${x.id}</strong> ${E(x.title)}</button>`).join('')}</div></div><div class="card card-pad"><div class="eyebrow">${p.id} · SELECTED PATTERN</div><h2 style="margin:12px 0">${E(p.title)}</h2><div class="code-wrap"><pre>${E(p.flow)}</pre></div><div class="callout"><strong>Use when</strong><p>${E(p.when)}</p></div><div class="detail-box warn"><h4>Trade-off / characteristic failure</h4><p>${E(p.risk)}</p></div><div class="detail-box" style="margin-top:12px"><h4>One proof-oriented test</h4><p>${E(p.test)}</p></div><div class="linkrow" style="margin-top:17px;flex-wrap:wrap"><button class="btn small primary" data-mod="${p.module}">Study foundations ${I('arrow','sm')}</button><a class="btn small ghost" href="docs/AI_Systems_Field_Manual.pdf#page=22" target="_blank">${I('file','sm')} Source pp. 22–25</a></div></div></div><div class="section-head"><h2>Three designs for the same job</h2></div><div class="grid three-col"><div class="card card-pad"><span class="tag">A · PROTOTYPE</span><h3 style="margin:13px 0 8px">Paste tickets and summarize</h3><p>Fast first draft. Fails when context is incomplete, permissions differ, freshness changes or citations must be audited.</p></div><div class="card card-pad"><span class="tag">B · REPEATABLE</span><h3 style="margin:13px 0 8px">Authenticated fixed pipeline</h3><p>Fetch permitted tickets, filter, normalize, summarize and verify IDs. Best default for predictable weekly reporting.</p></div><div class="card card-pad"><span class="tag advanced">C · EXPLORATORY</span><h3 style="margin:13px 0 8px">Bounded tool agent</h3><p>Investigate conflicting evidence with permitted tools and stop rules. Justified for ambiguous incidents, not routine reports.</p></div></div><div class="section-head"><h2>Multi-agent topology is a separate decision</h2></div><div class="grid three-col">${[['Handoff','Specialist owns the next interaction; preserve consent and context.'],['Agents as tools','Manager retains result ownership; bound nested tool and token budgets.'],['Peer-to-peer / A2A','Independent agents cooperate across trust and organization boundaries.'],['Reviewer / critic','Separate verification can detect defects, but correlated errors remain.'],['Self-reflection loop','Retry only with new test evidence; stop if no new information.']].map(x=>`<div class="card stage-card"><h3 style="margin:0 0 7px">${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div><div class="callout amber"><strong>Pattern selection rule</strong><p>First prove the fixed workflow baseline. Only adopt an agent when model-directed tool choice increases successful task completion enough to justify additional latency, cost and risk. Do not confuse parallel model calls with autonomous agents.</p></div>${footer()}`}
function capstonesPage(){let c=CAP.find(x=>x.id===UI.capstoneSelection)||CAP[0];return `<div class="section-head"><div><div class="eyebrow">PORTFOLIO · PDF CHAPTER 13</div><h1 style="margin:7px 0">Prove competence with artifacts.</h1><p>The four capstone tracks combine the layers, tools, failures and evidence. These are project specifications to execute in your own safe environment, not auto-run laboratories.</p></div></div><div class="grid four-col">${CAP.map(x=>`<button class="card card-pad" style="text-align:left;border-color:${x.id===c.id?'#48a6a2':'#e4e9f1'};background:${x.id===c.id?'#eef9f6':'#fff'}" data-capstone="${x.id}"><span class="tag">TRACK ${x.id}</span><h3 style="margin:12px 0 7px">${E(x.title)}</h3><p style="font-size:12px">${E(x.level)}</p></button>`).join('')}</div><div class="card card-pad" style="margin-top:18px"><div class="eyebrow">CAPSTONE ${c.id} · ${E(c.level)}</div><h2 style="margin:10px 0">${E(c.title)}</h2><p style="font-size:15px">${E(c.brief)}</p><div class="grid three-col"><div class="detail-box"><h4>Build</h4><ol style="padding-left:18px">${c.build.map(x=>`<li style="margin-bottom:9px;font-size:13px">${E(x)}</li>`).join('')}</ol></div><div class="detail-box"><h4>Negative tests</h4><ul style="padding-left:18px">${c.tests.map(x=>`<li style="margin-bottom:9px;font-size:13px">${E(x)}</li>`).join('')}</ul></div><div class="detail-box"><h4>Acceptance gate</h4><p>${E(c.gate)}</p><div style="margin-top:17px"><a class="btn ghost small" href="docs/AI_Systems_Field_Manual.pdf#page=36" target="_blank">${I('file','sm')} Full capstone brief</a></div></div></div><div class="eyebrow" style="margin:24px 0 11px">PREREQUISITE MODULES</div><div class="rel-links">${c.modules.map(id=>`<button class="rel-btn" data-mod="${id}">${E(MOD[id].title.slice(5))} ${I('arrow','sm')}</button>`).join('')}</div></div><div class="callout"><strong>Readiness definition</strong><p>A portfolio item is complete only when it has a diagram, versioned inputs, representative tests, negative tests, outcomes, known failures, measurable trade-offs, and a recovery strategy. An attractive demo alone does not establish engineering competence.</p></div>${footer()}`}
function studySchedule(){return `<div class="section-head"><div><span class="eyebrow">WEEK-BY-WEEK PLAN · PDF PP. 37–38</span><h2>16 weeks of concrete evidence</h2></div></div><div class="card card-pad table-wrap"><table class="progress-table"><thead><tr><th>Week</th><th>Focus</th><th>Deliverable to demonstrate</th><th>Study</th></tr></thead><tbody>${WEEKS.map(x=>`<tr><td><strong>${String(x.week).padStart(2,'0')}</strong></td><td><strong>${E(x.title)}</strong><div class="fine" style="margin-top:4px;max-width:260px">${E(x.focus)}</div></td><td>${E(x.deliverable)}</td><td><button class="txtbtn" data-mod="${x.module}">Open module</button></td></tr>`).join('')}</tbody></table></div>`}
