"What feedback drives the next loop iteration?","term":"tool result","level":1,"quality":"legacy"},{"id":"harness-12","module":"harness","difficulty":"foundation","question":"How should an agent end after exceeding risk limits?","options":["Drop the policy check","Disable logs to run faster","Continue forever if model asks","Stop and report unresolved work for escalation"],"answer":"Stop and report unresolved work for escalation","explanation":"A controlled harness enforces stop/escalation independently.","hint":"A bounded task must have an explicit failure state.","term":"termination condition","level":1,"quality":"legacy"},{"id":"harness-13","module":"harness","difficulty":"advanced","question":"A create API times out; the agent repeats it and creates two resources. What was missing?","options":["Idempotency or read-before-retry reconciliation","A UI reset","A larger tokenizer","More retrieval chunks"],"answer":"Idempotency or read-before-retry reconciliation","explanation":"External operations can succeed before a timeout becomes visible.","hint":"How can duplicate side effects be prevented?","term":"idempotency","learning_note":"A timeout means the client does not know whether the server committed the action. A safe retry uses a stable idempotency key and reconciles authoritative state.","level":2,"quality":"legacy"},{"id":"harness-14","module":"harness","difficulty":"advanced","question":"A team automates a fixed three-step extraction using multiple autonomous agents. Best design critique?","options":["A deterministic workflow may reduce variance and complexity","More agents always improve correctness","Every workflow requires model planning","Tool observations must be disabled"],"answer":"A deterministic workflow may reduce variance and complexity","explanation":"Use the least autonomy needed for the task.","hint":"Are the next steps actually unknown?","term":"orchestration","learning_note":"More autonomous roles introduce handoffs, budgets, attack surface and failure paths. First test whether a fixed workflow already solves the problem.","level":2,"quality":"legacy"},{"id":"harness-15","module":"harness","difficulty":"advanced","question":"An agent repeatedly fixes code while tests fail for the same reason. What control improves reliability?","options":["Grant broader filesystem writes","Bound attempts and require new evidence or escalation","Remove regression tests","Raise temperature indefinitely"],"answer":"Bound attempts and require new evidence or escalation","explanation":"Repetition without fresh observation wastes budget and masks failure.","hint":"What must change between retries?","term":"termination condition","level":2,"quality":"legacy"},{"id":"harness-16","module":"harness","difficulty":"advanced","question":"A planner approves a file deletion in its text, but executor lacks approval. What is correct?","options":["Tokenizer can authorize the path","A successful model reply proves permission","Executor denies until external authorization is recorded","Generated plan is legally sufficient approval"],"answer":"Executor denies until external authorization is recorded","explanation":"Authority belongs to the executing gate, not to model output.","hint":"Who can actually permit deletion?","term":"approval gate","level":2,"quality":"legacy"},{"id":"harness-17","module":"harness","difficulty":"advanced","question":"An agent's context is compacted mid-task. Which artifacts should be externalized?","options":["The TUI cursor location","Action ledger, approvals, checkpoints and remaining acceptance criteria","GPU attention scores for all history","Only the final prose summary"],"answer":"Action ledger, approvals, checkpoints and remaining acceptance criteria","explanation":"Operational invariants and completed side effects need durable state.","hint":"What cannot be safely inferred from a summary?","term":"checkpoint","level":2,"quality":"legacy"},{"id":"harness-18","module":"harness","difficulty":"advanced","question":"A coding assistant edits outside the workspace. What is the key harness defect?","options":["Filesystem scope or sandbox enforcement was insufficient","The TUI used Unicode","Tokenizer had too few special tokens","Model sampling was too low"],"answer":"Filesystem scope or sandbox enforcement was insufficient","explanation":"Only the executor/sandbox can constrain actual file paths.","hint":"Find where permissions are enforced.","term":"sandbox","level":2,"quality":"legacy"},{"id":"harness-19","module":"harness","difficulty":"advanced","question":"An agent reports DONE immediately after submitting an asynchronous job. What should the harness do?","options":["Accept DONE as proof","Keep task pending until job completion and checks are observed","Erase the job ID","Disable status polling"],"answer":"Keep task pending until job completion and checks are observed","explanation":"Asynchronous submission is not terminal success.","hint":"How is submitted distinct from completed?","term":"checkpoint","level":2,"quality":"legacy"},{"id":"harness-20","module":"harness","difficulty":"advanced","question":"You need parallel agents to edit one repository. What issue must be explicitly designed?","options":["Conflicts, coordination and integration verification","Tokenizer string length only","Browser bookmark storage","GPU display resolution only"],"answer":"Conflicts, coordination and integration verification","explanation":"Parallel writers need ownership and merge/check gates.","hint":"Think about shared mutable state.","term":"orchestration","level":2,"quality":"legacy"},{"id":"harness-21","module":"harness","difficulty":"advanced","question":"A tool schema says “read file”, but accepts arbitrary paths. Which control makes the operation safe?","options":["Longer tool descriptions alone","A lower temperature","Disabling all prompts","Executor-side root-path confinement and principal authorization"],"answer":"Executor-side root-path confinement and principal authorization","explanation":"Tool scopes must be checked at execution, not assumed from name.","hint":"A read action may still expose secrets.","term":"least privilege","level":2,"quality":"legacy"},{"id":"harness-22","module":"harness","difficulty":"advanced","question":"An agent can browse public pages and send network requests. What risk must be bounded?","options":["Exfiltration via tool actions induced by untrusted content","Only GPU fan noise","The term count in the glossary","Tokenization speed alone"],"answer":"Exfiltration via tool actions induced by untrusted content","explanation":"Network-capable tools create an egress channel under prompt injection.","hint":"Where could data leave the trust boundary?","term":"threat model","level":2,"quality":"legacy"},{"id":"harness-23","module":"harness","difficulty":"advanced","question":"Two coding harnesses use the same model but differ in success rates. Which comparison best isolates cause?","options":["Compare their names and UI fonts","Use one anecdotal task each","Ignore side effects and retry histories","Same benchmark, tool policy, environment and acceptance checks"],"answer":"Same benchmark, tool policy, environment and acceptance checks","explanation":"Harness workflows change context, tool use and verification.","hint":"Control the evaluation workload and record execution.","term":"evaluation harness","level":2,"quality":"legacy"},{"id":"harness-24","module":"harness","difficulty":"advanced","question":"What is the strongest reason for a human-in-loop review on a destructive tool?","options":["The approval binds a human decision to an exact side effect","It guarantees no software bugs","It makes a model deterministic","It removes need for audit logs"],"answer":"The approval binds a human decision to an exact side effect","explanation":"A pre-execution approval gate reduces unauthorized side effects.","hint":"What must the human actually authorize?","term":"human-in-the-loop","level":2,"quality":"legacy"},{"id":"harness-25","module":"harness","difficulty":"advanced","question":"An agent reaches a tool failure that cannot be recovered safely. Which terminal state is appropriate?","options":["FAILED with preserved evidence and remaining actions","DONE because the model apologized","Delete its action history","Retry silently without limit"],"answer":"FAILED with preserved evidence and remaining actions","explanation":"Reliable systems expose failure, retain proof and escalate as needed.","hint":"What would let an operator resume safely?","term":"checkpoint","level":2,"quality":"legacy"},{"id":"tools-01","module":"tools","difficulty":"foundation","question":"What is the role of a tool schema?","options":["Describe expected arguments and result structure","Grant root permissions automatically","Train model embeddings","Allocate GPU VRAM"],"answer":"Describe expected arguments and result structure","explanation":"Schemas define interfaces, not security authority.","hint":"Separate describing an action from authorizing it.","term":"tool schema","level":1,"quality":"legacy"},{"id":"tools-02","module":"tools","difficulty":"foundation","question":"What does an MCP server expose?","options":["Only GPU kernels","Only terminal characters","Tools, resources or prompts through an MCP interface","Only model weights"],"answer":"Tools, resources or prompts through an MCP interface","explanation":"MCP servers advertise capabilities to clients.","hint":"Think about protocol-level capability exposure.","term":"MCP server","level":1,"quality":"legacy"},{"id":"tools-03","module":"tools","difficulty":"foundation","question":"What is an MCP host?","options":["The AI application managing client connections and model interaction","A tokenizer vocabulary file","The remote terminal itself only","Every individual GPU tensor"],"answer":"The AI application managing client connections and model interaction","explanation":"The host orchestrates how an AI app uses MCP clients.","hint":"Distinguish application coordinator from capability server.","term":"MCP host","level":1,"quality":"legacy"},{"id":"tools-04","module":"tools","difficulty":"foundation","question":"What is an MCP client?","options":["A kernel memory allocator","A dataset labeling job","The model weight optimizer","The component speaking MCP to a server"],"answer":"The component speaking MCP to a server","explanation":"The client communicates with an MCP server on behalf of its host.","hint":"Which participant connects to the server?","term":"MCP client","level":1,"quality":"legacy"},{"id":"tools-05","module":"tools","difficulty":"foundation","question":"What does A2A focus on?","options":["GPU matrix multiply","BPE tokenization","Basic HTML styling","Communication and delegation between agents"],"answer":"Communication and delegation between agents","explanation":"A2A covers multi-agent interaction rather than a tool catalog.","hint":"What is the peer on the other end?","term":"A2A","level":1,"quality":"legacy"},{"id":"tools-06","module":"tools","difficulty":"foundation","question":"What is an SDK?","options":["A hardware graphics processor","Library providing programmatic access to an API or service","A retrieval citation","An agent approval policy"],"answer":"Library providing programmatic access to an API or service","explanation":"An SDK simplifies calling an interface; it is not the remote service itself.","hint":"Think about developer-facing wrappers.","term":"SDK","level":1,"quality":"legacy"},{"id":"tools-07","module":"tools","difficulty":"foundation","question":"What is a command-line tool wrapper?","options":["A new attention architecture","A GPU shader pipeline only","A model tokenizer by definition","A harness adapter that invokes CLI commands under policy"],"answer":"A harness adapter that invokes CLI commands under policy","explanation":"A wrapper allows CLIs to serve as tools but owns quoting, timeout and permissions.","hint":"Who safely translates tool arguments to an executable command?","term":"CLI","level":1,"quality":"legacy"},{"id":"tools-08","module":"tools","difficulty":"foundation","question":"Who should check resource authorization for a tool operation?","options":["Only the text formatting step","Only the GPU driver","The model's own confidence score","Host/executor and downstream service identity boundaries"],"answer":"Host/executor and downstream service identity boundaries","explanation":"Effectful operations require deterministic authorization.","hint":"Which component has actual access to the resource?","term":"authorization","level":1,"quality":"legacy"},{"id":"tools-09","module":"tools","difficulty":"foundation","question":"What can an MCP resource provide?","options":["Addressable data for clients to read","A guarantee that every instruction is trusted","A mandatory GPU driver update","Unlimited shell execution rights"],"answer":"Addressable data for clients to read","explanation":"Resources are data surfaces; clients must preserve trust boundaries.","hint":"Differentiate data from executable capability.","term":"resource","level":1,"quality":"legacy"},{"id":"tools-10","module":"tools","difficulty":"foundation","question":"What is an API endpoint?","options":["A single token within embeddings","An addressable operation exposed by a service","A model architecture depth","An audit approval role"],"answer":"An addressable operation exposed by a service","explanation":"Endpoints represent service operations over a protocol.","hint":"Think of request routing.","term":"API","level":1,"quality":"legacy"},{"id":"tools-11","module":"tools","difficulty":"foundation","question":"What should a tool response be treated as for model instruction priority?","options":["An OS kernel update","A user identity token","A replacement system policy","Lower-trust evidence"],"answer":"Lower-trust evidence","explanation":"Tool results can be adversarial and should not gain authority by being returned.","hint":"A tool can return malicious text.","term":"tool result","level":1,"quality":"legacy"},{"id":"tools-12","module":"tools","difficulty":"foundation","question":"Why might two SDKs behave differently for the same nominal protocol?","options":["Both must use the same TUI","An SDK always trains its own model","They may support different protocol revisions and features","All SDKs share identical hidden state"],"answer":"They may support different protocol revisions and features","explanation":"Feature coverage and revision lag differ across libraries.","hint":"Implementation compatibility is versioned.","term":"SDK","level":1,"quality":"legacy"},{"id":"tools-13","module":"tools","difficulty":"advanced","question":"An MCP server is discovered with an admin-capable tool. What must happen before use?","options":["Explicit identity/scoping/authorization at the executor boundary","Skip audits for trusted transport","Give every model all arguments","Treat discovery as permission"],"answer":"Explicit identity/scoping/authorization at the executor boundary","explanation":"Discovery describes capability; it is not consent or least privilege.","hint":"Does listing a tool grant rights?","term":"least privilege","level":2,"quality":"legacy"},{"id":"tools-14","module":"tools","difficulty":"advanced","question":"A guide for an older MCP revision uses initialize and sessions; a current stateless server rejects it. What is best?","options":["Ask the model to ignore network errors","Increase model top-p","Switch tokenizer immediately","Check protocol revision and implement the applicable request/metadata flow"],"answer":"Check protocol revision and implement the applicable request/metadata flow","explanation":"The July 2026 MCP revision changed session and handshake semantics.","hint":"Version check is a protocol task, not a model task.","term":"MCP client","learning_note":"Protocol version changes are interface changes: check the exact client/server revisions and supported transports instead of assuming old initialization and session behavior.","level":2,"quality":"legacy"},{"id":"tools-15","module":"tools","difficulty":"advanced","question":"A single agent needs read access to a database. What is usually simpler than A2A delegation?","options":["Exposing database admin password in prompt","A second fully autonomous agent solely to run SELECT","Retraining the base model on credentials","A narrowly scoped tool or MCP service"],"answer":"A narrowly scoped tool or MCP service","explanation":"A2A is for inter-agent tasks, not routine single capability calls.","hint":"What is the smallest interface solving the need?","term":"MCP server","level":2,"quality":"legacy"},{"id":"tools-16","module":"tools","difficulty":"advanced","question":"A tool accepts a user-provided filename passed to a shell. What is the safer design?","options":["Trust JSON syntax as sufficient","Argument-array execution plus path checks and allowlists","String concatenate into one shell command","Disable all stderr to hide failures"],"answer":"Argument-array execution plus path checks and allowlists","explanation":"Avoid shell injection and enforce scope outside model-generated data.","hint":"How do shell metacharacters enter commands?","term":"tool schema","level":2,"quality":"legacy"},{"id":"tools-17","module":"tools","difficulty":"advanced","question":"A delegated agent returns “done” but no result. What should the caller demand?","options":["A longer success message","Immediate privilege escalation","Task evidence and validation of agreed output contract","Automatic storage of a new tokenizer"],"answer":"Task evidence and validation of agreed output contract","explanation":"Delegation must still result in verifiable outputs and states.","hint":"What makes delegation auditable?","term":"A2A","level":2,"quality":"legacy"},{"id":"tools-18","module":"tools","difficulty":"advanced","question":"A stateless MCP protocol is used. Does the application have to be stateless?","options":["Only if the model is quantized","Yes; all state is forbidden","Only for terminal interfaces","No; application state can use explicit handles and storage"],"answer":"No; application state can use explicit handles and storage","explanation":"Stateless protocol requests do not preclude application-managed state.","hint":"Separate transport session state from task state.","term":"MCP server","level":2,"quality":"legacy"},{"id":"tools-19","module":"tools","difficulty":"advanced","question":"An MCP server returns a README containing hostile instructions. Which layer must reject any unauthorized action?","options":["The tokenizer's vocabulary file","The README markdown lexer only","GPU scheduler","Host/harness policy plus downstream service authorization"],"answer":"Host/harness policy plus downstream service authorization","explanation":"MCP content is untrusted and cannot bypass permission gates.","hint":"A transport channel is not a trust promotion.","term":"prompt injection","level":2,"quality":"legacy"},{"id":"tools-20","module":"tools","difficulty":"advanced","question":"An API write times out after receiving the request. What should a tool adapter do first?","options":["Check idempotency/reconcile before replaying","Retry indefinitely with no key","Delete all traces","Assume the operation never happened"],"answer":"Check idempotency/reconcile before replaying","explanation":"Ambiguous network outcomes require safe retry design.","hint":"Was the original side effect perhaps committed?","term":"idempotency","level":2,"quality":"legacy"},{"id":"tools-21","module":"tools","difficulty":"advanced","question":"You add 40 tools to a model harness and quality drops. Which diagnosis is reasonable?","options":["GPU hardware necessarily lost cores","Retrieval evaluation is irrelevant","All tool names became invalid tokens","Tool selection confusion and larger prompt/tool catalog overhead"],"answer":"Tool selection confusion and larger prompt/tool catalog overhead","explanation":"Large tool catalogs can increase selection complexity and input cost.","hint":"What changes in model-facing context when tools multiply?","term":"harness","level":2,"quality":"legacy"},{"id":"tools-22","module":"tools","difficulty":"advanced","question":"A remote tool needs a user's delegated identity. Which design minimizes risk?","options":["Paste a long-lived admin token into retrieved context","Use scoped credentials managed outside model text","Trust model output as authorization","Use one shared superuser for all calls"],"answer":"Use scoped credentials managed outside model text","explanation":"Credential lifecycle and scope belong to service/client security, not prompt content.","hint":"What identity should travel across service boundaries?","term":"authorization","level":2,"quality":"legacy"},{"id":"tools-23","module":"tools","difficulty":"advanced","question":"A model proposes a schema-valid “delete_all” call. Who decides if it is permitted?","options":["Executor/service policy with human approval when required","The model's logit margin alone","The terminal progress bar","The tokenizer's vocabulary size"],"answer":"Executor/service policy with human approval when required","explanation":"A valid proposed operation can still be denied.","hint":"Distinguish interface grammar from authority.","term":"authorization","level":2,"quality":"legacy"},{"id":"tools-24","module":"tools","difficulty":"advanced","question":"The server changes from 2025 to 2026 protocol behavior while model is unchanged. What test domain has highest priority?","options":["Training perplexity only","Language embedding arithmetic only","Client/server handshake, headers, auth and compatibility regression","UI icon font files only"],"answer":"Client/server handshake, headers, auth and compatibility regression","explanation":"Protocol evolution affects clients/transports independently of weights.","hint":"What changed: an external contract, not the model.","term":"MCP client","level":2,"quality":"legacy"},{"id":"tools-25","module":"tools","difficulty":"advanced","question":"A tool exposes files to multiple users. What must be checked before returning a resource?","options":["Only model response fluency","Only whether the embedding score is high","Whether the TUI uses dark mode","Caller authorization on each requested file/version"],"answer":"Caller authorization on each requested file/version","explanation":"Per-resource access checks prevent cross-user disclosure.","hint":"A tool result can leak data even without writes.","term":"authorization","level":2,"quality":"legacy"},{"id":"rag-01","module":"rag","difficulty":"foundation","question":"What does RAG primarily add to generation?","options":["Retrieved task-relevant evidence in the model context","A larger GPU monitor","System-wide administrator access","Automatic permanent weight retraining"],"answer":"Retrieved task-relevant evidence in the model context","explanation":"RAG retrieves information at query time without editing weights.","hint":"Where does external knowledge enter inference?","term":"RAG","level":1,"quality":"legacy"},{"id":"rag-02","module":"rag","difficulty":"foundation","question":"What does chunking do?","options":["Schedule GPU kernels","Authorize API users","Compress model weights","Split documents into retrievable units"],"answer":"Split documents into retrievable units","explanation":"Chunking affects search granularity and context.","hint":"How is a long document indexed for retrieval?","term":"chunking","level":1,"quality":"legacy"},{"id":"rag-03","module":"rag","difficulty":"foundation","question":"What is a vector embedding used for in search?","options":["Validate system privileges","Represent semantic similarity between texts","Store OS kernel source","Prove a claim is true"],"answer":"Represent semantic similarity between texts","explanation":"Search embeddings enable nearest-neighbor similarity comparisons.","hint":"Separate similarity from truth.","term":"embedding search","level":1,"quality":"legacy"},{"id":"rag-04","module":"rag","difficulty":"foundation","question":"When is exact lexical search especially useful?","options":["Validating tool permission scopes","Deleting irrelevant documents automatically","Finding exact error codes and identifiers","Always replacing all semantic search"],"answer":"Finding exact error codes and identifiers","explanation":"Identifiers can be missed by semantic-only retrieval.","hint":"Which queries depend on exact strings?","term":"hybrid search","level":1,"quality":"legacy"},{"id":"rag-05","module":"rag","difficulty":"foundation","question":"What is reranking?","options":["Changing transformer weights after each search","Rescoring retrieved candidates for query relevance","Granting external network access","Converting PDFs into shell scripts"],"answer":"Rescoring retrieved candidates for query relevance","explanation":"A reranker improves ordering of retrieved evidence.","hint":"What happens between candidate retrieval and context assembly?","term":"reranking","level":1,"quality":"legacy"},{"id":"rag-06","module":"rag","difficulty":"foundation","question":"What does recall@k measure?","options":["How many labeled relevant items appear in top-k retrieved results","The speed of token decode","Whether an answer is fluent","Whether a tool write was authorized"],"answer":"How many labeled relevant items appear in top-k retrieved results","explanation":"Recall@k is a retrieval coverage metric.","hint":"Think of retrieval ground truth, not generated prose.","term":"recall@k","level":1,"quality":"legacy"},{"id":"rag-07","module":"rag","difficulty":"foundation","question":"What supports a trustworthy generated citation?","options":["The model's confidence adjective","The number of context tokens","A verified source ID and supporting text span","The URL-looking string alone"],"answer":"A verified source ID and supporting text span","explanation":"Citations require actual source support, not plausibility.","hint":"What lets a reviewer check the claim?","term":"citation grounding","level":1,"quality":"legacy"},{"id":"rag-08","module":"rag","difficulty":"foundation","question":"What is durable memory for an agent?","options":["KV cache during decoding","Explicitly persisted task/user information across sessions","A 128K context window alone","A static top-p parameter"],"answer":"Explicitly persisted task/user information across sessions","explanation":"Persistent state must live outside transient model input.","hint":"What survives a restart?","term":"durable memory","level":1,"quality":"legacy"},{"id":"rag-09","module":"rag","difficulty":"foundation","question":"Why attach document version metadata?","options":["Distinguish current from obsolete evidence","Increase model parameters","Improve GPU monitor brightness","Bypass authorization"],"answer":"Distinguish current from obsolete evidence","explanation":"Version metadata helps freshness and conflict resolution.","hint":"Which policy version supports the answer?","term":"provenance","level":1,"quality":"legacy"},{"id":"rag-10","module":"rag","difficulty":"foundation","question":"What does hybrid retrieval combine?","options":["Two unrelated GUI themes","Lexical and semantic retrieval","MCP and OS kernel source code","Model training and browser display"],"answer":"Lexical and semantic retrieval","explanation":"Hybrid search blends keyword matching and vector similarity.","hint":"Two complementary ways to find text.","term":"hybrid search","level":1,"quality":"legacy"},{"id":"rag-11","module":"rag","difficulty":"foundation","question":"What is a common problem with overly small chunks?","options":["Model weights are deleted","GPU clock speed increases","All authorization becomes correct","Important surrounding context is missing"],"answer":"Important surrounding context is missing","explanation":"Very small chunks can lose definitions or dependencies.","hint":"What happens to context around a sentence boundary?","term":"chunking","level":1,"quality":"legacy"},{"id":"rag-12","module":"rag","difficulty":"foundation","question":"What should a RAG benchmark include?","options":["Only a high model confidence score","Question, relevant source evidence and expected answer behavior","Only the web page title","Only an average GPU temperature"],"answer":"Question, relevant source evidence and expected answer behavior","explanation":"Ground-truth evidence makes retrieval and answer evaluation auditable.","hint":"What would let you score retrieval independently?","term":"evaluation harness","level":1,"quality":"legacy"},{"id":"rag-13","module":"rag","difficulty":"advanced","question":"A query is an exact stack trace ID but vector search misses it. What improves retrieval?","options":["Raise model temperature","Retrain model weights every minute","Increase chat UI font size","Add lexical exact matching and hybrid ranking"],"answer":"Add lexical exact matching and hybrid ranking","explanation":"Exact strings are often better served by lexical retrieval.","hint":"What representation preserves exact characters?","term":"hybrid search","level":2,"quality":"legacy"},{"id":"rag-14","module":"rag","difficulty":"advanced","question":"A generator cites a retrieved policy that lacks the claimed exception. What failed?","options":["Citation grounding against source spans","GPU kernel scheduling","Context window allocation only","Text-to-token conversion necessarily"],"answer":"Citation grounding against source spans","explanation":"Retrieved presence is insufficient; the cited span must support the claim.","hint":"Does the document actually entail the answer?","term":"citation grounding","level":2,"quality":"legacy"},{"id":"rag-15","module":"rag","difficulty":"advanced","question":"Two policies contradict, one old and one new. Which retrieval rule is defensible?","options":["Take whichever has higher embedding cosine similarity regardless of date","Let the model invent a third policy","Average the policies into a new rule","Prefer authorized current version with explicit provenance and conflict handling"],"answer":"Prefer authorized current version with explicit provenance and conflict handling","explanation":"Relevance alone cannot resolve source authority and version conflicts.","hint":"Which metadata describes current policy authority?","term":"provenance","level":2,"quality":"legacy"},{"id":"rag-16","module":"rag","difficulty":"advanced","question":"An unauthorized user asks for a restricted document. What should happen in RAG?","options":["Use higher temperature","Apply access filters before evidence enters model context","Hide citations only","Retrieve it but ask the model not to quote"],"answer":"Apply access filters before evidence enters model context","explanation":"Access control should filter retrieval itself, not rely on model discretion.","hint":"At which boundary must private text be blocked?","term":"least privilege","learning_note":"Authorization belongs before evidence enters context. Even perfect generation-side filtering is too late if private document text was already retrieved into the prompt.","level":2,"quality":"legacy"},{"id":"rag-17","module":"rag","difficulty":"advanced","question":"You improve retrieval recall@k but answer quality worsens. Which is plausible?","options":["Recall@k mathematically guarantees factuality","The model has gained new tool permissions","KV cache can no longer operate","More irrelevant or contradictory context harms grounded synthesis"],"answer":"More irrelevant or contradictory context harms grounded synthesis","explanation":"Search coverage and answer quality are distinct; context selection still matters.","hint":"More results are not necessarily more useful.","term":"recall@k","learning_note":"Higher recall may introduce distractors, stale policies or sensitive snippets. Evaluate retrieval and generation separately, including their interaction.","level":2,"quality":"legacy"},{"id":"rag-18","module":"rag","difficulty":"advanced","question":"A vector index stores user preferences and someone calls it “memory”. What is incomplete?","options":["Any embedding is a legal approval","Persistence, consent, freshness and state semantics need explicit design","A context window alone persists it forever","Vector storage guarantees transactional task state"],"answer":"Persistence, consent, freshness and state semantics need explicit design","explanation":"Semantic index alone does not define lifecycle or reliable state.","hint":"What happens when facts change or must be deleted?","term":"durable memory","level":2,"quality":"legacy"},{"id":"rag-19","module":"rag","difficulty":"advanced","question":"Retrieval adds 15K tokens and TTFT triples. What trade-off should be measured?","options":["Only the final response word count","CLI command aliases","GPU fan model","Answer gain versus prefill/cache cost and latency"],"answer":"Answer gain versus prefill/cache cost and latency","explanation":"More evidence can raise compute and memory without equal quality gain.","hint":"Which phase processes added input?","term":"prefill","level":2,"quality":"legacy"},{"id":"rag-20","module":"rag","difficulty":"advanced","question":"A developer removes overlap from chunks and citation accuracy drops. Which hypothesis is strongest?","options":["MCP server failed authorization","All weights were retrained","Cross-boundary context was lost during segmentation","The model necessarily changed architecture"],"answer":"Cross-boundary context was lost during segmentation","explanation":"Chunk boundaries can separate a claim from its qualifying evidence.","hint":"What does overlap preserve?","term":"chunking","level":2,"quality":"legacy"},{"id":"rag-21","module":"rag","difficulty":"advanced","question":"A retrieved document says “ignore system prompt”. Why should generation treat it differently from policy instructions?","options":["It is a newer system message","MCP data automatically has admin rights","Document text is lower-trust evidence rather than control authority","Every source citation gives permission"],"answer":"Document text is lower-trust evidence rather than control authority","explanation":"RAG does not elevate source text into trusted commands.","hint":"Which trust boundary separates source data and instructions?","term":"prompt injection","level":2,"quality":"legacy"},{"id":"rag-22","module":"rag","difficulty":"advanced","question":"You need to verify a QA answer cites the exact source version. What should be stored?","options":["Stable document ID, revision and cited span","Only cursor position in UI","Only number of vector dimensions","Only text generated by model"],"answer":"Stable document ID, revision and cited span","explanation":"Provenance requires stable identifiers and versions, not generated claims.","hint":"What evidence is needed for audit months later?","term":"provenance","level":2,"quality":"legacy"},{"id":"rag-23","module":"rag","difficulty":"advanced","question":"An evaluation reports “groundedness 0.9” from an automated judge. What is missing for confident deployment?","options":["A larger embedding vector alone","Representative human-reviewed cases and judge calibration","Removing all false negatives","Fewer labels in test data"],"answer":"Representative human-reviewed cases and judge calibration","explanation":"Automatic judges can have biases; validate against representative ground truth.","hint":"How is the evaluator itself tested?","term":"evaluation harness","level":2,"quality":"legacy"},{"id":"rag-24","module":"rag","difficulty":"advanced","question":"A text search backend finds many copies of one paragraph. Which retrieval design change helps?","options":["Skip citations","Enable arbitrary file writes","Deduplicate and diversify evidence before context assembly","Raise decoding top-p"],"answer":"Deduplicate and diversify evidence before context assembly","explanation":"Redundant chunks waste context and can crowd out distinct evidence.","hint":"Is the top-k set informative or repetitive?","term":"reranking","level":2,"quality":"legacy"},{"id":"rag-25","module":"rag","difficulty":"advanced","question":"An agent stores “VM created” only in chat and restarts. What failure is likely?","options":["Automatic GPU quantization","Repeated side effect due to missing durable task ledger","RAG citations become verified automatically","Tokenizer incompatibility"],"answer":"Repeated side effect due to missing durable task ledger","explanation":"Task state and reconciliation must survive process/chat loss.","hint":"What records actual external effects?","term":"durable memory","level":2,"quality":"legacy"},{"id":"eval-01","module":"eval","difficulty":"foundation","question":"What is a regression test?","options":["A source document title","A random decorative UI check","A quantization format","A test for behavior lost or changed from an accepted baseline"],"answer":"A test for behavior lost or changed from an accepted baseline","explanation":"Regression tests detect previously working behavior changes.","hint":"What should run after model/runtime upgrades?","term":"regression test","level":1,"quality":"legacy"},{"id":"eval-02","module":"eval","difficulty":"foundation","question":"What is prompt injection?","options":["Untrusted content attempting to alter instructions or actions","A safe source citation","A tokenizer initialization flow","A standard GPU optimization"],"answer":"Untrusted content attempting to alter instructions or actions","explanation":"Prompt injection crosses instruction/trust boundaries via malicious data.","hint":"How can retrieved text become dangerous?","term":"prompt injection","level":1,"quality":"legacy"},{"id":"eval-03","module":"eval","difficulty":"foundation","question":"What does least privilege mean?","options":["Trust all tool output","Give each component only permissions required for its task","Give every tool root to avoid friction","Disable audit logging"],"answer":"Give each component only permissions required for its task","explanation":"Least privilege limits the blast radius of mistakes and attacks.","hint":"Which policy narrows access rather than broadens it?","term":"least privilege","level":1,"quality":"legacy"},{"id":"eval-04","module":"eval","difficulty":"foundation","question":"What is a sandbox?","options":["A token sampling algorithm","An embedding search metric","Constrained environment for executing code or processes","A model probability threshold"],"answer":"Constrained environment for executing code or processes","explanation":"Sandboxing restricts execution capabilities and isolation.","hint":"Which layer limits process effects?","term":"sandbox","level":1,"quality":"legacy"},{"id":"eval-05","module":"eval","difficulty":"foundation","question":"What must an approval gate do?","options":["Only produce a polite model message","Choose the best source chunk","Increase prefill speed","Block a sensitive action until authorized"],"answer":"Block a sensitive action until authorized","explanation":"The action executor must enforce approval before effects.","hint":"Which control has causal force before the write?","term":"approval gate","level":1,"quality":"legacy"},{"id":"eval-06","module":"eval","difficulty":"foundation","question":"What does evaluation measure beyond one demo?","options":["Only screenshot attractiveness","Model's stated confidence","Performance across repeatable representative cases","Unverified success claims"],"answer":"Performance across repeatable representative cases","explanation":"Repeatable tests reveal failure rates and regressions.","hint":"One example cannot establish reliability.","term":"evaluation harness","level":1,"quality":"legacy"},{"id":"eval-07","module":"eval","difficulty":"foundation","question":"Why track source-supported citations separately from fluency?","options":["The runtime validates every citation automatically","Sources always share the same revisions","Fluency guarantees truth","A fluent answer can misrepresent evidence"],"answer":"A fluent answer can misrepresent evidence","explanation":"Language quality and factual support are independent.","hint":"What would a cited span prove?","term":"citation grounding","level":1,"quality":"legacy"},{"id":"eval-08","module":"eval","difficulty":"foundation","question":"What is an audit trace?","options":["A prompt style guide only","A token merge table","Linked records of decisions, calls and outcomes","A GPU shader file"],"answer":"Linked records of decisions, calls and outcomes","explanation":"Traces allow reconstruction of actual execution.","hint":"How do you prove what ran?","term":"audit trace","level":1,"quality":"legacy"},{"id":"eval-09","module":"eval","difficulty":"foundation","question":"What does a threat model identify?","options":["Only parameter count","Only decoding temperature","Only visual layout","Assets, entry points, attackers, boundaries and controls"],"answer":"Assets, entry points, attackers, boundaries and controls","explanation":"Threat models map how an adversary could cause harm.","hint":"What should be protected and where can attacks enter?","term":"threat model","level":1,"quality":"legacy"},{"id":"eval-10","module":"eval","difficulty":"foundation","question":"What kind of metric is p95 latency?","options":["Vector similarity threshold","Tail service response-time metric","Model vocabulary size","Model factuality score"],"answer":"Tail service response-time metric","explanation":"p95 captures slower requests better than a mean alone.","hint":"Think of a service SLI.","term":"p95 latency","level":1,"quality":"legacy"},{"id":"eval-11","module":"eval","difficulty":"foundation","question":"Which test is essential for a read-only agent?","options":["Secret values must be logged","Attempted unauthorized write must be denied","All files must be deletable","High temperature output must look creative"],"answer":"Attempted unauthorized write must be denied","explanation":"Negative permission tests verify the control boundary.","hint":"An allowed happy path is not enough.","term":"least privilege","level":1,"quality":"legacy"},{"id":"eval-12","module":"eval","difficulty":"foundation","question":"Why redact telemetry?","options":["Increase embedding dimensions","Reduce model parameter count","Prevent sensitive inputs or credentials leaking through logs","Make tests pass without evidence"],"answer":"Prevent sensitive inputs or credentials leaking through logs","explanation":"Observability itself can become a data exposure channel.","hint":"What might logs accidentally retain?","term":"observability","level":1,"quality":"legacy"},{"id":"eval-13","module":"eval","difficulty":"advanced","question":"An injected page persuades a model to ask for secret files. Which control is decisive?","options":["Raise top-p randomness","Hide the page title from UI","System prompt adds a second warning sentence only","Executor denies unauthorized filesystem and network access"],"answer":"Executor denies unauthorized filesystem and network access","explanation":"Independent permissions stop effects even when model behavior fails.","hint":"Which boundary remains trustworthy when generation isn't?","term":"least privilege","level":2,"quality":"legacy"},{"id":"eval-14","module":"eval","difficulty":"advanced","question":"A demo suite passes but production users report frequent failures on rare languages. What evaluation gap exists?","options":["A too-large p95 definition","Insufficient GUI shadows","Missing representative slices for those language workloads","Overuse of lexical search in every case"],"answer":"Missing representative slices for those language workloads","explanation":"Aggregate evaluations can hide subgroup/slice failures.","hint":"Which cases were absent from the test distribution?","term":"regression test","level":2,"quality":"legacy"},{"id":"eval-15","module":"eval","difficulty":"advanced","question":"An agent can write files before user sees an approval dialog. What is defective?","options":["The output schema is JSON","The interface is a TUI","The model tokenizer is outdated by definition","Approval occurs after the action rather than gating execution"],"answer":"Approval occurs after the action rather than gating execution","explanation":"Sensitive effects must be blocked until prior authorization.","hint":"What order must approval and execution follow?","term":"approval gate","level":2,"quality":"legacy"},{"id":"eval-16","module":"eval","difficulty":"advanced","question":"A system shows 99% answer accuracy but 5% forbidden tool writes. What is the deployment verdict?","options":["Fails safety acceptance regardless of average answer quality","Needs only larger KV cache","Can ignore tool actions as not model outputs","Passes because accuracy exceeds 80%"],"answer":"Fails safety acceptance regardless of average answer quality","explanation":"Unsafe side effects can be release blockers independent of quality.","hint":"Which risk dimension cannot be averaged away?","term":"threat model","learning_note":"Accuracy cannot compensate for unauthorized writes. A release gate should block on critical safety failures even when average answer quality is high.","level":2,"quality":"legacy"},{"id":"eval-17","module":"eval","difficulty":"advanced","question":"A model-generated “command succeeded” message appears; logs show exit code 1. What should scoring use?","options":["Temperature setting","Observed tool exit code and validation outcome","The model's closing statement","The length of final explanation"],"answer":"Observed tool exit code and validation outcome","explanation":"Independent tool evidence overrides generated claims.","hint":"Which record reflects real execution?","term":"audit trace","learning_note":"Treat the executor result (exit status and observed artifact state) as authoritative for tool success, not the model's narrative description.","level":2,"quality":"legacy"},{"id":"eval-18","module":"eval","difficulty":"advanced","question":"A guardrail classifier labels all content safe but network exfiltration succeeds. Why?","options":["GPU kernels grant authorization automatically","Classifier checks do not replace enforced egress and filesystem policy","A longer glossary would prevent it","Exfiltration is impossible without temperature 1"],"answer":"Classifier checks do not replace enforced egress and filesystem policy","explanation":"Defense-in-depth requires hard effect boundaries.","hint":"What can block network effects regardless of text classification?","term":"sandbox","level":2,"quality":"legacy"},{"id":"eval-19","module":"eval","difficulty":"advanced","question":"You compare models using different prompt sets. What is wrong?","options":["Nothing; all results are automatically comparable","The evaluation does not isolate model differences","All sampled outputs are deterministic","Only quantization affects evaluations"],"answer":"The evaluation does not isolate model differences","explanation":"Comparable evaluations need shared tasks and scoring criteria.","hint":"Which variables should be controlled?","term":"evaluation harness","level":2,"quality":"legacy"},{"id":"eval-20","module":"eval","difficulty":"advanced","question":"An evaluator relies entirely on an LLM judge. What additional proof is appropriate?","options":["Skip repeatability testing","Assume judge and generator always agree","Remove hard failure tests","Calibrate it against labeled human-reviewed cases and edge conditions"],"answer":"Calibrate it against labeled human-reviewed cases and edge conditions","explanation":"Judge biases can make scores misleading without calibration.","hint":"Who checks the checker?","term":"evaluation harness","level":2,"quality":"legacy"},{"id":"eval-21","module":"eval","difficulty":"advanced","question":"Security policy denies all writes in a read-only agent. How should the test prove it?","options":["Attempt representative writes and inspect denied effects and audit events","Rely on a comment in README","Inspect only the final model reply","Ask the model to describe the policy"],"answer":"Attempt representative writes and inspect denied effects and audit events","explanation":"Negative tests must exercise real enforcement paths.","hint":"A stated rule is not evidence of enforcement.","term":"regression test","level":2,"quality":"legacy"},{"id":"eval-22","module":"eval","difficulty":"advanced","question":"A tracing pipeline stores entire secret-bearing prompts for debugging. Which design improvement is best?","options":["Disable authorization checks","Store more plaintext for accuracy","Publish trace IDs publicly with secrets","Redact/minimize retained content and restrict telemetry access"],"answer":"Redact/minimize retained content and restrict telemetry access","explanation":"Logs need data-minimization and access controls.","hint":"Observability can itself create a breach.","term":"observability","level":2,"quality":"legacy"},{"id":"eval-23","module":"eval","difficulty":"advanced","question":"A RAG evaluation only scores whether an answer seems relevant. What is missing?","options":["Groundedness and source-citation validity checks","A different OS kernel","Higher GPU utilization target","More UI animation frames"],"answer":"Groundedness and source-citation validity checks","explanation":"Relevant prose can still be unsupported by retrieved evidence.","hint":"What claim can a reviewer validate against a source?","term":"citation grounding","level":2,"quality":"legacy"},{"id":"eval-24","module":"eval","difficulty":"advanced","question":"A security review identifies a malicious repository README. Which controls should be mapped?","options":["Only user browser bookmarks","Only model temperature","Only RGB colors and typography","Input provenance, tool scope, approval and egress policy"],"answer":"Input provenance, tool scope, approval and egress policy","explanation":"Prompt injection must be traced through data and authority boundaries.","hint":"Where can attack text enter and what can it make the system do?","term":"threat model","level":2,"quality":"legacy"},{"id":"eval-25","module":"eval","difficulty":"advanced","question":"A release passes median latency SLO but p95 worsens severely. What should happen?","options":["Inspect tail slices and hold release if p95 threshold is violated","Replace the tokenizer","Assume success because median is good","Turn off latency probes"],"answer":"Inspect tail slices and hold release if p95 threshold is violated","explanation":"SLOs must be enforced on defined service indicators, including tails.","hint":"Which user population sees the regressions?","term":"p95 latency","level":2,"quality":"legacy"},{"id":"eval-26","module":"eval","difficulty":"advanced","question":"A task evaluation reports a pass but cannot show created artifacts. What conclusion is justified?","options":["Completion is unverified; require independent artifact evidence","The tool API becomes authoritative by default","Only cost metrics matter","Pass should stand based on model tone"],"answer":"Completion is unverified; require independent artifact evidence","explanation":"Task-success claims need external proof, not text-only grading.","hint":"How could another operator reproduce the result?","term":"audit trace","level":2,"quality":"legacy"},{"id":"production-01","module":"production","difficulty":"foundation","question":"What is an SLO?","options":["A CLI syntax parser","A retrieval embedding index","A model tokenizer format","Measurable service performance or reliability objective"],"answer":"Measurable service performance or reliability objective","explanation":"SLOs set performance targets over defined windows.","hint":"Which term defines expected service behavior?","term":"SLO","level":1,"quality":"legacy"},{"id":"production-02","module":"production","difficulty":"foundation","question":"What is an SLI?","options":["A PDF chapter title","A model's trained parameter","An agent's fabricated completion note","Metric measuring observed service behavior"],"answer":"Metric measuring observed service behavior","explanation":"SLIs quantify the behavior against an SLO.","hint":"Distinguish measurement from target.","term":"SLI","level":1,"quality":"legacy"},{"id":"production-03","module":"production","difficulty":"foundation","question":"What does p95 latency describe?","options":["The model uses 95% of VRAM","All requests take the mean time","Exactly 95% of tokens are correct","95% of measured requests are no slower than that value"],"answer":"95% of measured requests are no slower than that value","explanation":"p95 is a latency percentile, not mean or quality.","hint":"Think of an empirical latency distribution.","term":"p95 latency","level":1,"quality":"legacy"},{"id":"production-04","module":"production","difficulty":"foundation","question":"What is an ADR?","options":["Architecture decision record covering choices and rationale","A network DNS record","A model decoding strategy","An operating-system kernel module"],"answer":"Architecture decision record covering choices and rationale","explanation":"ADRs capture options, evidence, constraints and decisions.","hint":"What document makes trade-offs reviewable?","term":"ADR","level":1,"quality":"legacy"},{"id":"production-05","module":"production","difficulty":"foundation","question":"What is rollback?","options":["Deleting all audit evidence","Randomly rerunning a failed model","Switching the UI to dark mode","Returning to a previously verified working configuration"],"answer":"Returning to a previously verified working configuration","explanation":"Rollback restores known-good state after regressions.","hint":"How do you recover from a bad release?","term":"rollback","level":1,"quality":"legacy"},{"id":"production-06","module":"production","difficulty":"foundation","question":"What is a canary rollout?","options":["Limited deployment to test change before broad release","A token sampling method","A special attention kernel","A deterministic tokenizer"],"answer":"Limited deployment to test change before broad release","explanation":"Canary rollout limits blast radius while collecting evidence.","hint":"Which launch path tests a small fraction first?","term":"canary","level":1,"quality":"legacy"},{"id":"production-07","module":"production","difficulty":"foundation","question":"What is capacity planning?","options":["Assuming all prompts cost the same","Picking a prettier terminal","Increasing number of citations without measurement","Estimating resources needed for real workload and concurrency"],"answer":"Estimating resources needed for real workload and concurrency","explanation":"Capacity planning ties workload mix to memory, compute and queues.","hint":"What predicts overload before it happens?","term":"capacity planning","level":1,"quality":"legacy"},{"id":"production-08","module":"production","difficulty":"foundation","question":"What does observability use?","options":["Only tokenizer vocabulary","Metrics, logs and traces to understand system behavior","Only benchmark names","Only user-facing model prose"],"answer":"Metrics, logs and traces to understand system behavior","explanation":"Telemetry supports diagnosis when protected and correlated.","hint":"What data helps reconstruct runtime health?","term":"observability","level":1,"quality":"legacy"},{"id":"production-09","module":"production","difficulty":"foundation","question":"What is a capstone proof artifact?","options":["A UI screenshot alone","An unexecuted model-generated plan","Reviewable implementation with tests, metrics and rollback","An inspirational statement"],"answer":"Reviewable implementation with tests, metrics and rollback","explanation":"A capstone should integrate architecture and evidence.","hint":"What convinces a skeptical engineering reviewer?","term":"ADR","level":1,"quality":"legacy"},{"id":"production-10","module":"production","difficulty":"foundation","question":"Why compare cost per successful task?","options":["Local GPU electricity is always free","Retries, failures and human rework affect total cost","Higher model parameter count guarantees savings","Token unit prices alone always capture cost"],"answer":"Retries, failures and human rework affect total cost","explanation":"Real unit economics include unsuccessful attempts and operating costs.","hint":"What happens after an inaccurate answer?","term":"capacity planning","level":1,"quality":"legacy"},{"id":"production-11","module":"production","difficulty":"foundation","question":"What is a deployment gate?","options":["Measured criteria required before rollout","A new IDE color scheme","A GPU fan control","A language-model token ID"],"answer":"Measured criteria required before rollout","explanation":"Gates prevent promotion of known-bad releases.","hint":"What checks must pass before change proceeds?","term":"regression test","level":1,"quality":"legacy"},{"id":"production-12","module":"production","difficulty":"foundation","question":"What should a design decision state?","options":["Only the number of model parameters","Only an API vendor slogan","Workload, constraints, options, evidence and residual risk","Only chosen framework name"],"answer":"Workload, constraints, options, evidence and residual risk","explanation":"Good architecture decisions are context-dependent and auditable.","hint":"What makes an option defensible?","term":"ADR","level":1,"quality":"legacy"},{"id":"production-13","module":"production","difficulty":"advanced","question":"A model costs 50% less per token but needs triple retries for equal task success. What should you compare?","options":["Browser color theme","GPU core count only","Expected total cost per accepted outcome","Advertised token price only"],"answer":"Expected total cost per accepted outcome","explanation":"Cost per successful task includes retries and rework.","hint":"What does the customer actually pay for?","term":"capacity planning","learning_note":"Compare cost per accepted task, including retries, latency, monitoring, human review, failures and infrastructure—not just price per token.","distractor_notes":{"Browser color theme":"Token price alone omits retries and failed attempts; compare total spend against accepted task outcomes.","GPU core count only":"Token price alone omits retries and failed attempts; compare total spend against accepted task outcomes.","Advertised token price only":"Token price alone omits retries and failed attempts; compare total spend against accepted task outcomes."},"level":2,"quality":"legacy"},{"id":"production-14","module":"production","difficulty":"advanced","question":"A runtime upgrade improves median TTFT but p95 latency doubles. What is the right release decision?","options":["Evaluate against the defined p95 SLO and workload slices","Ship because median improved","Ignore tail latency if throughput rose","Change only the UI"],"answer":"Evaluate against the defined p95 SLO and workload slices","explanation":"A release should meet its stated service objectives, not cherry-pick metrics.","hint":"Which quantile is the acceptance target?","term":"SLO","learning_note":"A better median can hide a worse user experience in the tail. Inspect p95, failure slices and the agreed service objective before shipping.","level":2,"quality":"legacy"},{"id":"production-15","module":"production","difficulty":"advanced","question":"Your data is sensitive and request volume is low. Which architecture reasoning is most sound?","options":["Compare local control with remote managed reliability using threat and cost evidence","Always choose the largest model","Assume local requires no maintenance","Always choose the cheapest API regardless of data policy"],"answer":"Compare local control with remote managed reliability using threat and cost evidence","explanation":"Workload, controls, quality and operations all determine suitability.","hint":"Which constraints may dominate raw throughput?","term":"threat model","level":2,"quality":"legacy"},{"id":"production-16","module":"production","difficulty":"advanced","question":"A canary shows more schema failures with unchanged model weights. Where should investigation start?","options":["Only language spelling","Physical monitor brand","The model cannot have changed behavior without new weights","Runtime, template, serving config and client contract differences"],"answer":"Runtime, template, serving config and client contract differences","explanation":"Multiple execution layers can change independently of model weights.","hint":"What changed along the request/response contract?","term":"chat template","level":2,"quality":"legacy"},{"id":"production-17","module":"production","difficulty":"advanced","question":"A capstone agent passes happy-path tests but has no denial tests. What is missing?","options":["A larger context window advertisement","An additional fancy dashboard","Negative security evidence for permission boundaries","More sample prompts with the same outcome"],"answer":"Negative security evidence for permission boundaries","explanation":"Production readiness requires proving refused unsafe actions.","hint":"What does the system do when asked to exceed scope?","term":"regression test","learning_note":"A happy-path demo shows one plausible trajectory. Negative tests show whether the system rejects forbidden actions and fails safely under attack or outage.","level":2,"quality":"legacy"},{"id":"production-18","module":"production","difficulty":"advanced","question":"You benchmark local and remote inference at different concurrency. What invalidates the conclusion?","options":["Both must use the same model vendor name","No architecture can be measured","Uncontrolled workload conditions confound the comparison","Comparing latency at all is forbidden"],"answer":"Uncontrolled workload conditions confound the comparison","explanation":"Workload normalization is necessary for fair design trade-offs.","hint":"Which variables need to match?","term":"capacity planning","level":2,"quality":"legacy"},{"id":"production-19","module":"production","difficulty":"advanced","question":"A system meets answer quality but violates data-retention policy by logging private text. What is the status?","options":["Not acceptable until telemetry/data controls are corrected","Only a decoding issue","Fine if GPU memory is encrypted","Ready because answer quality passed"],"answer":"Not acceptable until telemetry/data controls are corrected","explanation":"Security and privacy gates can block deployment independently of quality.","hint":"A successful answer does not excuse control violations.","term":"observability","level":2,"quality":"legacy"},{"id":"production-20","module":"production","difficulty":"advanced","question":"The team wants to replace a stable workflow with a multi-agent architecture. What evidence should be demanded?","options":["Only that it uses more tokens","Measured task benefit compared with added cost, latency and risk","Only an attractive diagram","Only that multi-agent is newer"],"answer":"Measured task benefit compared with added cost, latency and risk","explanation":"Complexity needs a justified improvement in outcomes.","hint":"What baseline should the redesign beat?","term":"ADR","level":2,"quality":"legacy"},{"id":"production-21","module":"production","difficulty":"advanced","question":"A new model wins general benchmarks but fails your domain tasks. What is the appropriate choice?","options":["Ignore negative cases if sampling temperature is low","Prefer measured task performance and risk thresholds over leaderboard rank","Assume higher parameter count forces accuracy","Always deploy the leaderboard leader"],"answer":"Prefer measured task performance and risk thresholds over leaderboard rank","explanation":"Domain-specific evaluations decide fitness for purpose.","hint":"Which benchmark matches the user's actual workload?","term":"evaluation harness","level":2,"quality":"legacy"},{"id":"production-22","module":"production","difficulty":"advanced","question":"A long-lived production assistant has no exact model/version record. What problem does it create?","options":["User consent is automatically withdrawn","Regression attribution and reproducible rollback become unreliable","The UI cannot draw buttons","The tokenizer always stops functioning"],"answer":"Regression attribution and reproducible rollback become unreliable","explanation":"Version evidence is essential to explain drift and restore known good.","hint":"How can an incident be reproduced later?","term":"rollback","level":2,"quality":"legacy"},{"id":"production-23","module":"production","difficulty":"advanced","question":"A throughput optimization reduces GPU cost but adds 15 seconds at p95. How should it be judged?","options":["Against total economics and explicit latency SLOs","Only tokens/sec averaged over the day","Only model response length","Only number of servers"],"answer":"Against total economics and explicit latency SLOs","explanation":"Serving efficiency and user experience must be balanced under defined constraints.","hint":"Is the slower tail acceptable for this workload?","term":"SLO","level":2,"quality":"legacy"},{"id":"production-24","module":"production","difficulty":"advanced","question":"A capstone reports zero errors after 20 requests. What confidence claim is responsible?","options":["The model can never hallucinate","All adversarial cases are covered","It passed 20 observed cases; broader reliability remains unproven","The failure rate is exactly zero forever"],"answer":"It passed 20 observed cases; broader reliability remains unproven","explanation":"Small samples give limited statistical evidence and do not cover unseen workloads.","hint":"What does the test sample actually support?","term":"evaluation harness","level":2,"quality":"legacy"},{"id":"production-25","module":"production","difficulty":"advanced","question":"A rollback script restores model weights but keeps a newly incompatible tokenizer. Is rollback complete?","options":["No; restore the full verified model/runtime/template contract","Yes; any tokenizer works with any weights","Yes; weights are the only dependency","No only because the UI theme changed"],"answer":"No; restore the full verified model/runtime/template contract","explanation":"Rollback must include all coupled artifacts and compatibility assumptions.","hint":"Which parts of the model contract must match?","term":"rollback","level":2,"quality":"legacy"},{"id":"production-26","module":"production","difficulty":"advanced","question":"Operators propose deleting failure logs to reduce costs. Which alternative is safer?","options":["Keep no evidence of unsafe tool actions","Assume health checks alone explain all incidents","Store secrets forever to increase detail","Use privacy-aware retention, sampling and useful correlation metadata"],"answer":"Use privacy-aware retention, sampling and useful correlation metadata","explanation":"Observability needs deliberate minimization rather than blind deletion.","hint":"What is the minimum diagnostic evidence needed?","term":"observability","level":2,"quality":"legacy"},{"id":"stack-v2-L2-01","module":"stack","level":2,"difficulty":"applied","lesson":0,"term":"harness","scenario":"A coding assistant shows a successful response in its TUI. The tool trace shows a denied file write from a different process identity.","question":"Which observation most directly identifies the failure boundary?","options":["The UI displayed model text, while executor authorization independently rejected the write.","The write may have succeeded before the denial was logged; first correlate operation IDs.","The harness selected the wrong tool, while the executor’s denial is only a secondary symptom.","A frontend error made the successful write appear denied in backend traces."],"answer":"The UI displayed model text, while executor authorization independently rejected the write.","explanation":"Presentation and execution are separate. The trusted tool executor may deny an action despite a plausible model response.","distractor_notes":{"The write may have succeeded before the denial was logged; first correlate operation IDs.":"Possible in general, but the given evidence explicitly identifies the denied write; no success receipt is shown.","The harness selected the wrong tool, while the executor’s denial is only a secondary symptom.":"Selection may warrant review, but it does not override the observed permission rejection.","A frontend error made the successful write appear denied in backend traces.":"A UI failure cannot rewrite the actual executor’s denial record."},"learning_note":"Draw the request and response directions separately, then identify the authoritative access-control check.","hint":"Identify what the evidence establishes; separate hypotheses from controlled decisions.","evidence":[],"quality":"curated","source":"Field manual · architecture boundaries, measurement and safe execution","original_answer_text":"The UI displayed model text, while executor authorization independently rejected the write."},{"id":"stack-v2-L2-02","module":"stack","level":2,"difficulty":"applied","lesson":1,"term":"runtime","scenario":"The same model weights work through a browser app and a terminal coding tool. Only the terminal version can run repository tests.","question":"Which difference best explains the added capability?","options":["The terminal application has a harness with authorized tool execution and a task loop.","The terminal shell provides capabilities; model tool proposals execute without an independent control loop.","The model endpoint includes a built-in test runner and the terminal only supplies a visual interface.","The terminal application enables a larger context window, which itself permits repository mutation."],"answer":"The terminal application has a harness with authorized tool execution and a task loop.","explanation":"Tool execution and task control are provided by application scaffolding, not by the display or the weights.","distractor_notes":{"The terminal shell provides capabilities; model tool proposals execute without an independent control loop.":"Shell presence does not automatically authorize or dispatch generated tool calls.","The model endpoint includes a built-in test runner and the terminal only supplies a visual interface.":"That architecture is possible but not established; the decisive observed difference is harness-controlled tooling.","The terminal application enables a larger context window, which itself permits repository mutation.":"Context capacity affects input, not execution privilege."},"learning_note":"List the process owner, state owner and credential scope before comparing two AI products.","hint":"Identify what the evidence establishes; separate hypotheses from controlled decisions.","evidence":[],"quality":"curated","source":"Field manual · architecture boundaries, measurement and safe execution","original_answer_text":"The terminal application has a harness with authorized tool execution and a task loop."},{"id":"stack-v2-L2-03","module":"stack","level":2,"difficulty":"applied","lesson":2,"term":"tokenizer","scenario":"An application replaces only a tokenizer. The model still loads, but role delimiters and function calls frequently fail.","question":"Which artifact pair should be inspected before changing infrastructure?","options":["The model-compatible tokenizer and chat template used to serialize each message.","The model and engine API revision, because role parsing is entirely determined by transport responses.","The user-level prompt and retrieval order, because both can reorder role boundary tokens after tokenization.","The model weight format and hardware backend, because a loaded model guarantees role compatibility."],"answer":"The model-compatible tokenizer and chat template used to serialize each message.","explanation":"The model consumes token IDs and learned role markers; an incompatible representation can corrupt conversation structure.","distractor_notes":{"The model and engine API revision, because role parsing is entirely determined by transport responses.":"API revisions may matter, but serialization compatibility is the directly altered representation boundary.","The user-level prompt and retrieval order, because both can reorder role boundary tokens after tokenization.":"Retrieved text remains data; explicit template markers structure the messages.","The model weight format and hardware backend, because a loaded model guarantees role compatibility.":"Successful weight loading alone does not prove role/template behavior."},"learning_note":"Trace a single tool call into role messages, encoded IDs and stopping behavior.","hint":"Identify what the evidence establishes; separate hypotheses from controlled decisions.","evidence":[],"quality":"curated","source":"Field manual · architecture boundaries, measurement and safe execution","original_answer_text":"The model-compatible tokenizer and chat template used to serialize each message."},{"id":"stack-v2-L2-04","module":"stack","level":2,"difficulty":"applied","lesson":3,"term":"sandbox","scenario":"Two tools run in the same container. Tool A reads documents and tool B deploys code; logs show both share a privileged service account.","question":"What security assumption is unsafe?","options":["The container boundary alone isolates tool permissions from one another.","That a shared service account may bypass per-tool ACLs unless effective scope is checked.","That tool schema declarations are weaker than runtime resource authorization.","That shared processes can still apply separate tool permissions when the executor supports them."],"answer":"The container boundary alone isolates tool permissions from one another.","explanation":"Process/container co-location is not an authorization boundary. Shared credentials can allow scope escalation if enforcement is absent.","distractor_notes":{"That a shared service account may bypass per-tool ACLs unless effective scope is checked.":"This is a supported risk, not the unsafe assumption about default container isolation.","That tool schema declarations are weaker than runtime resource authorization.":"Correct distinction: a schema is not a permission mechanism.","That shared processes can still apply separate tool permissions when the executor supports them.":"Correct possibility: runtime policy may enforce restrictions even in one container."},"learning_note":"Inventory effective identities and mounts in addition to network topology.","hint":"Identify what the evidence establishes; separate hypotheses from controlled decisions.","evidence":[],"quality":"curated","source":"Field manual · architecture boundaries, measurement and safe execution","original_answer_text":"The container boundary alone isolates tool permissions from one another."},{"id":"stack-v2-L2-05","module":"stack","level":2,"difficulty":"applied","lesson":4,"term":"model API","scenario":"A model endpoint returns a syntactically valid JSON tool request. The application rejects it because the user lacks write permission.","question":"Which subsystem owns the rejection?","options":["The application authorization policy and tool executor.","The client-side UI approval widget, assuming it already displayed a confirmation dialog.","The model service gateway, assuming the tool name and arguments are schema-valid.","The model response parser alone, because a well-formed action should carry its own authority."],"answer":"The application authorization policy and tool executor.","explanation":"A valid syntax/transport contract is separate from authenticated authority for side effects.","distractor_notes":{"The client-side UI approval widget, assuming it already displayed a confirmation dialog.":"Client UI may participate but cannot be the final permission authority.","The model service gateway, assuming the tool name and arguments are schema-valid.":"A gateway may enforce policy, but JSON validity alone does not authorize resource writes.","The model response parser alone, because a well-formed action should carry its own authority.":"Parsing proves syntax, not authenticated permission to mutate."},"learning_note":"Distinguish syntactic validity, semantic correctness and authorization as three checks.","hint":"Identify what the evidence establishes; separate hypotheses from controlled decisions.","evidence":[],"quality":"curated","source":"Field manual · architecture boundaries, measurement and safe execution","original_answer_text":"The application authorization policy and tool executor."},{"id":"stack-v2-L2-06","module":"stack","level":2,"difficulty":"applied","lesson":5,"term":"evaluation harness","scenario":"A migration keeps the same UI and model but replaces the agent harness. Tasks start failing while raw model inference quality appears unchanged.","question":"Which comparison is most informative?","options":["Replay fixed tasks and compare tool visibility, context assembly, approval decisions and state transitions.","Run the same open-ended user prompt on both and compare only final answer correctness.","Benchmark the model server latency to determine whether the harness introduced queue delays.","Compare tool descriptions but exclude approval and persistent state because weights are unchanged."],"answer":"Replay fixed tasks and compare tool visibility, context assembly, approval decisions and state transitions.","explanation":"Harness changes affect control flow and permitted actions, so inspect trajectories against a stable task set.","distractor_notes":{"Run the same open-ended user prompt on both and compare only final answer correctness.":"Identical output can conceal very different tool and authority trajectories.","Benchmark the model server latency to determine whether the harness introduced queue delays.":"Latency is one possible effect but cannot explain the full observed task failures.","Compare tool descriptions but exclude approval and persistent state because weights are unchanged.":"The harness directly controls approval/state and those are critical regression candidates."},"learning_note":"A successful final answer cannot by itself prove the execution trajectory was safe.","hint":"Identify what the evidence establishes; separate hypotheses from controlled decisions.","evidence":[],"quality":"curated","source":"Field manual · architecture boundaries, measurement and safe execution","original_answer_text":"Replay fixed tasks and compare tool visibility, context assembly, approval decisions and state transitions."},{"id":"stack-v2-L3-01","module":"stack","level":3,"difficulty":"judgment","lesson":0,"term":"harness","scenario":"An enterprise assistant must display rich chat responses, query a private incident store and request human approval before changing infrastructure. The UI team wants one all-powerful backend service.","question":"Which ownership design is strongest without losing functionality?","options":["Separate presentation, authenticated control/orchestration, scoped tools and inference; enforce approval at the mutation executor.","Keep the shared service but gate privileged actions in the browser; retain one executor identity.","Split the frontend and model service, but let the harness authorize itself through generated policy.","Centralize identity at an API gateway and audit all writes afterward without per-action approval."],"answer":"Separate presentation, authenticated control/orchestration, scoped tools and inference; enforce approval at the mutation executor.","explanation":"Clear trust boundaries and executor-side approval preserve capabilities while isolating authority and reducing blast radius.","distractor_notes":{"Keep the shared service but gate privileged actions in the browser; retain one executor identity.":"A browser prompt cannot protect a privileged executor reachable through other paths.","Split the frontend an
