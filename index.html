 let answered=Object.keys(r.answers).length;return `<div class="section-head"><div><div class="eyebrow">EVIDENCE-DRIVEN CASE STUDIO · ${E(m.title)}</div><h2>${E(c.title)}</h2><p>${E(c.objective)}</p></div><span class="pill ${answered===3?'pass':'neutral'}">${answered}/3 stages explored</span></div><div class="card card-pad"><div class="eyebrow">SCENARIO</div><p class="clinic-story">${E(c.story)}</p>${evidenceTable(c.evidence)}<div class="detail-grid" style="margin-top:18px"><div class="detail-box"><h4>Engineering constraints</h4><ul>${c.constraints.map(x=>`<li>${E(x)}</li>`).join('')}</ul></div><div class="detail-box"><h4>Evidence to produce</h4><p>${E(c.proof)}</p></div></div></div><div class="clinic-rail">${c.steps.map((st,i)=>{let selected=r.answers[i],has=Object.prototype.hasOwnProperty.call(r.answers,i);return `<section class="card card-pad clinic-stage" id="clinic-stage-${i}"><div class="question-meta"><span class="tag lvl-${i===0?1:i===1?2:3}">${E(st.stage)}</span><span class="fine">${has?'Reviewed · feedback available':'Analyze before choosing'}</span></div><h3>${E(st.question)}</h3><div class="question-options">${st.options.map((opt,j)=>`<button class="answer ${has?(opt===st.answer?'correct':opt===selected?'wrong':''):''}" data-clinic-answer="${i}" data-opt="${E(opt)}" ${has?'disabled':''}><span class="letter">${'ABCD'[j]}</span><span>${E(opt)}</span></button>`).join('')}</div>${has?`<div class="feedback ${selected===st.answer?'':'wrong'}"><strong>${selected===st.answer?'Evidence-supported answer':'Inspect the reasoning'}</strong><p>${E(st.explanation)}</p><div class="learning-deeper"><p><strong>Transfer insight:</strong> ${E(st.insight)}</p>${allDistractors(st)}</div><button class="txtbtn" data-clinic-retry="${i}">Try this stage again</button></div>`:`<p class="fine">Choose the most defensible answer. The rationale appears immediately; this is learning mode.</p>`}</section>`}).join('')}</div><div class="callout"><strong>${answered===3?'Case explored · now transfer the skill':'Turn the case into engineering evidence'}</strong><p>${E(c.proof)}</p><div class="rel-links">${c.connections.map(id=>`<button class="rel-btn" data-mod="${E(id)}">${E(MOD[id]?.title.slice(5)||id)} ${I('arrow','sm')}</button>`).join('')}<button class="rel-btn" data-tab="checkpoint">Module knowledge check ${I('arrow','sm')}</button></div></div>`}

function assessment(){if(S.activeExam)return examUI();if(UI.guided)return guidedUI();return `<div class="section-head"><div><div class="eyebrow">3-LEVEL MASTERY · 80% PASS · EVIDENCE BEFORE CONFIDENCE</div><h1 style="margin:7px 0">Knowledge is the beginning. Judgment is the test.</h1><p>Scored exams contain 30% foundations, 50% applied understanding and 20% engineering judgment. Getting Levels 1 and 2 entirely right reaches exactly 80%; Level 3 is how you reach 100%. Answers and hints remain hidden until submission.</p></div></div><div class="grid three-col">${[[1,'Identify concepts and boundaries'],[2,'Interpret evidence and diagnose'],[3,'Defend architecture under constraints']].map(([l,desc])=>`<div class="card stat"><span class="eyebrow">LEVEL ${l} · ${LEVEL[l].name}</span><span class="num">${LEVEL[l].weight}%</span><span class="cap">${E(desc)}</span><span class="meta">${Q.filter(x=>levelOf(x)===l).length} items available</span></div>`).join('')}</div><div class="exam-selection" style="margin-top:19px"><div class="card exam-choice"><span class="eyebrow">CROSS-DOMAIN EXAM</span><h2 style="margin:13px 0">Full architecture assessment</h2><p>20, 30 or 40 questions. Every module represented equally. Exact L1/L2/L3 weighting and shuffled alternatives, with more reasoning-heavy curated cases.</p><div class="field"><label for="examLength">Questions in exam</label><select id="examLength">${[20,30,40].map(x=>`<option value="${x}" ${UI.examLength===x?'selected':''}>${x} questions</option>`).join('')}</select></div><div style="margin-top:15px"><button class="btn primary" data-action="start-full-exam">${I('play')} Start full exam</button></div></div><div class="card exam-choice"><span class="eyebrow">FOCUSED EXAM</span><h2 style="margin:13px 0">One-module assessment</h2><p>20 unique questions: six L1, ten L2 and four L3. A successful score demands strong applied reasoning, not just memorized terminology.</p><div class="field"><label for="examModule">Select module</label><select id="examModule">${M.map(m=>`<option value="${m.id}" ${m.id===UI.examModule?'selected':''}>${E(m.title)}</option>`).join('')}</select></div><div style="margin-top:15px"><button class="btn primary" data-action="start-section-exam">${I('play')} Start section exam</button></div></div></div><div class="card card-pad guided-choice"><div class="eyebrow">LEARN BEFORE YOU ARE GRADED</div><h2 style="margin:10px 0">Guided architecture challenge</h2><p>Ten questions, one per domain, in increasing difficulty from foundations to engineering judgment. Reveal a hint, choose an answer, explore every alternative and follow the connected concepts. No exam score is recorded.</p><div class="linkrow" style="flex-wrap:wrap;gap:9px"><button class="btn primary" data-action="start-guided">${I('play')} Start guided challenge</button><button class="btn ghost" data-screen="casebook">${I('target')} Open the 10 engineering clinics</button></div></div><div class="card card-pad" style="margin-top:17px"><h3>How to interpret a result</h3><div class="grid three-col"><div><strong>Foundations · 30%</strong><p style="font-size:12px">Essential distinctions and vocabulary.</p></div><div><strong>Applied · 50%</strong><p style="font-size:12px">Measured data, diagnosis and failure boundaries.</p></div><div><strong>Judgment · 20%</strong><p style="font-size:12px">Architectural trade-offs and safety decisions.</p></div></div><p class="fine" style="margin-top:13px">A score is an educational indicator, not certification. Real-world expertise also needs tested labs, measured capstones and independent review. Option order is randomized; do not infer correctness from answer position or length.</p></div>${S.exams.length?`<div class="section-head"><h2>Recent attempts</h2><button class="txtbtn" data-screen="progress">All results ${I('arrow','sm')}</button></div><div class="grid three-col">${S.exams.slice().reverse().slice(0,3).map(x=>`<div class="card card-pad"><span class="pill ${x.passed?'pass':'fail'}">${x.passed?'Pass':'Not passed'}</span><h3 style="margin:12px 0">${x.percent}% · ${x.score}/${x.count}</h3><p style="font-size:12px">${E(x.mode==='full'?'Full assessment':MOD[x.module].title)} · ${date(x.date)}</p><button class="txtbtn" data-review="${x.id}">Review answers ${I('arrow','sm')}</button></div>`).join('')}</div>`:''}${footer()}`}
function startGuided(){const mods=shuffle(M.map(m=>m.id));const levels=shuffle([1,1,1,2,2,2,2,2,3,3]);const items=mods.map((m,i)=>sampleLevel(m,levels[i],1)[0]).sort((a,b)=>levelOf(QMAP[a.id])-levelOf(QMAP[b.id]));UI.guided={items,index:0,answers:{},hints:{},finished:false};UI.screen='assessment';render();window.scrollTo(0,0)}
 function guidedUI(){let p=UI.guided;if(p.finished){let correct=p.items.filter(x=>p.answers[x.id]===QMAP[x.id].answer).length;return `<div class="card card-pad"><div class="eyebrow">GUIDED LEARNING COMPLETE</div><h1 style="margin:13px 0">${correct}/${p.items.length} correct</h1><p>These are practice results, not a scored exam. More important: review the new concepts and try applying them in a lab.</p><div class="linkrow" style="gap:10px;flex-wrap:wrap"><button class="btn primary" data-action="start-guided">New guided challenge</button><button class="btn ghost" data-action="close-guided">Back to assessment center</button></div></div>${p.items.map((item,i)=>{const q=QMAP[item.id],selected=p.answers[item.id];return `<div class="result-row"><div class="eyebrow">QUESTION ${i+1} · ${E(MOD[q.module].title)}</div><h3>${E(q.question)}</h3>${evidenceTable(q.evidence)}<p>Your answer: <b>${E(selected)}</b> · Best answer: <b>${E(q.answer)}</b></p><p>${E(q.explanation)}</p>${learningPanel(q,selected)}</div>`}).join('')}`}
 const item=p.items[p.index],q=QMAP[item.id],answered=Object.prototype.hasOwnProperty.call(p.answers,item.id),selected=p.answers[item.id],hint=p.hints[item.id];return `<div class="exam-head"><div><div class="eyebrow">UNSCORED · GUIDED LEARNING</div><h2>Question ${p.index+1} of ${p.items.length}</h2></div><span class="pill neutral">One concept from each module</span></div><div class="exam-layout"><div class="card question"><div class="question-meta"><span ${levelTag(q)}<span class="fine">${E(MOD[q.module].title)}</span></div>${questionStem(q)}<div class="question-options">${item.options.map((x,i)=>`<button class="answer ${answered?(x===q.answer?'correct':x===selected?'wrong':''):''}" data-guided-answer="${E(x)}" ${answered?'disabled':''}><span class="letter">${'ABCD'[i]}</span><span>${E(x)}</span></button>`).join('')}</div>${hint&&!answered?`<div class="hint-panel">${E(q.hint)}</div>`:''}${answered?`<div class="feedback ${selected===q.answer?'':'wrong'}"><strong>${selected===q.answer?'Correct · now go one level deeper':'Understand the distinction'}</strong><p>${E(q.explanation)}</p>${learningPanel(q,selected)}${allDistractors(q)}<button class="txtbtn" data-term="${E(q.term)}">Review ${E(q.term)} ${I('arrow','sm')}</button></div>`:''}<div class="lesson-next"><button class="btn ghost" data-action="guided-hint" ${answered?'disabled':''}>${I('info','sm')} ${hint?'Hint shown':'Show hint'}</button><button class="btn primary" data-action="guided-next" ${answered?'':'disabled'}>${p.index===p.items.length-1?'See learning review':'Next question'} ${I('arrow','sm')}</button></div></div><aside class="card exam-sidebar"><h3>Learn, don't just guess.</h3><p>Reasoning and a concept connection appear after every answer. Hints are optional and this practice does not change your scored results.</p><div class="bar"><i style="width:${Math.round(100*(p.index+(answered?1:0))/p.items.length)}%"></i></div><p class="fine">${p.index+(answered?1:0)} of ${p.items.length} attempted</p><button class="btn ghost small" data-action="close-guided">Exit guided challenge</button></aside></div>`}
function createExam(mode,mod,length){if(S.activeExam&&!confirm('Replace the current unfinished exam?'))return;const chosen=sampleBlueprint(mode,mod,length);S.activeExam={id:uid(),mode,module:mode==='section'?mod:null,count:chosen.length,items:chosen,index:0,answers:{},date:Date.now(),blueprint:{level1:Math.round(length*.3),level2:Math.round(length*.5),level3:Math.round(length*.2)}};save();UI.screen='assessment';render();window.scrollTo(0,0)}
function examUI(){let ex=S.activeExam,rec=ex.items[ex.index],q=QMAP[rec.id],answered=Object.keys(ex.answers).length;return `<div class="exam-head"><div><div class="eyebrow">SCORED ASSESSMENT · ${E(ex.mode==='full'?'ALL TEN MODULES':MOD[ex.module].title)}</div><h2 style="margin:6px 0">Question ${ex.index+1} of ${ex.count}</h2></div><span class="pill neutral">${answered}/${ex.count} answered</span></div><div class="exam-layout"><div class="card question"><div class="question-meta">${levelTag(q)}<span class="fine">Domain: ${E(MOD[q.module].title.slice(5))}</span></div>${questionStem(q)}<div class="question-options">${rec.options.map((x,i)=>`<button class="answer ${ex.answers[rec.id]===x?'selected':''}" data-exam-answer="${E(x)}"><span class="letter">${'ABCD'[i]}</span><span>${E(x)}</span></button>`).join('')}</div><div class="lesson-next"><button class="btn ghost" data-action="exam-prev" ${ex.index===0?'disabled':''}>${I('back','sm')} Previous</button>${ex.index===ex.count-1?`<button class="btn primary" data-action="submit-exam">${I('check','sm')} Submit exam</button>`:`<button class="btn primary" data-action="exam-next">Next question ${I('arrow','sm')}</button>`}</div></div><aside class="card exam-sidebar"><div class="eyebrow">EXAM NAVIGATION</div><h3 style="margin:8px 0">Answer map</h3><div class="bar" style="margin:0 0 17px"><i style="width:${Math.round(100*answered/ex.count)}%"></i></div><div class="exam-index">${ex.items.map((item,i)=>`<button aria-label="Go to question ${i+1}" class="${ex.index===i?'current':ex.answers[item.id]?'answered':''}" data-exam-go="${i}">${i+1}</button>`).join('')}</div><p class="fine" style="margin:18px 0">${levelTag(q)} · No hints or correctness feedback until submission. Navigate and revise answers freely.</p><button class="btn primary" style="width:100%" data-action="submit-exam">${I('check','sm')} Submit exam</button><button class="txtbtn" style="margin-top:17px;color:#a55c62" data-action="abandon-exam">Discard attempt</button></aside></div>`}
function submitExam(){let ex=S.activeExam;if(!ex)return;let n=Object.keys(ex.answers).length;if(n<ex.count&&!confirm(`${ex.count-n} question(s) unanswered. Submit with those counted incorrect?`))return;let items=ex.items.map(x=>({id:x.id,selected:ex.answers[x.id]??null}));let score=items.filter(x=>x.selected===QMAP[x.id].answer).length,percent=Math.round(100*score/ex.count);let result={id:ex.id,date:Date.now(),mode:ex.mode,module:ex.module,count:ex.count,score,percent,passed:score/ex.count>=.80,items,levels:gradeBreakdown(ex.items,ex.answers)};S.exams.push(result);S.exams=S.exams.slice(-35);S.activeExam=null;save();UI.reviewId=result.id;UI.screen='results';UI.reviewWrongOnly=false;location.hash='results';render();window.scrollTo(0,0)}
function resultView(){let r=S.exams.find(x=>x.id===UI.reviewId)||S.exams.at(-1);if(!r)return `<div class="empty">No scored exam results yet. <button class="txtbtn" data-screen="assessment">Start an exam</button></div>`;let wrong=r.items.filter(x=>x.selected!==QMAP[x.id].answer),visible=UI.reviewWrongOnly?wrong:r.items;const answers=Object.fromEntries(r.items.map(x=>[x.id,x.selected]));const levels=gradeBreakdown(r.items,answers);const weakest=[...new Set(wrong.map(x=>QMAP[x.id].module))];return `<div class="results-summary"><span class="eyebrow" style="color:#96d3ce">EXAM OUTCOME · ${date(r.date)}</span><div class="big">${r.percent}%</div><span class="pill ${r.passed?'pass':'fail'}">${r.passed?'PASS · 80% MET':'NOT PASSED · 80% REQUIRED'}</span><p style="margin-top:15px">${r.score} correct of ${r.count} questions · ${E(r.mode==='full'?'Cross-domain assessment':MOD[r.module].title)}. Level 1 and 2 together make up 80% of the exam; Level 3 is necessary for a perfect score.</p><div class="linkrow" style="margin-top:18px"><button class="btn hero-primary" data-screen="assessment">Take another exam ${I('arrow','sm')}</button><button class="btn hero-ghost" data-screen="casebook">Engineering clinics</button></div></div><div class="section-head"><h2>Mastery by difficulty</h2><span class="fine">Each level has a different engineering purpose.</span></div><div class="level-summary">${levels.map(x=>`<div class="card card-pad level-mini lvl-${x.level}"><span class="eyebrow">${LEVEL[x.level].short}</span><strong>${x.correct}/${x.count}</strong><span class="fine">${x.pct}% correct within level · weight ${LEVEL[x.level].weight}%</span></div>`).join('')}</div>${weakest.length?`<div class="card card-pad" style="margin-top:18px"><span class="eyebrow">TARGETED NEXT STEPS</span><h3>Learn from the questions that did not land.</h3><p>Review the case studio and key concepts in each affected domain. Answering the same questions again immediately may measure memorization rather than transferable understanding.</p><div class="rel-links">${weakest.map(id=>`<button class="rel-btn" data-clinic-mod="${id}">Clinic: ${E(MOD[id].title.slice(5))} ${I('arrow','sm')}</button>`).join('')}</div></div>`:`<div class="callout"><strong>All answers supported in this sample.</strong><p>A perfect quiz does not establish production mastery. Validate your ability to produce independent evidence in a capstone.</p></div>`}<div class="section-head"><h2>Review the engineering reasoning</h2><div class="filterbar" style="margin:0"><button class="btn small ${UI.reviewWrongOnly?'primary':'ghost'}" data-action="review-wrong">Missed only</button><button class="btn small ${!UI.reviewWrongOnly?'primary':'ghost'}" data-action="review-all">All questions</button></div></div>${visible.length?visible.map((x,i)=>{let q=QMAP[x.id],ok=x.selected===q.answer;return `<div class="result-row"><div class="question-meta"><span class="pill ${ok?'pass':'fail'}">${ok?'Correct':'Needs review'}</span>${levelTag(q)}<span class="fine">${E(MOD[q.module].title.slice(5))}</span></div>${questionStem(q)}<p>Your answer: <strong>${E(x.selected||'Not answered')}</strong></p><p>Best answer: <strong>${E(q.answer)}</strong></p><p class="why">${E(q.explanation)}</p>${learningPanel(q,x.selected)}${allDistractors(q)}<div class="linkrow" style="gap:15px;flex-wrap:wrap"><button class="txtbtn" data-term="${E(q.term)}">Review: ${E(q.term)} ${I('arrow','sm')}</button><button class="txtbtn" data-clinic-mod="${q.module}">Apply: engineering clinic ${I('arrow','sm')}</button>${Number.isInteger(q.lesson)?`<button class="txtbtn" data-concept="${q.module}:${q.lesson}">Read the linked concept</button>`:''}</div></div>`}).join(''):`<div class="empty">No missed questions in this attempt. Inspect all items or try a fresh exam.</div>`}${docbanner()}${footer()}`}
function progressPage(){let passed=S.exams.filter(x=>x.passed).length;return `<div class="section-head"><div><div class="eyebrow">PROGRESS & EVIDENCE</div><h1 style="margin:7px 0">A transparent learning record.</h1><p>Readiness combines self-marked concepts, self-attested labs and scored checkpoints. Each category is shown independently.</p></div></div><div class="grid four-col"><div class="card stat"><span class="num">${allSteps()}/80</span><span class="cap">learning actions</span></div><div class="card stat"><span class="num">${M.filter(completed).length}/10</span><span class="cap">modules finished</span></div><div class="card stat"><span class="num">${passed}</span><span class="cap">passed scored exams</span></div><div class="card stat"><span class="num">${learnedTerms()}</span><span class="cap">repeated vocabulary</span></div></div><div class="card card-pad" style="margin-top:16px"><h3>Per-module checklist</h3><div class="table-wrap"><table class="progress-table"><thead><tr><th>Module</th><th>Lessons</th><th>Lab</th><th>Clinic stages</th><th>Best checkpoint</th><th>Status</th></tr></thead><tbody>${M.map(m=>`<tr><td><button class="txtbtn" data-mod="${m.id}">${E(m.title)}</button></td><td>${doneCount(m)}/6</td><td>${labDone(m)?'Logged':'—'}</td><td><button class="txtbtn" data-clinic-mod="${m.id}">${Object.keys(S.clinics?.[m.id]?.answers||{}).length}/3 decisions</button></td><td>${checkpoint(m)?checkpoint(m)+'%':'—'}</td><td><span class="pill ${completed(m)?'pass':'neutral'}">${completed(m)?'Done':'In progress'}</span></td></tr>`).join('')}</tbody></table></div></div><div class="section-head"><h2>Scored assessment history</h2></div>${S.exams.length?`<div class="card card-pad table-wrap"><table class="progress-table"><thead><tr><th>Date</th><th>Scope</th><th>Score</th><th>Result</th><th>Review</th></tr></thead><tbody>${S.exams.slice().reverse().map(x=>`<tr><td>${date(x.date)}</td><td>${E(x.mode==='full'?'Full exam':MOD[x.module].title)}</td><td>${x.score}/${x.count} (${x.percent}%)</td><td><span class="pill ${x.passed?'pass':'fail'}">${x.passed?'PASS':'RETRY'}</span></td><td><button class="txtbtn" data-review="${x.id}">Review ${I('arrow','sm')}</button></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty">No scored exams submitted yet.</div>`}<div class="section-head"><h2>Data controls</h2></div><div class="card card-pad"><p>All progress is saved locally in this browser when storage permits. Export it to a JSON backup and import on another machine. No account or server is used; clearing browser storage may remove local progress.</p><div class="linkrow" style="gap:10px;flex-wrap:wrap"><button class="btn primary small" data-action="export-progress">${I('download','sm')} Export progress JSON</button><button class="btn ghost small" data-action="import-progress">${I('upload','sm')} Import progress JSON</button><button class="btn danger small" data-action="reset-progress">Reset all progress</button><input id="progressImport" type="file" accept="application/json,.json" style="display:none" aria-label="Import saved progress"></div></div>${footer()}`}
function library(){let cats=[...new Set(SR.map(x=>x.category))],items=SR.filter(x=>UI.libraryGroup==='all'||x.category===UI.libraryGroup);return `<div class="section-head"><div><div class="eyebrow">ALL ${SR.length} ANNOTATED REFERENCES FROM THE MANUAL</div><h1 style="margin:7px 0">Read deeper. Verify the source.</h1><p>Official specifications, research, tutorials and GitHub projects. Every resource carries its original R-number so you can match the source PDF.</p></div></div>${docbanner()}<div class="grid two-col" style="margin-top:18px"><div class="card card-pad"><h3>Read the 46-page field manual</h3><p>Source of truth for diagrams, terminology, patterns, labs and capstone requirements.</p><a class="btn ghost small" target="_blank" href="docs/AI_Systems_Field_Manual.pdf">${I('file')} Open PDF</a></div><div class="card card-pad"><h3>Use the two-page study guide</h3><p>Reading order, repeatable study protocol and evidence-based checkpoints.</p><a class="btn ghost small" target="_blank" href="docs/Opening_Study_Guide.pdf">${I('file')} Open PDF</a></div></div><div class="section-head"><h2>Annotated source index</h2><div class="filterbar" style="margin:0"><select id="sourceGroup" aria-label="Reference category"><option value="all">All ${SR.length} sources</option>${cats.map(x=>`<option value="${E(x)}" ${UI.libraryGroup===x?'selected':''}>${E(x)}</option>`).join('')}</select></div></div><div class="resource-grid">${items.map(x=>`<div class="resource-item">${I('external')}<div><div class="linkrow" style="flex-wrap:wrap"><span class="tag dim">${E(x.id)}</span><a href="${E(x.url)}" target="_blank" rel="noopener noreferrer">${E(x.title)} ${I('external','sm')}</a></div><p>${E(x.note)}</p><span class="fine">${E(x.category)} · Manual page ${x.page}</span></div></div>`).join('')}</div><div class="callout amber"><strong>Verify compatibility before copying commands</strong><p>Documentation and GitHub repositories evolve. Check the exact runtime, driver, model family and SDK revision for your installation. The 2026-07-28 MCP protocol changes request/session behavior relative to older tutorials.</p></div>${footer()}`}
function searchPage(){let term=UI.search.trim().toLowerCase(),topics=[],terms=[],questions=[];if(term){for(let m of M)for(let t of m.topics)if([t.name,t.explain,t.problem].join(' ').toLowerCase().includes(term))topics.push({m,t});terms=V.filter(x=>[x.term,x.definition,x.contrast].join(' ').toLowerCase().includes(term));questions=Q.filter(x=>[x.question,x.term].join(' ').toLowerCase().includes(term)).slice(0,15)}return `<div class="section-head"><div><div class="eyebrow">CONNECT THE MATERIAL</div><h1 style="margin:7px 0">Search the academy</h1><p>${term?`Results for “${E(UI.search)}” in ${M.length*6} lessons, ${V.length} terms and ${Q.length} questions.`:'Type a term, layer, failure or pattern into the search field in the top bar and press Enter.'}</p></div></div>${term?`<div class="card card-pad"><h3>Lessons (${topics.length})</h3>${topics.length?topics.slice(0,20).map(({m,t})=>`<div class="search-row"><div><strong>${E(t.name)}</strong><p style="margin:4px 0;font-size:12px">${E(t.problem)}</p><span class="fine">${E(m.title)}</span></div><button class="btn small ghost" data-concept="${m.id}:${m.topics.indexOf(t)}">Open ${I('arrow','sm')}</button></div>`).join(''):`<p class="fine">No matching lesson names or concepts.</p>`}</div><div class="card card-pad" style="margin-top:15px"><h3>Vocabulary (${terms.length})</h3>${terms.slice(0,24).map(x=>`<div class="search-row"><div><strong>${E(x.term)}</strong><p style="margin:3px 0;font-size:12px">${E(x.definition)}</p></div><button class="btn small ghost" data-term="${E(x.term)}">Review</button></div>`).join('')}</div><div class="card card-pad" style="margin-top:15px"><h3>Question bank (${questions.length}${Q.filter(x=>x.question.toLowerCase().includes(term)).length>15?'+':''})</h3>${questions.map(x=>`<div class="search-row"><div><strong>${E(x.question)}</strong><p class="fine" style="margin:6px 0">${E(MOD[x.module].title)} · ${x.difficulty}</p></div><button class="btn small ghost" data-term="${E(x.term)}">Learn term</button></div>`).join('')}</div>`:''}${footer()}`}
function patternPage(){let p=PAT.find(x=>x.id===UI.patternSelection)||PAT[0];return `<div class="section-head"><div><div class="eyebrow">11 PATTERNS FROM THE FIELD MANUAL · PP. 22–25</div><h1 style="margin:7px 0">Choose the least autonomy needed.</h1><p>A pattern is a repeatable control-flow solution, not a framework brand. Use predictable pipelines for predictable tasks; introduce tool choice, delegation and durable state only when the workload justifies it.</p></div></div><div class="grid two-col"><div class="card card-pad"><div class="eyebrow">PATTERN ATLAS</div><div class="pattern-choice-grid" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:15px">${PAT.map(x=>`<button class="rel-btn" style="padding:12px;text-align:left;${x.id===p.id?'background:#d7eeea;border-color:#76b7b0;':''}" data-pattern="${x.id}"><strong>${x.id}</strong> ${E(x.title)}</button>`).join('')}</div></div><div class="card card-pad"><div class="eyebrow">${p.id} · SELECTED PATTERN</div><h2 style="margin:12px 0">${E(p.title)}</h2><div class="code-wrap"><pre>${E(p.flow)}</pre></div><div class="callout"><strong>Use when</strong><p>${E(p.when)}</p></div><div class="detail-box warn"><h4>Trade-off / characteristic failure</h4><p>${E(p.risk)}</p></div><div class="detail-box" style="margin-top:12px"><h4>One proof-oriented test</h4><p>${E(p.test)}</p></div><div class="linkrow" style="margin-top:17px;flex-wrap:wrap"><button class="btn small primary" data-mod="${p.module}">Study foundations ${I('arrow','sm')}</button><a class="btn small ghost" href="docs/AI_Systems_Field_Manual.pdf#page=22" target="_blank">${I('file','sm')} Source pp. 22–25</a></div></div></div><div class="section-head"><h2>Three designs for the same job</h2></div><div class="grid three-col"><div class="card card-pad"><span class="tag">A · PROTOTYPE</span><h3 style="margin:13px 0 8px">Paste tickets and summarize</h3><p>Fast first draft. Fails when context is incomplete, permissions differ, freshness changes or citations must be audited.</p></div><div class="card card-pad"><span class="tag">B · REPEATABLE</span><h3 style="margin:13px 0 8px">Authenticated fixed pipeline</h3><p>Fetch permitted tickets, filter, normalize, summarize and verify IDs. Best default for predictable weekly reporting.</p></div><div class="card card-pad"><span class="tag advanced">C · EXPLORATORY</span><h3 style="margin:13px 0 8px">Bounded tool agent</h3><p>Investigate conflicting evidence with permitted tools and stop rules. Justified for ambiguous incidents, not routine reports.</p></div></div><div class="section-head"><h2>Multi-agent topology is a separate decision</h2></div><div class="grid three-col">${[['Handoff','Specialist owns the next interaction; preserve consent and context.'],['Agents as tools','Manager retains result ownership; bound nested tool and token budgets.'],['Peer-to-peer / A2A','Independent agents cooperate across trust and organization boundaries.'],['Reviewer / critic','Separate verification can detect defects, but correlated errors remain.'],['Self-reflection loop','Retry only with new test evidence; stop if no new information.']].map(x=>`<div class="card stage-card"><h3 style="margin:0 0 7px">${x[0]}</h3><p>${x[1]}</p></div>`).join('')}</div><div class="callout amber"><strong>Pattern selection rule</strong><p>First prove the fixed workflow baseline. Only adopt an agent when model-directed tool choice increases successful task completion enough to justify additional latency, cost and risk. Do not confuse parallel model calls with autonomous agents.</p></div>${footer()}`}
function capstonesPage(){let c=CAP.find(x=>x.id===UI.capstoneSelection)||CAP[0];return `<div class="section-head"><div><div class="eyebrow">PORTFOLIO · PDF CHAPTER 13</div><h1 style="margin:7px 0">Prove competence with artifacts.</h1><p>The four capstone tracks combine the layers, tools, failures and evidence. These are project specifications to execute in your own safe environment, not auto-run laboratories.</p></div></div><div class="grid four-col">${CAP.map(x=>`<button class="card card-pad" style="text-align:left;border-color:${x.id===c.id?'#48a6a2':'#e4e9f1'};background:${x.id===c.id?'#eef9f6':'#fff'}" data-capstone="${x.id}"><span class="tag">TRACK ${x.id}</span><h3 style="margin:12px 0 7px">${E(x.title)}</h3><p style="font-size:12px">${E(x.level)}</p></button>`).join('')}</div><div class="card card-pad" style="margin-top:18px"><div class="eyebrow">CAPSTONE ${c.id} · ${E(c.level)}</div><h2 style="margin:10px 0">${E(c.title)}</h2><p style="font-size:15px">${E(c.brief)}</p><div class="grid three-col"><div class="detail-box"><h4>Build</h4><ol style="padding-left:18px">${c.build.map(x=>`<li style="margin-bottom:9px;font-size:13px">${E(x)}</li>`).join('')}</ol></div><div class="detail-box"><h4>Negative tests</h4><ul style="padding-left:18px">${c.tests.map(x=>`<li style="margin-bottom:9px;font-size:13px">${E(x)}</li>`).join('')}</ul></div><div class="detail-box"><h4>Acceptance gate</h4><p>${E(c.gate)}</p><div style="margin-top:17px"><a class="btn ghost small" href="docs/AI_Systems_Field_Manual.pdf#page=36" target="_blank">${I('file','sm')} Full capstone brief</a></div></div></div><div class="eyebrow" style="margin:24px 0 11px">PREREQUISITE MODULES</div><div class="rel-links">${c.modules.map(id=>`<button class="rel-btn" data-mod="${id}">${E(MOD[id].title.slice(5))} ${I('arrow','sm')}</button>`).join('')}</div></div><div class="callout"><strong>Readiness definition</strong><p>A portfolio item is complete only when it has a diagram, versioned inputs, representative tests, negative tests, outcomes, known failures, measurable trade-offs, and a recovery strategy. An attractive demo alone does not establish engineering competence.</p></div>${footer()}`}
function studySchedule(){return `<div class="section-head"><div><span class="eyebrow">WEEK-BY-WEEK PLAN · PDF PP. 37–38</span><h2>16 weeks of concrete evidence</h2></div></div><div class="card card-pad table-wrap"><table class="progress-table"><thead><tr><th>Week</th><th>Focus</th><th>Deliverable to demonstrate</th><th>Study</th></tr></thead><tbody>${WEEKS.map(x=>`<tr><td><strong>${String(x.week).padStart(2,'0')}</strong></td><td><strong>${E(x.title)}</strong><div class="fine" style="margin-top:4px;max-width:260px">${E(x.focus)}</div></td><td>${E(x.deliverable)}</td><td><button class="txtbtn" data-mod="${x.module}">Open module</button></td></tr>`).join('')}</tbody></table></div>`}

function render(){app.innerHTML=`<div class="shell">${sidebar()}<div class="main-area">${topbar()}<main class="page">${UI.screen==='home'?home():UI.screen==='curriculum'?curriculum():UI.screen==='learn'?moduleView():UI.screen==='stack'?stackPage():UI.screen==='patterns'?patternPage():UI.screen==='vocab'?vocab():UI.screen==='labs'?labsHub():UI.screen==='casebook'?casebookPage():UI.screen==='capstones'?capstonesPage():UI.screen==='assessment'?assessment():UI.screen==='progress'?progressPage():UI.screen==='library'?library():UI.screen==='results'?resultView():searchPage()}</main></div><div class="scrim ${UI.navOpen?'open':''}" data-action="navclose"></div></div>`;document.title='AI Systems Academy · '+(UI.screen==='learn'?MOD[UI.mod].title:UI.screen)}
function changeTab(tab){UI.tab=tab;UI.practice=tab==='checkpoint'?UI.practice:null;route('learn',UI.mod,tab,UI.lesson)}
function copyText(text){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(()=>toast('Snippet copied')).catch(()=>legacyCopy(text));}else legacyCopy(text)}
function legacyCopy(text){let ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.left='-9999px';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Snippet copied')}catch(e){toast('Copy not available — select text from the snippet')}ta.remove()}
function currentVocabList(){return V.filter(x=>(UI.vocabModule==='all'||x.module===UI.vocabModule)&&(!UI.search||[x.term,x.definition,x.contrast].join(' ').toLowerCase().includes(UI.search.toLowerCase()))&&(UI.vocabFilter!=='due'||!S.vocab[x.term]||S.vocab[x.term].due<=Date.now())&&(UI.vocabFilter!=='learning'||!S.vocab[x.term]||S.vocab[x.term].stage<2))}
function reviewTerm(term){let obj=V.find(x=>x.term===term);if(!obj)return;UI.search='';UI.vocabModule='all';UI.vocabFilter='all';UI.vocabIndex=V.indexOf(obj);UI.vocabReveal=false;route('vocab')}
function openConcept(id,idx){route('learn',id,'concepts',idx)}
function startPractice(){let m=MOD[UI.mod];UI.practice={module:m.id,questions:shuffle([...sampleLevel(m.id,1,1),...sampleLevel(m.id,2,3),...sampleLevel(m.id,3,1)]),answers:{},hints:{},index:0,finished:false};UI.screen='learn';UI.tab='checkpoint';render()}
function finishPractice(){let p=UI.practice,pct=Math.round(100*p.questions.filter(x=>p.answers[x.id]===QMAP[x.id].answer).length/p.questions.length);let old=S.checkpoints[p.module]||{best:0,attempts:[]};old.best=Math.max(old.best,pct);old.attempts.push({date:Date.now(),score:pct});old.attempts=old.attempts.slice(-25);S.checkpoints[p.module]=old;p.finished=true;save();render()}
function nextVocab(){let a=currentVocabList();UI.vocabIndex=a.length?(UI.vocabIndex+1)%a.length:0;UI.vocabReveal=false;render()}
function gradeVocab(value){let a=currentVocabList(),c=a[UI.vocabIndex];if(!c)return;let prior=S.vocab[c.term]||{stage:0},stage=value==='known'?Math.min(prior.stage+1,4):0;let delays=[0,1,3,7,14];let due=value==='known'?Date.now()+delays[stage]*86400000:Date.now();S.vocab[c.term]={stage,due,last:Date.now()};save();nextVocab();toast(value==='known'?`Review scheduled (stage ${stage})`:'Card added to immediate review')}
function updateCalculator(){let inps=document.querySelectorAll('[data-calc]'),v={};inps.forEach(x=>v[x.dataset.calc]=Math.max(1,Number(x.value)||1));UI.calc=v;let bytes=2*v.layers*v.heads*v.dim*v.tokens*v.bytes*v.seq;document.getElementById('calcResult').textContent='≈ '+(bytes/1048576).toLocaleString(undefined,{maximumFractionDigits:1})+' MiB';}
function validateJSON(){let el=document.getElementById('jsonResult'),val;try{val=JSON.parse(document.getElementById('jsonProbe').value)}catch(e){el.textContent='FAIL: not valid JSON — '+e.message;return}let errors=[];if(val===null||Array.isArray(val)||typeof val!=='object')errors.push('Expected a JSON object');else{let keys=Object.keys(val);if(keys.some(k=>!['claim','evidence_ids'].includes(k)))errors.push('Unexpected field');if(typeof val.claim!=='string'||!val.claim.trim()||val.claim.length>160)errors.push('claim must be nonempty string ≤160 chars');if(!Array.isArray(val.evidence_ids)||!val.evidence_ids.length||!val.evidence_ids.every(x=>['P1','P2'].includes(x)))errors.push('evidence_ids must be nonempty array of allowed IDs (P1, P2)')}el.textContent=errors.length?'FAIL: '+errors.join('; '):'PASS: structure and allowed evidence IDs validated. This does not prove source claims are true.';el.style.color=errors.length?'#b84b52':'#12734a'}
function ragSearch(){const query=document.getElementById('ragQuery').value.trim().toLowerCase(),role=document.getElementById('ragRole').value,el=document.getElementById('ragResult');const docs=[{id:'P1',role:'public',text:'Retention policy: public draft records kept for 30 days.'},{id:'P2',role:'staff',text:'Internal retention policy: confidential staff records kept 90 days under the example schedule.'},{id:'P3',role:'public',text:'Service status: example maintenance window Friday at noon.'}];const words=query.split(/\W+/).filter(x=>x.length>=3);const matches=docs.filter(x=>(role==='staff'||x.role==='public')).map(x=>({...x,score:words.filter(w=>x.text.toLowerCase().includes(w)).length})).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);el.innerHTML=matches.length?matches.map(x=>`<div style="padding:10px 0;border-top:1px solid #d8e9e1"><strong>${x.id} · ${x.role}</strong> (${x.score} lexical matches)<p style="margin:5px 0;font-size:12px">${E(x.text)}</p></div>`).join(''):'No authorized matching snippets. A production system would need measured lexical/semantic retrieval and authorization.'}
function exportProgress(){let obj={exportType:'AISystemsAcademyProgress',exportedAt:new Date().toISOString(),data:S};let blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ai-academy-progress-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Progress backup downloaded')}
function importProgress(file){let reader=new FileReader();reader.onload=()=>{try{let o=JSON.parse(reader.result);if(o.exportType!=='AISystemsAcademyProgress'||o.data.version!==1||!o.data.doneTopics||!Array.isArray(o.data.exams))throw Error('Unsupported progress backup');if(!confirm('Replace current local progress with this backup?'))return;S={...defaults(),...o.data};save();UI.practice=null;UI.reviewId=null;route('progress');toast('Progress backup restored')}catch(e){toast('Import rejected: '+e.message)}};reader.readAsText(file)}
function handleAction(action,el){const m=MOD[UI.mod];switch(action){case 'navtoggle':UI.navOpen=true;render();return;case 'navclose':UI.navOpen=false;render();return;case 'continue':route('learn',M.find(x=>!completed(x))?.id||M[0].id);return;
 case 'toggle-concept':{let key=m.id+':'+UI.lesson;S.doneTopics[key]=!S.doneTopics[key];save();render();return}
 case 'next-lesson':if(UI.lesson<5)route('learn',m.id,'concepts',UI.lesson+1);else route('learn',m.id,'trace');return;
 case 'complete-lab':{let steps=S.labSteps[m.id]||[];if(!m.lab.steps.every((x,i)=>steps[i])){toast('Check all lab steps actually performed');return}let note=S.labEvidence[m.id]||'';if(note.trim().length<30){toast('Document at least 30 characters of lab evidence');return}S.doneLabs[m.id]=true;save();render();toast('Self-reported lab evidence logged');return}
 case 'start-guided':startGuided();return;case 'guided-hint':{let p=UI.guided;p.hints[p.items[p.index].id]=true;render();return}case 'guided-next':{let p=UI.guided;if(p.index===p.items.length-1)p.finished=true;else p.index++;render();return}case 'close-guided':UI.guided=null;render();return;case 'start-practice':startPractice();return;case 'practice-hint':UI.practice.hints[UI.practice.questions[UI.practice.index].id]=true;render();return;case 'practice-next':if(UI.practice.index===UI.practice.questions.length-1)finishPractice();else{UI.practice.index++;render()}return;
 case 'vocab-reveal':UI.vocabReveal=true;render();return;case 'vocab-next':nextVocab();return;case 'vocab-random':{let a=currentVocabList();UI.vocabIndex=Math.floor(Math.random()*a.length)||0;UI.vocabReveal=false;render();return}case 'vocab-grade':gradeVocab(el.dataset.value);return;
 case 'clinic-retry':{let record=clinicRecord(UI.mod);delete record.answers[+el.dataset.clinicRetry];save();render();return}case 'validate-json':validateJSON();return;case 'rag-search':ragSearch();return;
 case 'start-full-exam':createExam('full',null,UI.examLength);return;case 'start-section-exam':createExam('section',UI.examModule,20);return;
 case 'exam-prev':S.activeExam.index=Math.max(0,S.activeExam.index-1);save();render();return;case 'exam-next':S.activeExam.index=Math.min(S.activeExam.count-1,S.activeExam.index+1);save();render();return;case 'submit-exam':submitExam();return;case 'abandon-exam':if(confirm('Discard this unfinished exam?')){S.activeExam=null;save();render()}return;
 case 'review-wrong':UI.reviewWrongOnly=true;render();return;case 'review-all':UI.reviewWrongOnly=false;render();return;
 case 'export-progress':exportProgress();return;case 'import-progress':document.getElementById('progressImport').click();return;case 'reset-progress':if(confirm('Erase ALL local study progress, exams, labs and vocabulary history? This cannot be undone unless you exported a backup.')){S=defaults();save();UI.practice=null;UI.reviewId=null;route('progress');toast('Local progress reset')}return;}}
app.addEventListener('click',e=>{let x=e.target.closest('button,[role="button"]');if(!x)return;if(x.dataset.screen){route(x.dataset.screen);return}if(x.dataset.mod){route('learn',x.dataset.mod,'concepts',0);return}if(x.dataset.concept){let [m,i]=x.dataset.concept.split(':');openConcept(m,+i);return}if(x.dataset.labMod){route('learn',x.dataset.labMod,'lab');return}if(x.dataset.clinicMod){route('learn',x.dataset.clinicMod,'clinic');return}if(x.dataset.tab){changeTab(x.dataset.tab);return}if(x.dataset.lesson!==undefined){route('learn',UI.mod,'concepts',+x.dataset.lesson);return}if(x.dataset.layer!==undefined){UI.selectedLayer=+x.dataset.layer;render();return}if(x.dataset.pattern){UI.patternSelection=x.dataset.pattern;render();return}if(x.dataset.capstone){UI.capstoneSelection=x.dataset.capstone;render();return}if(x.dataset.term){reviewTerm(x.dataset.term);return}if(x.dataset.review){UI.reviewId=x.dataset.review;UI.reviewWrongOnly=true;route('results');return}if(x.dataset.clinicAnswer!==undefined){let record=clinicRecord(UI.mod),idx=+x.dataset.clinicAnswer;if(!Object.prototype.hasOwnProperty.call(record.answers,idx)){record.answers[idx]=x.dataset.opt;save();render()}return}if(x.dataset.clinicRetry!==undefined){handleAction('clinic-retry',x);return}if(x.dataset.codeStep!==undefined){let step=MOD[UI.mod].lab.steps[+x.dataset.codeStep];copyText(step.code);return}if(x.dataset.guidedAnswer!==undefined){let p=UI.guided;if(p){let id=p.items[p.index].id;if(!Object.prototype.hasOwnProperty.call(p.answers,id)){p.answers[id]=x.dataset.guidedAnswer;render()}}return}if(x.dataset.practiceAnswer!==undefined){let pr=UI.practice,item=pr.questions[pr.index];if(!pr.answers[item.id]){pr.answers[item.id]=x.dataset.practiceAnswer;render()}return}if(x.dataset.examAnswer!==undefined){let ex=S.activeExam;if(ex){ex.answers[ex.items[ex.index].id]=x.dataset.examAnswer;save();render()}return}if(x.dataset.examGo!==undefined){S.activeExam.index=+x.dataset.examGo;save();render();return}if(x.dataset.action)handleAction(x.dataset.action,x)});
app.addEventListener('change',e=>{let x=e.target;if(x.dataset.labStep!==undefined){let a=S.labSteps[UI.mod]||[];a[+x.dataset.labStep]=x.checked;S.labSteps[UI.mod]=a;S.doneLabs[UI.mod]=false;save();render()}else if(x.id==='sourceGroup'){UI.libraryGroup=x.value;render()}else if(x.id==='vocabModule'){UI.vocabModule=x.value;UI.vocabIndex=0;UI.vocabReveal=false;render()}else if(x.id==='vocabFilter'){UI.vocabFilter=x.value;UI.vocabIndex=0;UI.vocabReveal=false;render()}else if(x.id==='examModule'){UI.examModule=x.value}else if(x.id==='examLength'){UI.examLength=+x.value}else if(x.id==='progressImport'&&x.files[0]){importProgress(x.files[0])}});
app.addEventListener('input',e=>{let x=e.target;if(x.dataset.labEvidence!==undefined){S.labEvidence[UI.mod]=x.value;S.doneLabs[UI.mod]=false;save()}else if(x.dataset.calc!==undefined){updateCalculator()}else if(x.id==='searchInput'){UI.search=x.value}});
app.addEventListener('submit',e=>{if(e.target.id==='searchForm'){e.preventDefault();route('search')}});
app.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role=button][data-term]')){e.preventDefault();reviewTerm(e.target.dataset.term)}});
window.addEventListener('hashchange',restoreRoute);
restoreRoute();
window.__academyTest={getData:()=>DATA,getState:()=>S,selectFull:(n)=>createExam('full',null,n),selectSection:(id)=>createExam('section',id,20),score:submitExam,modStats:()=>M.map(m=>({module:m.id,questions:Q.filter(x=>x.module===m.id).length,levels:[1,2,3].map(l=>Q.filter(x=>x.module===m.id&&levelOf(x)===l).length)}))};
})();
