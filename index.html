d model service, but let the harness authorize itself through generated policy.":"Separating processes helps only when policy is independently enforced.","Centralize identity at an API gateway and audit all writes afterward without per-action approval.":"Authentication and after-the-fact auditing do not replace approval for exact mutations."},"learning_note":"A process may host multiple planes; the critical design property is independently enforced contracts.","hint":"Identify what the evidence establishes; separate hypotheses from controlled decisions.","evidence":[],"quality":"curated","source":"Field manual · architecture boundaries, measurement and safe execution","original_answer_text":"Separate presentation, authenticated control/orchestration, scoped tools and inference; enforce approval at the mutation executor."},{"id":"stack-v2-L3-02","module":"stack","level":3,"difficulty":"judgment","lesson":1,"term":"runtime","scenario":"A mobile UI and a terminal UI will share one local model server, but only the terminal client may edit source code. Both need identical factual replies when no tools are used.","question":"Which design minimizes accidental privilege coupling?","options":["Share inference; isolate each client’s harness and tool authority.","Keep a common harness, but use frontend feature flags to hide write tools on mobile.","Run separate model backends for each client but share a superuser tool identity.","Share a global tool registry and rely on model-side prompts to restrict mobile edits."],"answer":"Share inference; isolate each client’s harness and tool authority.","explanation":"Inference can be shared while authorization and tool visibility remain client-specific.","distractor_notes":{"Keep a common harness, but use frontend feature flags to hide write tools on mobile.":"Feature flags control presentation rather than the executor’s authority.","Run separate model backends for each client but share a superuser tool identity.":"Different inference endpoints do not solve the shared privileged execution identity.","Share a global tool registry and rely on model-side prompts to restrict mobile edits.":"Registry visibility and prompt policy cannot substitute for per-client authorization."},"learning_note":"Different surfaces need not imply different model weights, but may require distinct tool identities.","hint":"Identify what the evidence establishes; separate hypotheses from controlled decisions.","evidence":[],"quality":"curated","source":"Field manual · architecture boundaries, measurement and safe execution","original_answer_text":"Use one model inference service with per-client harness policies and separate scoped tool executors."},{"id":"stack-v2-L3-03","module":"stack","level":3,"difficulty":"judgment","lesson":2,"term":"tokenizer","scenario":"A change request says “upgrade the model server to fix incorrect tool calls.” Logs instead show a custom chat template introduced on the same day; model revision and engine digest are unchanged.","question":"What is the most defensible change-control action?","options":["Rollback or A/B-test the template against fixed tool-call cases before changing the engine.","Upgrade the inference engine first, then retest the same prompt with the new chat template.","Change the decoding settings and template together to restore the previous tool-call frequency.","Keep template B and compensate with a post-processor that guesses missing role delimiters."],"answer":"Rollback or A/B-test the template against fixed tool-call cases before changing the engine.","explanation":"The changed serialization artifact is the nearest supported cause; isolate one variable and measure regressions.","distractor_notes":{"Upgrade the inference engine first, then retest the same prompt with the new chat template.":"The engine is unchanged and changing it first confounds the obvious template regression.","Change the decoding settings and template together to restore the previous tool-call frequency.":"Joint changes do not isolate the representation fault.","Keep template B and compensate with a post-processor that guesses missing role delimiters.":"Heuristic repair of broken role separation can hide unsafe semantics and lacks an independent test baseline."},"learning_note":"Version tokenizer/template, model revision and serving behavior as distinct change units.","hint":"Identify what the evidence establishes; separate hypotheses from controlled decisions.","evidence":[],"quality":"curated","source":"Field manual · architecture boundaries, measurement and safe execution","original_answer_text":"Rollback or A/B-test the template against fixed tool-call cases before changing the engine."},{"id":"stack-v2-L3-04","module":"stack","level":3,"difficulty":"judgment","lesson":3,"term":"sandbox","scenario":"A vendor claims “containerized tools are isolated.” Your security review discovers host Docker socket access and a writable host mount for a read-only retrieval tool.","question":"Which decision best matches the system threat model?","options":["Restrict host mounts/privileges and verify explicit denial tests.","Keep the host mounts, but require signed tool requests from the harness before using them.","Run the same privileged image under a non-root entrypoint while retaining Docker socket access.","Remove public network access but retain writable management mounts for faster diagnostics."],"answer":"Restrict host mounts/privileges and verify explicit denial tests.","explanation":"Isolation is defined by effective mounts, devices, network and permissions. Host control paths defeat claimed separation.","distractor_notes":{"Keep the host mounts, but require signed tool requests from the harness before using them.":"Signed requests do not reduce the host control granted by unnecessary mounts.","Run the same privileged image under a non-root entrypoint while retaining Docker socket access.":"A Docker socket can expose host-level privileges despite process UID.","Remove public network access but retain writable management mounts for faster diagnostics.":"Egress restriction helps, but does not eliminate the writable host management path."},"learning_note":"Require a negative test proving that a retrieved instruction cannot reach host secrets or management sockets.","hint":"Identify what the evidence establishes; separate hypotheses from controlled decisions.","evidence":[],"quality":"curated","source":"Field manual · architecture boundaries, measurement and safe execution","original_answer_text":"Remove unnecessary host capabilities, separate the read-only tool identity and verify denial tests before approval."},{"id":"stack-v2-L3-05","module":"stack","level":3,"difficulty":"judgment","lesson":4,"term":"evaluation harness","scenario":"A product team proposes shipping after a 95% accuracy benchmark. The architecture review finds that the model API can call deployment functions without an intermediate authorization check.","question":"What should the release decision prioritize?","options":["Block deployment until trusted authorization and action auditing are enforced and tested, regardless of answer accuracy.","Release behind a feature flag and monitor tool calls, leaving the existing executor authorization unchanged.","Restrict model temperature and tool selection, then assume unapproved operations will be rare enough.","Limit model API access to employees but retain direct deployment capability for every authenticated user."],"answer":"Block deployment until trusted authorization and action auditing are enforced and tested, regardless of answer accuracy.","explanation":"Quality scores do not compensate for an open privileged execution path.","distractor_notes":{"Release behind a feature flag and monitor tool calls, leaving the existing executor authorization unchanged.":"Flags and monitoring are not independently enforced authorization for side effects.","Restrict model temperature and tool selection, then assume unapproved operations will be rare enough.":"Probability reduction cannot replace a binding permission decision.","Limit model API access to employees but retain direct deployment capability for every authenticated user.":"Authentication without fine-grained authorization permits improper operations."},"learning_note":"Treat safety and trace requirements as independent release gates.","hint":"Identify what the evidence establishes; separate hypotheses from controlled decisions.","evidence":[],"quality":"curated","source":"Field manual · architecture boundaries, measurement and safe execution","original_answer_text":"Block deployment until trusted authorization and action auditing are enforced and tested, regardless of answer accuracy."},{"id":"stack-v2-L3-06","module":"stack","level":3,"difficulty":"judgment","lesson":5,"term":"model API","scenario":"A deployment moves inference from an on-prem GPU to a hosted API. Existing retrieval data is sensitive, and tool execution remains local.","question":"Which migration plan addresses the most important boundary changes?","options":["Review data flow, local authority, API behavior and regression evidence.","Keep local tools but send the complete retrieved context to the hosted endpoint for feature parity.","Move inference first, then run compatibility and data-flow tests only if production errors appear.","Encrypt the outbound prompt but assume a compatible HTTP schema preserves tool behavior."],"answer":"Review data flow, local authority, API behavior and regression evidence.","explanation":"Changing inference location alters information flow and capability compatibility while not transferring local execution authority.","distractor_notes":{"Keep local tools but send the complete retrieved context to the hosted endpoint for feature parity.":"Sensitive context may violate residency and minimization policy even with local tool execution.","Move inference first, then run compatibility and data-flow tests only if production errors appear.":"Unverified migrations expose users before controls and evaluations are established.","Encrypt the outbound prompt but assume a compatible HTTP schema preserves tool behavior.":"Encryption in transit does not address provider data processing or behavioral incompatibilities."},"learning_note":"Write a boundary-by-boundary migration checklist, not just an endpoint-change checklist.","hint":"Identify what the evidence establishes; separate hypotheses from controlled decisions.","evidence":[],"quality":"curated","source":"Field manual · architecture boundaries, measurement and safe execution","original_answer_text":"Review data residency and API behavior, minimize transmitted context, preserve local tool authorization, and rerun task/security evaluations."},{"id":"models-v2-L2-01","module":"models","level":2,"difficulty":"applied","lesson":0,"term":"tokenizer","scenario":"A 1,500-word policy document costs 2,300 tokens on model A and 3,100 on model B, before chat messages are added.","question":"Which hypothesis is most consistent with the measurements?","options":["The tokenizers segment the same text differently; compare exact encoded tokens and template overhead.","Model B adds system/chat template overhead even when the encoded content is identical.","Model B has a shorter context window, requiring it to summarize the same policy into more segments.","Model B uses a larger model architecture and therefore allocates proportionally more token IDs."],"answer":"The tokenizers segment the same text differently; compare exact encoded tokens and template overhead.","explanation":"Tokenization depends on vocabulary and algorithm. Additional role/template tokens must be measured separately.","distractor_notes":{"Model B adds system/chat template overhead even when the encoded content is identical.":"Template overhead could add tokens, but the stated difference is measured before chat messages are added.","Model B has a shorter context window, requiring it to summarize the same policy into more segments.":"A context limit does not by itself increase the content tokenization count.","Model B uses a larger model architecture and therefore allocates proportionally more token IDs.":"Parameter count and tokenizer segmentation are independent design choices."},"learning_note":"Measure total request tokens, not a word-to-token conversion constant.","hint":"Identify what the evidence establishes; separate hypotheses from controlled decisions.","evidence":[["Input","A","B"],["Policy words","1,500","1,500"],["Content tokens","2,300","3,100"]],"quality":"curated","source":"Field manual · architecture boundaries, measurement and safe execution","original_answer_text":"The tokenizers segment the same text differently; compare exact encoded tokens and template overhead."},{"id":"models-v2-L2-02","module":"models","level":2,"difficulty":"applied","lesson":1,"term":"weights","scenario":"Two deployments use identical weights and decoding settings, but answer differently after one adds retrieval passages. No training run occurred.","question":"What changed most directly?","options":["The conditional input context changed, not the learned weights.","The serving runtime changed hidden sampler settings because retrieval increases token count.","The retrieval index updated the model weights through an implicit adaptation step.","The response difference proves that the training checkpoint changed between calls."],"answer":"The conditional input context changed, not the learned weights.","explanation":"New evidence in the prompt changes the conditional distribution without changing parameters.","distractor_notes":{"The serving runtime changed hidden sampler settings because retrieval increases token count.":"Decoder configuration is stated identical; input context is the observed changed variable.","The retrieval index updated the model weights through an implicit adaptation step.":"Retrieval adds evidence to a prompt rather than performing gradient updates.","The response difference proves that the training checkpoint changed between calls.":"Different responses with the same weights are normal under changed context."},"learning_note":"Use model digest and retrieved source IDs in the same reproducibility manifest.","hint":"Identify what the evidence establishes; separate hypotheses from controlled decisions.","evidence":[],"quality":"curated","source":"Field manual · architecture boundaries, measurement and safe execution","original_answer_text":"The conditional input context changed, not the learned weights."},{"id":"models-v2-L2-03","module":"models","level":2,"difficulty":"applied","lesson":2,"term":"attention","scenario":"A 32K-token input produces a slower first token than a 4K input on the same model and GPU. Output lengths remain similar.","question":"Which phenomenon should the analysis isolate?","options":["Extra prefill/attention work and cache allocation before the first generated token.","Longer decode sequences despite identical reported output-token counts.","A larger retrieval index used only during answer generation after first-token emission.","Model weight loading on every request, even though cold-start behavior was not observed."],"answer":"Extra prefill/attention work and cache allocation before the first generated token.","explanation":"Longer inputs require processing and caching more contextual positions; measure actual TTFT and memory.","distractor_notes":{"Longer decode sequences despite identical reported output-token counts.":"The output length is similar; the observed regression is in TTFT.","A larger retrieval index used only during answer generation after first-token emission.":"Retrieval and prefill can affect TTFT, not just later generation.","Model weight loading on every request, even though cold-start behavior was not observed.":"Cold load is a potential component of TTFT but has not been shown to track prompt length."},"learning_note":"Different attention architectures have different scaling; benchmark rather than assume a fixed factor.","hint":"Identify what the evidence establishes; separate hypotheses from controlled decisions.","evidence":[],"quality":"curated","source":"Field manual · architecture boundaries, measurement and safe execution","original_answer_text":"Extra prefill/attention work and cache allocation before the first generated token."},{"id":"models-v2-L2-04","module":"models","level":2,"difficulty":"applied","lesson":3,"term":"temperature","scenario":"With model/configuration fixed, greedy output repeats in one test but varies after a new serving backend release.","question":"Which conclusion is technically justified?","options":["Temperature zero does not guarantee bit-for-bit reproducibility across runtime and kernel changes.","Greedy decoding is deterministic whenever model weights and prompt text are unchanged, irrespective of backend.","The different server always replaces sampling with top-p when temperature is set to zero.","The output variation proves the new backend changed the checkpoint despite an unchanged digest."],"answer":"Temperature zero does not guarantee bit-for-bit reproducibility across runtime and kernel changes.","explanation":"Kernel numerics, tie behavior and serving changes can influence output; compare frozen artifact and execution metadata.","distractor_notes":{"Greedy decoding is deterministic whenever model weights and prompt text are unchanged, irrespective of backend.":"Backend arithmetic and tie-breaking can alter numerical output despite the same text and weights.","The different server always replaces sampling with top-p when temperature is set to zero.":"Such a configuration change would need evidence; backend numerics remain an independent possibility.","The output variation proves the new backend changed the checkpoint despite an unchanged digest.":"Matching model digest is evidence against a weight change, though all artifacts should be checked."},"learning_note":"Log model, tokenizer, chat template, backend, seed where supported and exact request.","hint":"Identify what the evidence establishes; separate hypotheses from controlled decisions.","evidence":[],"quality":"curated","source":"Field manual · architecture boundaries, measurement and safe execution","original_answer_text":"Temperature zero does not guarantee bit-for-bit reproducibility across runtime and kernel changes."},{"id":"models-v2-L2-05","module":"models","level":2,"difficulty":"applied","lesson":4,"term":"fine-tuning","scenario":"A user asks whether a billing policy changed yesterday. Team A proposes fine-tuning monthly; Team B proposes retrieval against versioned policy documents.","question":"Which distinction supports Team B?","options":["Retrieval provides current, attributable facts without treating weight adaptation as a live policy database.","Fine-tune a policy adapter after every update so the answer is grounded in the newest trained state.","Put the most recently retrieved policy text into context but omit version and approval metadata.","Use retrieval for all policies but disable abstention because the index always has at least one match."],"answer":"Retrieval provides current, attributable facts without treating weight adaptation as a live policy database.","explanation":"Changing factual records are generally better represented as governed external sources with timestamps and access control.","distractor_notes":{"Fine-tune a policy adapter after every update so the answer is grounded in the newest trained state.":"Frequent weight adaptation is still harder to attribute/freshness-check than authoritative source retrieval.","Put the most recently retrieved policy text into context but omit version and approval metadata.":"Recency without provenance and authority can still select the wrong policy.","Use retrieval for all policies but disable abstention because the index always has at least one match.":"A retrieved match is not necessarily applicable, current or sufficient."},"learning_note":"Still validate source authority and cited claim, not merely retrieval success.","hint":"Identify what the evidence establishes; separate hypotheses from controlled decisions.","evidence":[],"quality":"curated","source":"Field manual · architecture boundaries, measurement and safe execution","original_answer_text":"Retrieval provides current, attributable facts without treating weight adaptation as a live policy database."},{"id":"models-v2-L2-06","module":"models","level":2,"difficulty":"applied","lesson":5,"term":"hallucination","scenario":"A model gives a fluent answer with precise citations, but one cited source has no matching passage and another has expired.","question":"Which evidence check is missing?","options":["Independent verification that each factual claim is supported by an authoritative current source.","Require citations to valid-looking links and treat the answer correct when references resolve.","Run the same model answer repeatedly and accept claims that are stable across samples.","Ask a second model to agree with the cited answer without retrieving independent evidence."],"answer":"Independent verification that each factual claim is supported by an authoritative current source.","explanation":"A well-formed citation does not prove the underlying claim or the source version.","distractor_notes":{"Require citations to valid-looking links and treat the answer correct when references resolve.":"A link can resolve yet point to expired or contradictory source content.","Run the same model answer repeatedly and accept claims that are stable across samples.":"Stable language is not factual correctness.","Ask a second model to agree with the cited answer without retrieving independent evidence.":"Model agreement is not independent source verification."},"learning_note":"Include abstention and citation-support scoring in evaluations.","hint":"Identify what the evidence establishes; separate hypotheses from controlled decisions.","evidence":[],"quality":"curated","source":"Field manual · architecture boundaries, measurement and safe execution","original_answer_text":"Independent verification that each factual claim is supported by an authoritative current source."},{"id":"models-v2-L3-01","module":"models","level":3,"difficulty":"judgment","lesson":0,"term":"tokenizer","scenario":"A production upgrade provides a larger context window but changes tokenizer and chat template. Structured tools must remain reliable; rollbacks must be safe.","question":"Which acceptance gate is sufficient to justify the upgrade?","options":["Version both representation artifacts and compare role/tool parsing, truncation and task results on frozen cases before rollout.","Validate that the new weights load and the advertised context length passes a single stress test.","Compare only final text accuracy on existing fixtures, without replaying serialized tool/role tokens.","Pin the tokenizer but allow automatic template updates; regression-test only when parsing errors appear."],"answer":"Version both representation artifacts and compare role/tool parsing, truncation and task results on frozen cases before rollout.","explanation":"Representation compatibility is an explicit interface contract; capacity alone is not functional correctness.","distractor_notes":{"Validate that the new weights load and the advertised context length passes a single stress test.":"Loading and maximum length do not prove role/tool behavior.","Compare only final text accuracy on existing fixtures, without replaying serialized tool/role tokens.":"Text-only outcomes miss serialization and structured tool-call regressions.","Pin the tokenizer but allow automatic template updates; regression-test only when parsing errors appear.":"Unversioned template updates are themselves a material compatibility risk."},"learning_note":"Capture a reproducible serialized request for every important tool-path regression.","hint":"Identify what the evidence establishes; separate hypotheses from controlled decisions.","evidence":[],"quality":"curated","source":"Field manual · architecture boundaries, measurement and safe execution","original_answer_text":"Version both representation artifacts and compare role/tool parsing, truncation and task results on frozen cases before rollout."},{"id":"models-v2-L3-02","module":"models","level":3,"difficulty":"judgment","lesson":1,"term":"weights","scenario":"An organization wants personalized writing style and frequently updated customer facts. The security team will not permit stale financial figures in responses.","question":"What is the most defensible split?","options":["Use retrieval for changing facts, with selective behavioral adaptation.","Fine-tune frequently on account facts, using the latest training checkpoint as the sole source of truth.","Retrieve current facts but put every customer record into shared context to reduce per-user indexing cost.","Use a style adapter and rely on its latent knowledge for changing financial facts unless users complain."],"answer":"Use retrieval for changing facts, with selective behavioral adaptation.","explanation":"Separate persistent factual evidence from weight-shaped behavior; enforce identity and freshness outside the model.","distractor_notes":{"Fine-tune frequently on account facts, using the latest training checkpoint as the sole source of truth.":"Weight updates are not an authoritative live fact store and can lag corrections.","Retrieve current facts but put every customer record into shared context to reduce per-user indexing cost.":"Unscoped retrieval exposes data across identity boundaries.","Use a style adapter and rely on its latent knowledge for changing financial facts unless users complain.":"A behavior adapter does not guarantee factual freshness or correct attribution."},"learning_note":"Write distinct retention/permissions policies for retrieved facts, adapter assets and conversation data.","hint":"Identify what the evidence establishes; separate hypotheses from controlled decisions.","evidence":[],"quality":"curated","source":"Field manual · architecture boundaries, measurement and safe execution","original_answer_text":"Use controlled retrieval for changing customer facts, consider fine-tuning only for stable behavior, and verify all outputs."},{"id":"models-v2-L3-03","module":"models","level":3,"difficulty":"judgment","lesson":2,"term":"attention","scenario":"A long-context model claims 128K support. Evaluation accuracy on document-specific exceptions falls sharply after 48K while token capacity never overflows.","question":"What is the best engineering decision?","options":["Treat effective context quality as workload dependent; test retrieval/reranking and targeted context assembly against the long-prompt baseline.","Keep the full long prompt and optimize attention kernels, evaluating only latency reductions.","Increase the advertised context limit and reduce retrieval so the model sees all potential evidence.","Move passages closer to the prompt start without testing position effects or citation support."],"answer":"Treat effective context quality as workload dependent; test retrieval/reranking and targeted context assembly against the long-prompt baseline.","explanation":"Advertised capacity is not a correctness guarantee. Compare quality and cost with controlled task-specific evidence selection.","distractor_notes":{"Keep the full long prompt and optimize attention kernels, evaluating only latency reductions.":"Compute optimization does not resolve observed exception-answer quality by itself.","Increase the advertised context limit and reduce retrieval so the model sees all potential evidence.":"More raw input can increase distraction and cost without effective recall.","Move passages closer to the prompt start without testing position effects or citation support.":"Reordering is a candidate intervention but requires controlled quality evidence."},"learning_note":"Track answer accuracy by evidence position, prompt length and retrieval slice.","hint":"Identify what the evidence establishes; separate hypotheses from controlled decisions.","evidence":[],"quality":"curated","source":"Field manual · architecture boundaries, measurement and safe execution","original_answer_text":"Treat effective context quality as workload dependent; test retrieval/reranking and targeted context assembly against the long-prompt baseline."},{"id":"models-v2-L3-04","module":"models","level":3,"difficulty":"judgment","lesson":3,"term":"logits","scenario":"A system uses temperature 0 for repeatable financial extraction; one backend update changes a minority of edge-case amounts. Regulatory review requires explainability.","question":"Which action best controls the risk?","options":["Pin artifacts and verify edge amounts against authoritative calculations.","Keep temperature zero and pin the model name, trusting backend-level determinism.","Compare average extraction accuracy and accept the upgrade if the global mean improves.","Use a stronger reviewer model to validate disputed amounts without authoritative recomputation."],"answer":"Pin artifacts and verify edge amounts against authoritative calculations.","explanation":"Numerical determinism is conditional and extraction correctness requires an external oracle and trace.","distractor_notes":{"Keep temperature zero and pin the model name, trusting backend-level determinism.":"A model name and decoding setting are insufficient version and numeric determinism guarantees.","Compare average extraction accuracy and accept the upgrade if the global mean improves.":"Rare but material edge-case regressions can be hidden by averages.","Use a stronger reviewer model to validate disputed amounts without authoritative recomputation.":"Model agreement does not replace a financial calculation oracle."},"learning_note":"Attach an amount-level accuracy slice and rollback threshold to the release gate.","hint":"Identify what the evidence establishes; separate hypotheses from controlled decisions.","evidence":[],"quality":"curated","source":"Field manual · architecture boundaries, measurement and safe execution","original_answer_text":"Pin versions, freeze regression fixtures, record parsed inputs and reconcile outputs against authoritative calculations."},{"id":"models-v2-L3-05","module":"models","level":3,"difficulty":"judgment","lesson":4,"term":"fine-tuning","scenario":"A small model with a task-specific adapter improves average score but regresses on legally sensitive negations; a hosted model is more costly but reliable on that slice.","question":"Which deployment choice is most defensible?","options":["Keep a measured routing/fallback path for high-risk cases; do not ship a blanket adapter swap based on average score.","Ship the adapter to every task, but add model self-confidence thresholds for the sensitive subset.","Route sensitive tasks to the local adapter and use the stronger model only for non-regulated traffic.","Keep the adapter for all tasks, adding a second adapter that votes on its uncertain outputs."],"answer":"Keep a measured routing/fallback path for high-risk cases; do not ship a blanket adapter swap based on average score.","explanation":"Segment risk, define acceptance per slice, and preserve externally enforced safeguards.","distractor_notes":{"Ship the adapter to every task, but add model self-confidence thresholds for the sensitive subset.":"Confidence from the same model is an unreliable risk gate.","Route sensitive tasks to the local adapter and use the stronger model only for non-regulated traffic.":"This reverses the observed reliability advantage on the sensitive subset.","Keep the adapter for all tasks, adding a second adapter that votes on its uncertain outputs.":"Correlated model behavior and unsupported regression remain unresolved."},"learning_note":"Combine quality, privacy, latency and review cost into the policy decision.","hint":"Identify what the evidence establishes; separate hypotheses from controlled decisions.","evidence":[],"quality":"curated","source":"Field manual · architecture boundaries, measurement and safe execution","original_answer_text":"Keep a measured routing/fallback path for high-risk cases; do not ship a blanket adapter swap based on average score."},{"id":"models-v2-L3-06","module":"models","level":3,"difficulty":"judgment","lesson":5,"term":"hallucination","scenario":"A RAG chatbot returns confident answers when sources disagree; the product team wants a single definitive answer for every question.","question":"What response contract best balances usefulness and accuracy?","options":["Cite competing evidence and abstain or escalate unresolved conflicts.","Return the most recent passage as the default answer while preserving a note about older conflicts.","Select the response with the strongest model probability and attach every conflicting citation.","Synthesize a single compromise policy from both sources and note that it is an interpretation."],"answer":"Cite competing evidence and abstain or escalate unresolved conflicts.","explanation":"Evidence authority and disagreement cannot be replaced by language fluency or a forced single answer.","distractor_notes":{"Return the most recent passage as the default answer while preserving a note about older conflicts.":"Recency does not determine governing authority or scope.","Select the response with the strongest model probability and attach every conflicting citation.":"Probability and number of citations do not resolve factual conflict.","Synthesize a single compromise policy from both sources and note that it is an interpretation.":"A compromise may invent terms that neither source authorizes."},"learning_note":"Grade handling of contradictions separately from ordinary factual QA.","hint":"Identify what the evidence establishes; separate hypotheses from controlled decisions.","evidence":[],"quality":"curated","source":"Field manual · architecture boundaries, measurement and safe execution","original_answer_text":"Require cited alternatives, explicit uncertainty and abstention or escalation when authoritative evidence conflicts."},{"id":"inference-v2-L2-01","module":"inference","level":2,"difficulty":"applied","lesson":0,"term":"TTFT","scenario":"A request spends 3.2 s waiting for its first token and then generates 120 output tokens in 2.0 s. Another request with the same output length has a much longer prompt.","question":"Which measurement isolates the likely source of the first-token regression?","options":["Split queue wait, model-load delay and prefill time from decode time.","Measure total response time and average output tokens/s; derive prefill indirectly as a fixed residual.","Compare GPU occupancy during decode only, assuming queue time is stable between the two inputs.","Profile only model loading because request prompt length should not affect TTFT once weights are warm."],"answer":"Split queue wait, model-load delay and prefill time from decode time.","explanation":"TTFT includes upstream queue and prefill; output rate alone cannot distinguish the latency phases.","distractor_notes":{"Measure total response time and average output tokens/s; derive prefill indirectly as a fixed residual.":"A single residual cannot separate variable queue/load/prefill components.","Compare GPU occupancy during decode only, assuming queue time is stable between the two inputs.":"Queue and prefill can vary independently and need their own spans.","Profile only model loading because request prompt length should not affect TTFT once weights are warm.":"Prompt length directly affects input processing even with warm weights."},"learning_note":"Build a timing waterfall with time-to-first-token and time-per-output-token.","hint":"Identify what the evidence establishes; separate hypotheses from controlled decisions.","evidence":[],"quality":"curated","source":"Field manual · architecture boundaries, measurement and safe execution","original_answer_text":"Split queue wait, model-load delay and prefill time from decode time."},{"id":"inference-v2-L2-02","module":"inference","level":2,"difficulty":"applied","lesson":1,"term":"KV cache","scenario":"A 7B model with ideal 4-bit weight packing needs ~3.5 GB of weights. A long-context, multi-user server uses far more device memory.","question":"Which additional allocation best explains the difference?","options":["Sequence-dependent KV cache plus buffers, mixed-precision tensors and allocator overhead.","Mixed-precision weights alone, because the model must duplicate weight tensors once per session.","Temporary input activations only, because attention cache remains constant across longer contexts.","Memory fragmentation only, because the ideal packed weights already include all sequence-dependent state."],"answer":"Sequence-dependent KV cache plus buffers, mixed-precision tensors and allocator overhead.","explanation":"Weight packing is a lower bound; concurrent context state often becomes dominant.","distractor_notes":{"Mixed-precision weights alone, because the model must duplicate weight tensors once per session.":"Some buffers are shared and weight duplication per session is not a general explanation.","Temporary input activations only, because attention cache remains constant across longer contexts.":"KV allocations grow with active sequence length and concurrency in the stated scenario.","Memory fragmentation only, because the ideal packed weights already include all sequence-dependent state.":"Fragmentation is real but does not account for all explicitly omitted cache/state allocations."},"learning_note":"Compute an explicit KV budget before choosing a max-context and concurrency target.","hint":"Identify what the evidence establishes; separate hypotheses from controlled decisions.","evidence":[],"quality":"curated","source":"Field manual · architecture boundaries, measurement and safe execution","original_answer_text":"Sequence-dependent KV cache plus buffers, mixed-precision tensors and allocator overhead."},{"id":"inference-v2-L2-03","module":"inference","level":2,"difficulty":"applied","lesson":2,"term":"GPU kernel","scenario":"A quantized model saves memory on CPU but inference slows down, and profiling shows frequent dequantization work.","question":"Which inference is supported?","options":["Quantization reduced footprint but the available backend lacks a sufficiently efficient compute path.","The quantized model must use a more accurate sampler that consumes additional compute per output token.","The memory footprint reduction necessarily lowered clock speeds through device power management.","The tokenizer changed as part of quantization, creating longer inputs for every task."],"answer":"Quantization reduced footprint but the available backend lacks a sufficiently efficient compute path.","explanation":"Packing benefits memory; execution speed depends on kernels and device support.","distractor_notes":{"The quantized model must use a more accurate sampler that consumes additional compute per output token.":"Sampling and quantization are distinct; profiling specifically implicates dequantization.","The memory footprint reduction necessarily lowered clock speeds through device power management.":"Device power behavior would need telemetry; dequantization is the observed contributor.","The tokenizer changed as part of quantization, creating longer inputs for every task.":"The statement does not show a tokenizer change and profiling points to execution kernels."},"learning_note":"Benchmark quantized and higher-precision variants under the same context, hardware and batch.","hint":"Identify what the evidence establishes; separate hypotheses from controlled decisions.","evidence":[],"quality":"curated","source":"Field manual · architecture boundaries, measurement and safe execution","original_answer_text":"Quantization reduced footprint but the available backend lacks a sufficiently efficient compute path."},{"id":"inference-v2-L2-04","module":"inference","level":2,"difficulty":"applied","lesson":3,"term":"quantization","scenario":"Two quantized model artifacts have similar file size. One runs faster but fails more code tests under the same prompts.","question":"Which comparison should guide a deployment decision?","options":["Measure per-task correctness, TTFT/throughput and peak memory for both versions on the target workload.","Use only output tokens/s because both files already fit and quality differences may be stochastic.","Compare peak GPU memory and model load time but defer task accuracy until after selection.","Choose the artifact with lower quantization error on a small numeric calibration set instead of end-to-end code tests."],"answer":"Measure per-task correctness, TTFT/throughput and peak memory for both versions on the target workload.","explanation":"Quantization schemes can change quality and kernel efficiency independently.","distractor_notes":{"Use only output tokens/s because both files already fit and quality differences may be stochastic.":"The observed code regression is a task-level quality signal that must be included.","Compare peak GPU memory and model load time but defer task accuracy until after selection.":"Memory and loading are useful but omit the demonstrated failure in code tasks.","Choose the artifact with lower quantization error on a small numeric calibration set instead of end-to-end code tests.":"Calibration error is not necessarily a proxy for actual task completion quality."},"learning_note":"Record an explicit quality/latency/memory frontier, not a single benchmark number.","hint":"Identify what the evidence establishes; separate hypotheses from controlled decisions.","evidence":[],"quality":"curated","source":"Field manual · architecture boundaries, measurement and safe execution","original_answer_text":"Measure per-task correctness, TTFT/throughput and peak memory for both versions on the target workload."},{"id":"inference-v2-L2-05","module":"inference","level":2,"difficulty":"applied","lesson":4,"term":"continuous batching","scenario":"A continuous-batching change raises aggregate throughput from 430 to 610 tokens/s, but p95 completion latency rises from 4 s to 11 s.","question":"What conclusion follows?","options":["Aggregate capacity improved while tail user experience worsened; inspect scheduling fairness and queueing.","The change is a success because aggregate tokens/s gained more percentage points than p95 latency lost.","The new backend should be selected for all traffic if median latency stays below the SLO.","The slowdown must be a model-quality regression because throughput and p95 moved in opposite directions."],"answer":"Aggregate capacity improved while tail user experience worsened; inspect scheduling fairness and queueing.","explanation":"Throughput, latency distribution and task success are separate service dimensions.","distractor_notes":{"The change is a success because aggregate tokens/s gained more percentage points than p95 latency lost.":"A rate and latency in different units cannot be offset as percentages; p95 may violate an independent gate.","The new backend should be selected for all traffic if median latency stays below the SLO.":"The service objective is p95; median does not clear a failed tail target.","The slowdown must be a model-quality regression because throughput and p95 moved in opposite directions.":"Queueing/scheduling can explain the observed latency without changing task correctness."},"learning_note":"Review p50/p95, short/long prompt fairness and cancellation behavior.","hint":"Identify what the evidence establishes; separate hypotheses from controlled decisions.","evidence":[["Metric","Before","After"],["Throughput","430 tok/s","610 tok/s"],["p95 completion","4 s","11 s"]],"quality":"curated","source":"Field manual · architecture boundaries, measurement and safe execution","original_answer_text":"Aggregate capacity improved while tail user experience worsened; inspect scheduling fairness and queueing."},{"id":"inference-v2-L2-06","module":"inference","level":2,"difficulty":"applied","lesson":5,"term":"throughput","scenario":"A vendor demonstrates 95 tokens/s on one warm interactive request; your service needs 8 concurrent long-prompt users.","question":"Which missing test most directly addresses production capacity?","options":["Run a controlled 1/4/8-user workload with realistic input lengths, cache state, p95 latency and peak memory.","Estimate eight-user capacity from the one-user warm rate and then confirm only average latency.","Repeat the single-user test with a larger context window but unchanged concurrency.","Benchmark eight short prompts only because they reach the desired concurrent request count."],"answer":"Run a controlled 1/4/8-user workload with realistic input lengths, cache state, p95 latency and peak memory.","explanation":"Serving behavior is scheduler- and memory-dependent; extrapolation from one warm request is unreliable.","distractor_notes":{"Estimate eight-user capacity from the one-user warm rate and then confirm only average latency.":"Throughput scaling is nonlinear and tail/memory behavior remains unmeasured.","Repeat the single-user test with a larger context window but unchanged concurrency.":"This tests context alone, not contention at eight clients.","Benchmark eight short prompts only because they reach the desired concurrent request count.":"Short-prompt concurrency omits the long-prefill target workload."},"learning_note":"Declare warm/cold cache, output length, concurrency and workload mix for every published number.","hint":"Identify what the evidence establishes; separate hypotheses from controlled decisions.","evidence":[],"quality":"curated","source":"Field manual · architecture boundaries, measurement and safe execution","original_answer_text":"Run a controlled 1/4/8-user workload with realistic input lengths, cache state, p95 latency and peak memory."},{"id":"inference-v2-L3-01","module":"inference","level":3,"difficulty":"judgment","lesson":0,"term":"TTFT","scenario":"A legal-search service must satisfy p95 TTFT < 2s. Long queries have 8K tokens and must retain all authorized sources; current TTFT is 4s.","question":"Which intervention should be evaluated first without weakening evidence integrity?","options":["Profile queue/prefill, then compare task-aware evidence selection or prefix reuse against fixed recall requirements.","Reduce retrieved context uniformly to meet TTFT and accept the existing accuracy benchmark without re-evaluating.","Optimize decode kernels and output length before investigating slow initial-token latency.","Introduce priority queueing for all requests but leave prefill size and evidence recall unmeasured."],"answer":"Profile queue/prefill, then compare task-aware evidence selection or prefix reuse against fixed recall requirements.","explanation":"Reduce unnecessary input work only with evidence-preservation checks; optimize the actual TTFT component.","distractor_notes":{"Reduce retrieved context uniformly to meet TTFT and accept the existing accuracy benchmark without re-evaluating.":"Blind context reduction may eliminate critical legal sources; evidence recall is a hard requirement.","Optimize decode kernels and output length before investigating slow initial-token latency.":"Decode optimizations target later tokens rather than the diagnosed prefill/queue interval.","Introduce priority queueing for all requests but leave prefill size and evidence recall unmeasured.":"Queueing can help but does not isolate whether long prefill is dominant or preserve evidence quality."},"learning_note":"Set joint gates for evidence recall, time-to-first-token and access control.","hint":"Identify what the evidence establishes; separate hypotheses from controlled decisions.","evidence":[],"quality":"curated","source":"Field manual · architecture boundaries, measurement and safe execution","original_answer_text":"Profile queue/prefill, then compare task-aware evidence selection or prefix reuse against fixed recall requirements."},{"id":"inference-v2-L3-02","module":"inference","level":3,"difficulty":"judgment","lesson":1,"term":"KV cache","scenario":"A hypothetical 28-layer GQA model uses 8 KV heads, head dim 128, FP16 KV. One 4K-token sequence needs ~448 MiB KV; product requires eight 16K sequences.","question":"Which planning estimate is defensible before adding weights and serving overhead?","options":["About 14 GiB of KV state, before weights and overhead.","Reserve 3.5 GiB for weight memory and 448 MiB for KV, because most prefixes are reusable.","Reserve 1.75 GiB for KV, assuming the 16K sequence cache is shared among eight separate users.","Reserve 14 GiB as the complete GPU budget, because the stated formula includes engine overhead."],"answer":"About 14 GiB of KV state, before weights and overhead.","explanation":"4× context and 8× sequences scale the illustrative per-sequence KV by 32: 448 MiB × 32 ≈ 14 GiB.","distractor_notes":{"Reserve 3.5 GiB for weight memory and 448 MiB for KV, because most prefixes are reusable.":"Even cached shared prefixes do not make independent user KV free.","Reserve 1.75 GiB for KV, assuming the 16K sequence cache is shared among eight separate users.":"Per-sequence KV must be multiplied by active concurrent sequences.","Reserve 14 GiB as the complete GPU budget, because the stated formula includes engine overhead.":"The 14 GiB estimate is KV only; weights and runtime memory remain additional."},"learning_note":"Use the actual model KV geometry, precision, scheduler limits and observed fragmentation.","hint":"Identify what the evidence establishes; separate hypotheses from controlled decisions.","evidence":[["Assumption","Baseline","Target"],["Context","4,096","16,384"],["Sequences","1","8"],["KV baseline","448 MiB","?"]],"quality":"curated","source":"Field manual · architecture boundaries, measurement and safe execution","original_answer_text":"Approximately 14 GiB of KV state, with an extra safety margin and live peak-memory test."},{"id":"inference-v2-L3-03","module":"inference","level":3,"difficulty":"judgment","lesson":2,"term":"GPU kernel","scenario":"Two kernel implementations improve throughput, but a finance grader finds a small reproducibility regression for edge values. Live SLO is already met.","question":"Which change-control decision is strongest?","options":["Hold the faster kernel pending error analysis and task-level regression evidence, then canary with rollback.","Ship to a 1% canary immediately, relying on live financial-user reports for numerical regression detection.","Accept the faster kernel after aggregate success passes, excluding the affected edge-value fixture.","Roll back all kernel optimizations permanently without isolating the precision or workload condition."],"answer":"Hold the faster kernel pending error analysis and task-level regression evidence, then canary with rollback.","explanation":"Numerical changes can matter even if most tasks are faster; speed is not sufficient acceptance evidence.","distractor_notes":{"Ship to a 1% canary immediately, relying on live financial-user reports for numerical regression detection.":"High-stakes correctness should be verified before exposing real users to known regressions.","Accept the faster kernel after aggregate success passes, excluding the affected edge-value fixture.":"Deleting the failing slice hides the exact issue the release gate should detect.","Roll back all kernel optimizations permanently without isolating the precision or workload condition.":"Permanent rejection skips a controlled investigation of a potentially safe targeted implementation."},"learning_note":"Freeze model, prompt, precision and test cases when evaluating kernel substitutions.","hint":"Identify what the evidence establishes; separate hypotheses from controlled decisions.","evidence":[],"quality":"curated","source":"Field manual · architecture boundaries, measurement and safe execution","original_answer_text":"Hold the faster kernel pending error analysis and task-level regression evidence, then canary with rollback."},{"id":"inference-v2-L3-04","module":"inference","level":3,"difficulty":"judgment","lesson":3,"term":"quantization","scenario":"A model just fits in VRAM at 4-bit weights under a 4K prompt, but production requires 32K context and 4 concurrent clients. Purchasing a new GPU is costly.","question":"Which plan minimizes false confidence?","options":["Size total load memory; test cache geometry and admission limits.","Select 4-bit weights based on file fit, then dynamically raise context until the first OOM.","Use context offloading as the default without latency measurement, assuming VRAM is the only bottleneck.","Lower KV precision immediately, assuming quality and runtime support are equivalent across backends."],"answer":"Size total load memory; test cache geometry and admission limits.","explanation":"Weight fit is not a capacity guarantee; workload memory and quality require independent measurement.","distractor_notes":{"Select 4-bit weights based on file fit, then dynamically raise context until the first OOM.":"Testing only until failure can disrupt service and ignores concurrent target workload.","Use context offloading as the default without latency measurement, assuming VRAM is the only bottleneck.":"Offload can incur large latency penalties and may be unavailable.","Lower KV precision immediately, assuming quality and runtime support are equivalent across backends.":"KV compression changes numerical/state assumptions and requires tests."},"learning_note":"Make capacity estimates falsifiable and add an OOM recovery test.","hint":"Identify what the evidence establishes; separate hypotheses from controlled decisions.","evidence":[],"quality":"curated","source":"Field manual · architecture boundaries, measurement and safe execution","original_answer_text":"Size weights, KV per sequence and runtime buffers for target load; benchmark optimized cache precision or concurrency caps before procurement."},{"id":"inference-v2-L3-05","module":"inference","level":3,"difficulty":"judgment","lesson":4,"term":"continuous batching","scenario":"A shared inference service handles short interactive chats and 64K document jobs. One global queue maximizes aggregate throughput but starves interactive p95.","question":"What scheduling design should be tested?","options":["Workload-aware admission or priority scheduling with explicit fairness, budget and p95 gates.","Increase batch size globally and optimize aggregate tokens/s while reporting p50 interactive latency.","Use a single FIFO service queue but cap max output tokens for the interactive class.","Serve all short prompts through the long-job queue, with a larger GPU utilization target."],"answer":"Workload-aware admission or priority scheduling with explicit fairness, budget and p95 gates.","explanation":"Heterogeneous workloads have different latency constraints; controlled fairness is part of service engineering.","distractor_notes":{"Increase batch size globally and optimize aggregate tokens/s while reporting p50 interactive latency.":"The issue is interactive p95 fairness, not merely total throughput or median.","Use a single FIFO service queue but cap max output tokens for the interactive class.":"Output caps may help decode but do not isolate long prefill queue contention.","Serve all short prompts through the long-job queue, with a larger GPU utilization target.":"Higher utilization can coexist with worse tail responsiveness."},"learning_note":"Measure per-class p95 and throughput, not just fleet-wide averages.","hint":"Identify what the evidence establishes; separate hypotheses from controlled decisions.","evidence":[],"quality":"curated","source":"Field manual · architecture boundaries, measurement and safe execution","original_answer_text":"Workload-aware admission or priority scheduling with explicit fairness, budget and p95 gates."},{"id":"inference-v2-L3-06","module":"inference","level":3,"difficulty":"judgment","lesson":5,"term":"throughput","scenario":"You must choose between a $/token optimized backend and a slower backend that completes more end-to-end coding tasks correctly with fewer retries.","question":"What metric best supports an economic decision?","options":["Verified total cost per accepted task, including recovery and review.","Compare provider token prices, including prompt-cache discounts, but omit human review and task failures.","Select the backend with higher task accuracy, assuming retries and latency have no economic cost.","Choose by GPU-hour price and tokens/s under a synthetic prompt, then infer task-level spend."],"answer":"Verified total cost per accepted task, including recovery and review.","explanation":"Operational value comes from accepted outcomes, not isolated token efficiency.","distractor_notes":{"Compare provider token prices, including prompt-cache discounts, but omit human review and task failures.":"Unit token cost excludes important outcome costs.","Select the backend with higher task accuracy, assuming retries and latency have no economic cost.":"Quality alone may not justify operational expense without accepted-task economics.","Choose by GPU-hour price and tokens/s under a synthetic prompt, then infer task-level spend.":"Synthetic hardware efficiency does not fully represent workflows and recovery."},"learning_note":"Publish quality and cost together with the workload and acceptance criteria.","hint":"Identify what the evidence establishes; separate hypotheses from controlled decisions.","evidence":[],"quality":"curated","source":"Field manual · architecture boundaries, measurement and safe execution","original_answer_text":"Total verified cost per successful task, including retries, review and infrastructure overhead."},{"id":"local-v2-L2-01","module":"local","level":2,"difficulty":"applied","lesson":0,"term":"model artifact","scenario":"A GGUF artifact loads in one server but not another. Both advertise an OpenAI-style HTTP endpoint.","question":"What compatibility question should be asked first?","options":["Whether the engine supports that model architecture, quantization format and tokenizer/chat template.","Whether both endpoints support the same HTTP request fields, regardless of model file loader.","Whether the target GPU has enough VRAM, treating format support as identical across engines.","Whether the UI can list the artifact, taking catalogue visibility as a loadability check."],"answer":"Whether the engine supports that model architecture, quantization format and tokenizer/chat template.","explanation":"HTTP interface compatibility does not guarantee model format or operator compatibility.","distractor_notes":{"Whether both endpoints support the same HTTP request fields, regardless of model file loader.":"HTTP compatibility is independent of format/operator compatibility.","Whether the target GPU has enough VRAM, treating format support as identical across engines.":"Memory capacity cannot compensate for unsupported model layout or tokenizer semantics.","Whether the UI can list the artifact, taking catalogue visibility as a loadability check.":"Discovery metadata does not prove executable loading support."},"learning_note":"Separate model artifacts, runtime support and API contract in the deployment manifest.","hint":"Identify what the evidence establishes; separate hypotheses from controlled decisions.","evidence":[],"quality":"curated","source":"Field manual · architecture boundaries, measurement and safe execution","original_answer_text":"Whether the engine supports that model architecture, quantization format and tokenizer/chat template."},{"id":"local-v2-L2-02","module":"local","level":2,"difficulty":"applied","lesson":1,"term":"serving layer","scenario":"A local serving benchmark reports 62 tokens/s with a single client but drops sharply under eight simultaneous requests.","question":"Which subsystem deserves first investigation?","options":["Server admission, batching, memory scheduling and concurrent workload profiles.","The individual model weights, because concurrency alters the learned parameters after each request.","The model tokenizer, because eight clients necessarily multiply the token IDs for each user.","The frontend transport, because an 8× request count always creates an 8× network latency increase."],"answer":"Server admission, batching, memory scheduling and concurrent workload profiles.","explanation":"Concurrency introduces queue and cache constraints; inspect serving behavior before unrelated UX changes.","distractor_notes":{"The individual model weights, because concurrency alters the learned parameters after each request.":"Concurrency does not change model parameters.","The model tokenizer, because eight clients necessarily multiply the token IDs for each user.":"Tokenization is per request; contention is mainly scheduling/memory, not altered encoded IDs.","The frontend transport, because an 8× request count always creates an 8× network latency increase.":"Networking may matter, but the given load shape points first to serving admission and resources."},"learning_note":"Measure p95 latency and peak KV usage under expected client counts.","hint":"Identify what the evidence establishes; separate hypotheses from controlled decisions.","evidence":[],"quality":"curated","source":"Field manual · architecture boundaries, measurement and safe execution","original_answer_text":"Server admission, batching, memory scheduling and concurrent workload profiles."},{"id":"local-v2-L2-03","module":"local","level":2,"difficulty":"applied","lesson":2,"term":"HTTP endpoint","scenario":"A development model HTTP server responds on localhost but is unreachable from a second machine. The deployment guide recommends binding it to 0.0.0.0.","question":"What must change besides its listening address?","options":["Add authenticated access, firewall/egress boundaries, quotas and safe transport for the exposed network surface.","Use firewall allowlists alone, relying on IP address as the only authorization boundary.","Add TLS to the model server but keep the API unauthenticated because only local models are hosted.","Expose behind a reverse proxy that authenticates users but has no usage quota or audit controls."],"answer":"Add authenticated access, firewall/egress boundaries, quotas and safe transport for the exposed network surface.","explanation":"Changing listener exposure creates a network security boundary; local weights do not imply secured APIs.","distractor_notes":{"Use firewall allowlists alone, relying on IP address as the only authorization boundary.":"IP restrictions are helpful but do not replace authenticated identities for shared services.","Add TLS to the model server but keep the API unauthenticated because only local models are hosted.":"Encryption does not grant or verify access rights.","Expose behind a reverse proxy that authenticates users but has no usage quota or audit controls.":"Authentication is necessary, but abuse controls and observability remain relevant for network exposure."},"learning_note":"Keep practice services loopback-only unless a threat model justifies remote access.","hint":"Identify what the evidence establishes; separate hypotheses from controlled decisions.","evidence":[],"quality":"curated","source":"Field manual · architecture boundaries, measurement and safe execution","original_answer_text":"Add authenticated access, firewall/egress boundaries, quotas and safe transport for the exposed network surface."},{"id":"local-v2-L2-04","module":"local","level":2,"difficulty":"applied","lesson":3,"term":"model server","scenario":"An updated local engine loads the weights but the client no longer receives streaming tool-call events in the expected format.","question":"What compatibility check best targets this regression?","options":["Compare endpoint stream events, tool-call serialization and error contracts with fixed tests across both versions.","Compare model weights and quantization versions only; identical weights imply stable event semantics.","Check endpoint HTTP status and plain completion text, postponing streaming tool tests.","Update the client SDK until it accepts the new response shape without validating semantic tool-call accuracy."],"answer":"Compare endpoint stream events, tool-call serialization and error contracts with fixed tests across both versions.","explanation":"“Compatible API” often describes only part of the request/response surface; test the actual contract.","distractor_notes":{"Compare model weights and quantization versions only; identical weights imply stable event semantics.":"Tool-call event formats are runtime/API behaviors distinct from weights.","Check endpoint HTTP status and plain completion text, postponing streaming tool tests.":"Transport and plain text do not test the broken feature.","Update the client SDK until it accepts the new response shape without validating semantic tool-call accuracy.":"Client compatibility can hide wrong or incomplete tool calls unless scored against known fixtures."},"learning_note":"Record model/engine version and the exact event sequence before a migration.","hint":"Identify what the evidence establishes; separate hypotheses from controlled decisions.","evidence":[],"quality":"curated","source":"Field manual · architecture boundaries, measurement and safe execution","original_answer_text":"Compare endpoint stream events, tool-call serialization and error contracts with fixed tests across both versions."},{"id":"local-v2-L2-05","module":"local","level":2,"difficulty":"applied","lesson":4,"term":"driver","scenario":"A local GPU driver update lets the system boot but inference falls back to CPU. The model artifact and app release are unchanged.","question":"Which evidence helps isolate the regression?","options":["Inspect device visibility, runtime backend selection, kernel/driver compatibility and measured GPU utilization.","Compare only final response accuracy; a CPU fallback has no security or hardware implications.","Measure GPU process memory alone; any nonzero allocation proves the intended kernels are active.","Upgrade the model server and model weights first so that device probing can run against the newest stack."],"answer":"Inspect device visibility, runtime backend selection, kernel/driver compatibility and measured GPU utilization.","explanation":"Compute backend availability is an independent infrastructure dependency.","distractor_notes":{"Compare only final response accuracy; a CPU fallback has no security or hardware implications.":"Quality can remain similar while compute silently moves to CPU and latency changes.","Measure GPU process memory alone; any nonzero allocation proves the intended kernels are active.":"Allocation does not establish the compute path or effective driver/kernel compatibility.","Upgrade the model server and model weights first so that device probing can run against the newest stack.":"Multiple changes confound a straightforward backend-selection regression."},"learning_note":"Pin the working driver/runtime combination until a controlled test validates an upgrade.","hint":"Identify what the evidence establishes; separate hypotheses from controlled decisions.","evidence":[],"quality":"curated","source":"Field manual · architecture boundaries, measurement and safe execution","original_answer_text":"Inspect device visibility, runtime backend selection, kernel/driver compatibility and measured GPU utilization."},{"id":"local-v2-L2-06","module":"local","level":2,"difficulty":"applied","lesson":5,"term":"health probe","scenario":"A model server returns HTTP 200 from /health while requests with the target model time out after a cold start.","question":"What operational check is missing?","options":["A readiness probe exercising model loading or a bounded inference request, separate from process liveness.","Extend /health to check that a PID exists and a port is listening, without issuing an inference request.","Use the model server’s successful startup message as evidence that the selected weights fit in memory.","Treat any HTTP 200 from the management endpoint as proof the target model can serve bounded requests."],"answer":"A readiness probe exercising model loading or a bounded inference request, separate from process liveness.","explanation":"Process liveness alone does not prove the model is loaded and can serve realistic work.","distractor_notes":{"Extend /health to check that a PID exists and a port is listening, without issuing an inference request.":"Process and port checks still test liveness, not target-model readiness.","Use the model server’s successful startup message as evidence that the selected weights fit in memory.":"Startup completion can precede model load or failure under real requests.","Treat any HTTP 200 from the management endpoint as proof the target model can serve bounded requests.":"General management health may not exercise the required model/backend path."},"learning_note":"Document readiness, liveness and workload health as separate signals.","hint":"Identify what the evidence establishes; separate hypotheses from controlled decisions.","evidence":[],"quality":"curated","source":"Field manual · architecture boundaries, measurement and safe execution","original_answer_text":"A readiness probe exercising model loading or a bounded inference request, separate from process liveness."},{"id":"local-v2-L3-01","module":"local","level":3,"difficulty":"judgment","lesson":0,"term":"model artifact","scenario":"A deployment must support two model formats, serve offline, and allow rapid rollback. Operators want to replace the inference engine during an incident.","question":"Which release strategy limits cross-layer breakage?","options":["Maintain tested model/engine/template compatibility matrices and immutable artifact digests with an offline rollback image.","Pin the REST schema and server version, then allow model format revisions to load opportunistically.","Keep the current engine and fetch compatible model artifacts during recovery when a loader fails.","Maintain one prebuilt engine per format, but choose the latest chat template dynamically on startup."],"answer":"Maintain tested model/engine/template compatibility matrices and immutable artifact digests with an offline rollback image.","explanation":"Reproducible compatibility and known-good rollback protect the entire inference path.","distractor_notes":{"Pin the REST schema and server version, then allow model format revisions to load opportunistically.":"API compatibility does not guarantee architecture/weight/template loading.","Keep the current engine and fetch compatible model artifacts during recovery when a loader fails.":"Online downloads violate the offline recovery requirement and are not reproducible.","Maintain one prebuilt engine per format, but choose the latest chat template dynamically on startup.":"Unpinned template changes can break roles and tool calls despite engine isolation."},"learning_note":"Test the recovery environment, not just successful steady-state serving.","hint":"Identify what the evidence establishes; separate hypotheses from controlled decisions.","evidence":[],"quality":"curated","source":"Field manual · architecture boundaries, measurement and safe execution","original_answer_text":"Maintain tested model/engine/template compatibility matrices and immutable artifact digests with an offline rollback image."},{"id":"local-v2-L3-02","module":"local","level":3,"difficulty":"judgment","lesson":1,"term":"serving layer","scenario":"A department needs interactive response p95 under 3 seconds and batch processing overnight. Current single shared worker meets throughput but misses daytime SLO.","question":"Which design should be evaluated before buying more hardware?","options":["Test priority classes or isolated service pools against p95.","Keep a single shared pool with larger batches and judge success by nightly throughput.","Prioritize interactive traffic but ignore fairness and starvation of overnight jobs.","Build separate pools immediately, without comparing utilization or measurable SLO trade-offs."],"answer":"Test priority classes or isolated service pools against p95.","explanation":"Scheduling isolation can address competing SLOs without immediately expanding compute.","distractor_notes":{"Keep a single shared pool with larger batches and judge success by nightly throughput.":"Larger batches can worsen interactive tail latency.","Prioritize interactive traffic but ignore fairness and starvation of overnight jobs.":"Unbounded priority can starve lower-priority work; fairness must be measured.","Build separate pools immediately, without comparing utilization or measurable SLO trade-offs.":"Physical separation may help but could waste capacity without evidence."},"learning_note":"Add explicit contention tests using both workload classes together.","hint":"Identify what the evidence establishes; separate hypotheses from controlled decisions.","evidence":[],"quality":"curated","source":"Field manual · architecture boundaries, measurement and safe execution","original_answer_text":"Separate admission/priority classes or service pools, then compare peak p95 and accepted throughput."},{"id":"local-v2-L3-03","module":"local","level":3,"difficulty":"judgment","lesson":2,"term":"HTTP endpoint","scenario":"A team needs limited partner access to a model server currently bound to loopback; data must remain restricted and use is audited.","question":"Which minimum architecture is defensible?","options":["Place an authenticated, rate-limited TLS gateway in front of a private model endpoint with per-partner scope and redacted logs.","Expose the raw model endpoint behind VPN access and rely on network membership as per-partner authorization.","Use a TLS reverse proxy with one shared secret for all partners and no per-user scopes or audit.","Publish the server through a web frontend, keeping inference requests unauthenticated for simplicity."],"answer":"Place an authenticated, rate-limited TLS gateway in front of a private model endpoint with per-partner scope and redacted logs.","explanation":"The gateway can enforce identity and quotas; the serving endpoint remains protected.","distractor_notes":{"Expose the raw model endpoint behind VPN access and rely on network membership as per-partner authorization.":"VPN reachability alone does not enforce partner identity, quotas or least privilege.","Use a TLS reverse proxy with one shared secret for all partners and no per-user scopes or audit.":"Encryption plus a shared secret lacks per-actor scope and accountable usage.","Publish the server through a web frontend, keeping inference requests unauthenticated for simplicity.":"Frontend authentication is bypassable when the backend endpoint is exposed directly."},"learning_note":"Threat-model request payloads, results, logs and secrets separately.","hint":"Identify what the evidence establishes; separate hypotheses from controlled decisions.","evidence":[],"quality":"curated","source":"Field manual · architecture boundaries, measurement and safe execution","original_answer_text":"Place an authenticated, rate-limited TLS gateway in front of a private model endpoint with per-partner scope and redacted logs."},{"id":"local-v2-L3-04","module":"local","level":3,"difficulty":"judgment","lesson":3,"term":"model server","scenario":"A backend upgrade improves latency, but structured outputs pass 98% instead of the required 99.5%. The previous engine meets both quality and SLO.","question":"Which release decision best follows an evidence gate?","options":["Hold rollout until structured-output validity meets its release gate.","Canary the new engine with latency gates only; investigate malformed outputs from production incidents.","Keep the faster engine but add retries to hide schema failures without changing acceptance thresholds.","Accept 98% schema validity by lowering the downstream contract requirement to current performance."],"answer":"Hold rollout until structured-output validity meets its release gate.","explanation":"A release threshold must be enforced independently; regressions are not erased by another metric improving.","distractor_notes":{"Canary the new engine with latency gates only; investigate malformed outputs from production incidents.":"The known contractual failure should block before broad rollout.","Keep the faster engine but add retries to hide schema failures without changing acceptance thresholds.":"Retries can compound latency/cost and may still yield wrong structure.","Accept 98% schema validity by lowering the downstream contract requirement to current performance.":"Redefining the gate does not demonstrate safe behavior for dependent consumers."},"learning_note":"Treat parse validity and semantic validity as distinct gates.","hint":"Identify what the evidence establishes; separate hypotheses from controlled decisions.","evidence":[["Metric","Required","Candidate"],["Schema valid","≥99.5%","98.0%"],["p95 latency","≤4s","2.7s"]],"quality":"curated","source":"Field manual · architecture boundaries, measurement and safe execution","original_answer_text":"Do not ship until schema regressions are understood and corrected; retain the known-good backend."},{"id":"local-v2-L3-05","module":"local","level":3,"difficulty":"judgment","lesson":4,"term":"driver","scenario":"A major OS update offers a faster GPU driver but risks disrupting a stable local AI service serving sensitive documents. No test GPU is available.","question":"Which operational plan preserves recoverability?","options":["Capture current versions/state, prepare verified rollback, stage an isolated canary window, and test service readiness plus real workload.","Stage the driver update and trust a successful GPU initialization test, postponing workload validation.","Upgrade the driver/kernel and model server together under a single maintenance change with snapshot only.","Keep the old driver indefinitely and skip evaluation of security or compatibility updates."],"answer":"Capture current versions/state, prepare verified rollback, stage an isolated canary window, and test service readiness plus real workload.","explanation":"Hardware/software compatibility changes need pre-change truth and end-to-end post-change proof.","distractor_notes":{"Stage the driver update and trust a successful GPU initialization test, postponing workload validation.":"GPU discovery does not prove end-to-end inference and tool behavior.","Upgrade the driver/kernel and model server together under a single maintenance change with snapshot only.":"A snapshot helps but simultaneous changes complicate diagnosis and still need tests.","Keep the old driver indefinitely and skip evaluation of security or compatibility updates.":"Avoiding all updates is not a lifecycle strategy and ignores future risks."},"learning_note":"Do not equate a successful package-manager transaction with a validated serving path.","hint":"Identify what the evidence establishes; separate hypotheses from controlled decisions.","evidence":[],"quality":"curated","source":"Field manual · architecture boundaries, measurement and safe execution","original_answer_text":"Capture current versions/state, prepare verified rollback, stage an isolated canary window, and test service readiness plus real workload."},{"id":"local-v2-L3-06","module":"local","level":3,"difficulty":"judgment","lesson":5,"term":"health probe","scenario":"A service passes readiness immediately after startup, then fails only under four concurrent long-context clients; auto-restart repeatedly causes more queued traffic.","question":"What is the best control redesign?","options":["Bound admission and restarts; monitor load and OOM recovery.","In
